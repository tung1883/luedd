<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Lüdd</title>
<style>
  /* bundled UI fonts (SIL OFL) — latin subsets, cover English + German */
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/ibm-plex-mono.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/ibm-plex-mono-600.woff2") format("woff2"); font-weight: 600 900; font-display: swap; }
  @font-face { font-family: "Cascadia Mono"; src: url("fonts/cascadia-mono.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Cascadia Mono"; src: url("fonts/cascadia-mono-700.woff2") format("woff2"); font-weight: 600 900; font-display: swap; }
  @font-face { font-family: "Excalifont"; src: url("fonts/excalifont.woff2") format("woff2"); font-weight: 400 900; font-display: swap; }

  :root {
    --bg: #16171A; --surface: #1E2024; --surface-2: #26282E; --line: #34373E;
    --text: #E7E8EA; --dim: #9A9DA5; --accent: #4FA3D8; --disc: #7FC0E6;
    --good: #4FD08A; --warn: #F0A24A; --violet: #A78BFA; --bad: #F26A63;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  * { scrollbar-color: var(--line) transparent; scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #474a52; }
  ::-webkit-scrollbar-corner { background: transparent; }
  html, body { height: 100%; }
  body { font-family: var(--sans); margin: 0; padding: 0; background: var(--bg); color: var(--text); font-size: 13px;
    display: flex; flex-direction: column; overflow: hidden; }
  a { color: var(--disc); }

  /* header strip */
  .strip { display: flex; align-items: center; gap: 16px; padding: 12px 16px; flex-shrink: 0;
    background: linear-gradient(180deg, #212227, var(--surface));
    border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 rgba(255,255,255,.04); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 24px; height: 24px; border-radius: 6px; }
  .wordmark { font-size: 18px; font-weight: 700; letter-spacing: .01em; }
  .wordmark .acc { color: var(--accent); }
  .readout { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--dim); }
  .readout b { color: var(--text); font-weight: 600; }
  .readout .sep { color: var(--line); }
  .readout .rate { color: var(--accent); font-variant-numeric: tabular-nums; }
  .strip .spacer { flex: 1; }

  .wrap { padding: 16px; flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* forms */
  form { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; flex-shrink: 0; }
  input[type=text], input:not([type]) { flex: 1; min-width: 200px; padding: 7px 10px;
    background: var(--surface); border: 1px solid var(--line); color: var(--text); border-radius: 6px; font-family: var(--sans); font-size: 13px; }
  input[type=number] { width: 70px; padding: 7px 10px; background: var(--surface); border: 1px solid var(--line); color: var(--text); border-radius: 6px; font-family: var(--sans); font-size: 13px; }
  input::placeholder { color: var(--dim); }
  input[type=text]:focus, input:not([type]):focus, input[type=number]:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; }
  .clr-wrap { position: relative; display: flex; flex: 1; min-width: 200px; }
  .clr-wrap > input { width: 100%; min-width: 0; padding-right: 28px; }
  .clr-x { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); background: none; border: 0;
    color: var(--dim); font-size: 16px; line-height: 1; cursor: pointer; padding: 2px 5px; font-weight: 400; display: none; }
  .clr-x:hover { color: var(--text); }
  .clr-wrap.has-text .clr-x { display: block; }

  /* buttons */
  button { padding: 6px 13px; background: var(--accent); border: 1px solid transparent; color: var(--bg);
    border-radius: 6px; cursor: pointer; font-size: 12px; font-family: var(--sans); font-weight: 600; }
  button.secondary { background: transparent; border-color: var(--line); color: var(--dim); font-weight: 500; }
  button.secondary:hover { color: var(--text); border-color: var(--dim); }
  button.danger { background: transparent; border-color: rgba(242,106,99,.4); color: var(--bad); font-weight: 500; }
  button.danger:hover { background: var(--bad); color: var(--bg); }
  button.small { padding: 3px 9px; font-size: 11px; border-radius: 5px; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* table — only this scrolls (both axes); header/form/toolbar stay put */
  .table-wrap { flex: 1; min-height: 0; overflow: auto; }
  table { width: 100%; min-width: 1225px; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; overflow: hidden; }
  thead th { background: var(--bg);
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 600; padding-top: 8px; padding-bottom: 8px; }
  tbody tr.data-row { cursor: pointer; }
  tbody tr:hover > td { background: var(--surface); }
  tbody tr.data-row:has(.row-chk:checked) > td { background: var(--surface-2); }
  th.checkbox-col, td.checkbox-col { width: 24px; padding-right: 0; }
  th.toggle-col, td.toggle-col { width: 18px; padding-right: 0; padding-left: 8px; }
  th.id-col, td.id-col { width: 70px; white-space: nowrap; }
  th.kind-col, td.kind-col { width: 55px; white-space: nowrap; }
  th.status-col, td.status-col { width: 122px; white-space: nowrap; }
  th.progress-col, td.progress-col { width: 210px; white-space: nowrap; }
  th.speed-col, td.speed-col { width: 74px; white-space: nowrap; }
  th.url-col, td.url-col { width: 340px; padding-right: 22px; }
  th.error-col, td.error-col { width: 180px; padding-left: 14px; }
  th.actions-col, td.actions-col { width: 128px; text-align: right; }

  .details-toggle-btn { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 11px; padding: 0; width: 16px; }
  .details-toggle-btn:hover { color: var(--text); }

  /* status */
  td.status-col { white-space: nowrap; overflow: visible; }
  /* dot is always filled with the status's own colour */
  td.status-col::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: currentColor; margin-right: 8px; vertical-align: middle; }
  .status-Queued { color: var(--dim); }
  .status-Downloading { color: var(--accent); }
  .status-Converting { color: var(--violet); }
  .status-Finished { color: var(--good); }
  .status-Failed { color: var(--bad); }
  .status-Cancelled { color: var(--dim); }
  .status-Paused { color: var(--warn); }
  /* Finished: the green dot pings — a ring expands outward and fades, then repeats */
  .status-Finished::before { animation: ping 1.5s ease-out infinite; }
  @keyframes ping {
    0%   { box-shadow: 0 0 0 0 rgba(79,208,138,.55); }
    100% { box-shadow: 0 0 0 5px rgba(79,208,138,0); }
  }
  @media (prefers-reduced-motion: reduce) { .status-Finished::before { animation: none; } }

  .speed-text { font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }

  .id { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  /* URL adapts to the space: the origin (scheme + host) and the tail (filename +
     type) always stay visible; only the middle path collapses to an ellipsis. */
  .url { display: flex; overflow: hidden; cursor: pointer;
    font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .u-origin { flex: 0 0 auto; white-space: nowrap; }
  .u-mid { flex: 0 200 auto; min-width: 1.6ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .u-tail { flex: 0 1 auto; min-width: 3ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .error { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--bad); cursor: pointer; font-size: 11px; }
  /* the (done/total) segment count drops out only when the window is genuinely cramped */
  @media (max-width: 900px) { .seg { display: none; } }
  .actions { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
  .actions .icon-act { width: 30px; height: 28px; padding: 0; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center; }
  .actions .icon-act svg { width: 15px; height: 15px; display: block; }
  .actions span.icon-act { display: inline-block; }

  /* progress meter */
  .meter { display: flex; align-items: center; gap: 10px; }
  .track { width: 104px; flex-shrink: 0; height: 5px; border-radius: 2px; background: var(--line); overflow: hidden; position: relative; }
  .fill { height: 100%; border-radius: 2px; background: var(--accent); }
  .fill.done { background: var(--good); }
  .fill.pause { background: var(--warn); opacity: .75; }
  .mlabel { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .track.conv { background: rgba(167,139,250,.20); }
  .track.conv::after { content: ""; position: absolute; inset: 0; width: 38%;
    background: linear-gradient(90deg, transparent, var(--violet), transparent); animation: shimmer 1.2s ease-in-out infinite; }
  @keyframes shimmer { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
  @media (prefers-reduced-motion: reduce) { .track.conv::after { animation: none; width: 100%; opacity: .5; } }

  label.checkbox { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text); margin: 0; }

  /* settings modal */
  #settings-overlay .overlay-card { width: 560px; max-width: 92vw; padding: 0; overflow: visible; }
  .set-head { display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--line);
    border-radius: 10px 10px 0 0; background: linear-gradient(180deg,#212227,var(--surface)); }
  .set-head h2 { margin: 0; font-size: 15px; font-weight: 700; flex: 1; }
  .set-head .x { background: none; border: 0; color: var(--dim); font-size: 20px; line-height: 1; cursor: pointer; padding: 0; }
  .set-head .x:hover { color: var(--text); }
  .set-body { padding: 4px 20px; overflow: visible; }
  .set-section { padding: 16px 0; }
  .set-section + .set-section { border-top: 1px solid var(--line); }
  .set-section h3 { margin: 0 0 14px; font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); font-weight: 600; }
  .set-row { margin-bottom: 14px; }
  .set-row:last-child { margin-bottom: 0; }
  .set-row > label { display: block; font-size: 12px; color: var(--text); margin-bottom: 6px; }
  .set-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .set-field { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    color: var(--text); font-family: var(--sans); font-size: 13px; padding: 8px 10px; }
  .set-field:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .dir-row { display: flex; gap: 8px; }
  .dir-row .set-field { flex: 1; font-family: var(--mono); font-size: 12px; }
  /* custom dropdown */
  .dd { position: relative; }
  .dd-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; color: var(--text);
    font-family: var(--sans); font-size: 13px; font-weight: 400; padding: 8px 10px; cursor: pointer; }
  .dd-btn:hover { border-color: var(--dim); }
  .dd.open .dd-btn { border-color: transparent; outline: 2px solid var(--accent); outline-offset: 1px; }
  .dd-btn svg { color: var(--dim); flex-shrink: 0; transition: transform .12s; }
  .dd.open .dd-btn svg { transform: rotate(180deg); }
  .dd-list { position: absolute; left: 0; right: 0; top: calc(100% + 5px); z-index: 5; margin: 0; padding: 4px;
    list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 14px 36px rgba(0,0,0,.5); display: none; max-height: 260px; overflow-y: auto; }
  .dd.open .dd-list { display: block; }
  .dd-list li { padding: 8px 10px; border-radius: 5px; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dd-list li:hover { background: var(--surface-2); }
  .dd-list li[aria-selected="true"] { color: var(--accent); }
  .dd-list li[aria-selected="true"]::after { content: "✓"; font-size: 11px; }
  .f-system    { font-family: var(--sans); }
  .f-georgia   { font-family: Georgia, "Times New Roman", serif; }
  .f-ibm-plex-mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
  .f-excalifont { font-family: "Excalifont", "Comic Sans MS", cursive; }
  .f-cascadia-mono { font-family: "Cascadia Mono", ui-monospace, Consolas, monospace; }
  .font-preview { margin-top: 8px; padding: 9px 12px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; font-size: 14px; color: var(--text); }

  /* icon-only header buttons */
  .strip button.icon-only { padding: 6px; display: inline-flex; align-items: center; }
  .strip button.icon-only svg { display: block; }
  #settings-btn .gear { width: 17px; height: 17px; display: block; background: currentColor;
    -webkit-mask: url("settings.png") center / contain no-repeat; mask: url("settings.png") center / contain no-repeat; }
  .set-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line);
    border-radius: 0 0 10px 10px; background: var(--surface-2); }

  /* row details */
  .details-cell { background: var(--surface-2); font-size: 12px; color: var(--dim); padding: 0; }
  /* first column is a gutter that lines the field block up with the ID column;
     the preview column's right edge lines up with the Actions column. */
  .detgrid { display: grid; grid-template-columns: 34px minmax(0,1fr) 208px; gap: 0 16px; padding: 12px 8px 15px 0; }
  .detgrid .df { display: grid; grid-template-columns: max-content 1fr; gap: 7px 14px; align-items: baseline; min-width: 0; }
  .detgrid .df dt { color: var(--dim); font-weight: 500; text-transform: uppercase; font-size: 10px; letter-spacing: .06em; }
  .detgrid .df dd { margin: 0; font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detgrid .df dd.selectable { font-family: var(--mono); font-size: 11px; color: var(--disc); word-break: break-all; white-space: normal; user-select: text; }
  .det-preview { width: 200px; align-self: start; }
  .det-thumb { width: 200px; height: 112px; border-radius: 6px; border: 1px solid var(--line); overflow: hidden;
    background: linear-gradient(135deg,#2a2d34,#12303b); display: flex; align-items: center; justify-content: center;
    color: #46505c; position: relative; }
  .det-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
  .det-thumb .glyph { font-size: 26px; }
  .det-thumb .full { position: absolute; right: 5px; bottom: 5px; background: rgba(0,0,0,.6); color: #fff; border: 0;
    border-radius: 4px; font-size: 10px; padding: 2px 7px; cursor: pointer; }
  .det-cap { font-size: 10px; color: var(--dim); margin-top: 5px; text-align: center;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* overlays */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000; }
  .overlay-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; min-width: 320px; max-width: 420px; }
</style>
</head>
<body>
  <header class="strip">
    <span class="brand"><img src="icon.png" alt="" /><span class="wordmark">L<span class="acc">ü</span>dd</span></span>
    <span class="readout">
      <span><b id="stat-running">0</b> <span data-i18n="stat_running">running</span></span><span class="sep">/</span>
      <span><b id="stat-queued">0</b> <span data-i18n="stat_queued">queued</span></span><span class="sep">/</span>
      <span class="rate" id="stat-speed">&mdash;</span>
    </span>
    <span class="spacer"></span>
    <button id="run-btn" data-i18n="run_queue">Run queue</button>
    <button id="detected-btn" class="secondary icon-only" data-i18n-title="show_detected" title="Detected downloads" aria-label="Detected downloads">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    </button>
    <button id="settings-btn" class="secondary icon-only" data-i18n-title="settings" title="Settings" aria-label="Settings">
      <span class="gear"></span>
    </button>
  </header>

  <div id="settings-overlay" class="overlay">
    <div class="overlay-card">
      <div class="set-head">
        <h2 data-i18n="settings_title">Settings</h2>
        <button class="x" id="settings-close-btn" aria-label="Close">&times;</button>
      </div>
      <div class="set-body">
        <div class="set-section">
          <h3 data-i18n="sec_downloads">Downloads</h3>
          <div class="set-row">
            <label for="download-dir" data-i18n="output_folder">Output folder</label>
            <div class="dir-row">
              <input id="download-dir" type="text" class="set-field" />
              <button id="browse-btn" type="button" class="secondary" data-i18n="browse">Browse&hellip;</button>
            </div>
          </div>
          <div class="set-grid2">
            <div class="set-row">
              <label for="max-concurrent" data-i18n="max_concurrent">Max concurrent downloads</label>
              <input id="max-concurrent" type="number" min="1" max="16" class="set-field" />
            </div>
            <div class="set-row">
              <label for="per-download-concurrency" data-i18n="connections">Connections per download</label>
              <input id="per-download-concurrency" type="number" min="1" max="32" class="set-field" />
            </div>
          </div>
        </div>
        <div class="set-section">
          <h3 data-i18n="sec_appearance">Appearance</h3>
          <div class="set-grid2">
            <div class="set-row">
              <label data-i18n="language">Language</label>
              <div class="dd" id="dd-language" data-value="en">
                <button type="button" class="dd-btn"><span class="dd-cur">English</span>
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
                <ul class="dd-list">
                  <li data-value="en">English</li>
                  <li data-value="de">Deutsch</li>
                </ul>
              </div>
            </div>
            <div class="set-row">
              <label data-i18n="font">Font</label>
              <div class="dd" id="dd-font" data-value="system">
                <button type="button" class="dd-btn"><span class="dd-cur">System</span>
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
                <ul class="dd-list">
                  <li data-value="system" class="f-system">System</li>
                  <li data-value="georgia" class="f-georgia">Georgia</li>
                  <li data-value="ibm-plex-mono" class="f-ibm-plex-mono">IBM Plex Mono</li>
                  <li data-value="excalifont" class="f-excalifont">Excalifont</li>
                  <li data-value="cascadia-mono" class="f-cascadia-mono">Cascadia Mono</li>
                </ul>
              </div>
            </div>
          </div>
          <div class="set-row">
            <div class="font-preview" id="font-preview" data-i18n="font_preview">The quick brown fox jumps over 1,234 downloads.</div>
          </div>
        </div>
      </div>
      <div class="set-foot">
        <button id="settings-cancel-btn" class="secondary" data-i18n="cancel">Cancel</button>
        <button id="save-settings-btn" data-i18n="save">Save</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <form id="add-form">
      <span class="clr-wrap">
        <input id="url" placeholder="https://example.com/video.m3u8" required />
        <button type="button" class="clr-x" id="url-clear" data-i18n-title="clear_field" title="Clear" aria-label="Clear">&times;</button>
      </span>
      <input id="filename" data-i18n-placeholder="filename_ph" placeholder="Output filename (optional)" style="flex: 0 0 220px" />
      <button type="submit" data-i18n="add">Add</button>
    </form>
    <div class="toolbar">
      <span style="flex: 1"></span>
      <button id="remove-selected-btn" class="danger" disabled data-i18n="remove_selected">Remove selected</button>
      <button id="retry-selected-btn" class="secondary" disabled data-i18n="retry_selected">Retry selected</button>
      <button id="clear-btn" class="danger" data-i18n="clear_finished">Clear finished</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr>
          <th class="toggle-col"><button id="expand-all-btn" class="details-toggle-btn" data-i18n-title="toggle_all" title="Show / hide all details">▸</button></th>
          <th class="checkbox-col"><input type="checkbox" id="select-all-chk" /></th>
          <th class="id-col" data-i18n="col_id">ID</th><th class="kind-col" data-i18n="col_kind">Kind</th><th class="status-col" data-i18n="col_status">Status</th><th class="progress-col" data-i18n="col_progress">Progress</th><th class="speed-col" data-i18n="col_speed">Speed</th><th class="url-col" data-i18n="col_url">URL</th><th class="error-col" data-i18n="col_error">Error</th><th class="actions-col" data-i18n="col_actions">Actions</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <div id="confirm-overlay" class="overlay">
    <div class="overlay-card">
      <div id="confirm-message" style="margin-bottom: 14px; font-size: 14px; color: var(--text);"></div>
      <label class="checkbox" style="margin-bottom: 18px;"><input type="checkbox" id="confirm-delete-files-chk" /> <span data-i18n="also_delete_files">Also delete downloaded files</span></label>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button id="confirm-cancel-btn" class="secondary" data-i18n="cancel">Cancel</button>
        <button id="confirm-ok-btn" class="danger" data-i18n="confirm">Confirm</button>
      </div>
    </div>
  </div>

  <div id="quality-overlay" class="overlay">
    <div class="overlay-card" style="min-width: 280px; max-width: 380px;">
      <div style="margin-bottom: 12px; font-size: 14px; color: var(--text);" data-i18n="choose_quality">Choose a quality</div>
      <div id="quality-options" style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; max-height: 300px; overflow-y: auto;"></div>
      <div style="display: flex; justify-content: flex-end;">
        <button id="quality-cancel-btn" class="secondary" data-i18n="cancel">Cancel</button>
      </div>
    </div>
  </div>

  <div id="image-preview-overlay" class="overlay" style="background: rgba(0,0,0,0.8); cursor: pointer; overflow: auto;">
    <img id="image-preview-img" style="max-width: 90vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,0.6); transition: transform .08s;" />
  </div>

<script src="i18n.js"></script>
<script>
const { invoke } = window.__TAURI__.core;
const t = (k, v) => window.I18N.t(k, v);
const selected = new Set();
const detailsOpen = new Set();

const IMAGE_EXTENSIONS = new Set(["jpg", "jpeg", "png", "gif", "webp", "bmp", "svg"]);

function isImageFile(path) {
  const ext = (path.split(".").pop() || "").toLowerCase();
  return IMAGE_EXTENSIONS.has(ext);
}

// id -> data URL | null (null = tried, nothing to show). Persists across the
// 2s re-renders so a video frame is grabbed by ffmpeg at most once.
const detailPreview = new Map();

function previewGlyph(dest) {
  const ext = (String(dest || "").split(".").pop() || "").toLowerCase();
  if (["mp4","mkv","webm","mov","m4v","avi","ts","flv"].includes(ext)) return "▶";
  if (IMAGE_EXTENSIONS.has(ext)) return "▦";
  if (["zip","rar","7z","tar","gz"].includes(ext)) return "🗜";
  if (["mp3","m4a","flac","wav","ogg","opus"].includes(ext)) return "♪";
  if (["pdf","doc","docx","txt"].includes(ext)) return "▤";
  return "◫";
}

async function loadDetailPreview(detailsTr) {
  const box = detailsTr.querySelector(".det-thumb");
  if (!box || box.dataset.done) return;
  box.dataset.done = "1";
  const id = box.dataset.id;
  let url = detailPreview.get(id);
  if (url === undefined) {
    try { url = (await invoke("read_preview", { path: box.dataset.dest })).data_url; }
    catch { url = null; }
    detailPreview.set(id, url);
  }
  if (!url) return; // keep the glyph
  box.querySelector(".glyph")?.remove();
  const img = document.createElement("img");
  img.src = url; img.alt = "";
  img.addEventListener("click", () => showImagePreview(url));
  box.appendChild(img);
  const full = document.createElement("button");
  full.className = "full"; full.textContent = t("full_size");
  full.addEventListener("click", (ev) => { ev.stopPropagation(); showImagePreview(url); });
  box.appendChild(full);
  const cap = detailsTr.querySelector(".det-cap");
  if (cap) cap.textContent = (box.dataset.dest || "").split(/[\\/]/).pop();
}

const previewImg = document.getElementById("image-preview-img");
let pvScale = 1, pvPanX = 0, pvPanY = 0, pvDrag = false, pvStartX = 0, pvStartY = 0;

function pvApply() {
  previewImg.style.transform = `translate(${pvPanX}px, ${pvPanY}px) scale(${pvScale})`;
  previewImg.style.cursor = pvScale > 1 ? (pvDrag ? "grabbing" : "grab") : "pointer";
}

function pvReset() { pvScale = 1; pvPanX = 0; pvPanY = 0; pvDrag = false; }

function showImagePreview(dataUrl) {
  pvReset();
  previewImg.src = dataUrl;
  pvApply();
  document.getElementById("image-preview-overlay").style.display = "flex";
}

function closeImagePreview() {
  document.getElementById("image-preview-overlay").style.display = "none";
  previewImg.src = "";
  pvReset();
  pvApply();
}

document.getElementById("image-preview-overlay").addEventListener("click", (ev) => {
  if (ev.target.id === "image-preview-img") return; // clicks on the image itself don't close
  closeImagePreview();
});

// mouse wheel: up = zoom in, down = zoom out
document.getElementById("image-preview-overlay").addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const next = pvScale * (ev.deltaY < 0 ? 1.15 : 1 / 1.15);
  pvScale = Math.min(6, Math.max(1, next));
  if (pvScale === 1) { pvPanX = 0; pvPanY = 0; }
  previewImg.style.transition = "transform .08s";
  pvApply();
}, { passive: false });

previewImg.addEventListener("dblclick", (ev) => {
  ev.stopPropagation();
  if (pvScale > 1) { pvReset(); } else { pvScale = 2; pvPanX = 0; pvPanY = 0; }
  previewImg.style.transition = "transform .12s";
  pvApply();
});

previewImg.addEventListener("mousedown", (ev) => {
  if (pvScale <= 1) return;
  ev.preventDefault();
  pvDrag = true;
  pvStartX = ev.clientX - pvPanX;
  pvStartY = ev.clientY - pvPanY;
  previewImg.style.transition = "none";
  pvApply();
});
window.addEventListener("mousemove", (ev) => {
  if (!pvDrag) return;
  pvPanX = ev.clientX - pvStartX;
  pvPanY = ev.clientY - pvStartY;
  pvApply();
});
window.addEventListener("mouseup", () => {
  if (!pvDrag) return;
  pvDrag = false;
  previewImg.style.transition = "transform .08s";
  pvApply();
});

document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && document.getElementById("image-preview-overlay").style.display === "flex") closeImagePreview();
});

function confirmAction(message) {
  return new Promise(resolve => {
    const overlay = document.getElementById("confirm-overlay");
    const okBtn = document.getElementById("confirm-ok-btn");
    const cancelBtn = document.getElementById("confirm-cancel-btn");
    const deleteChk = document.getElementById("confirm-delete-files-chk");

    document.getElementById("confirm-message").textContent = message;
    deleteChk.checked = false;
    overlay.style.display = "flex";

    const cleanup = () => {
      overlay.style.display = "none";
      okBtn.removeEventListener("click", onOk);
      cancelBtn.removeEventListener("click", onCancel);
    };
    const onOk = () => {
      const deleteFiles = deleteChk.checked;
      cleanup();
      resolve({ confirmed: true, deleteFiles });
    };
    const onCancel = () => {
      cleanup();
      resolve({ confirmed: false, deleteFiles: false });
    };
    okBtn.addEventListener("click", onOk);
    cancelBtn.addEventListener("click", onCancel);
  });
}

function pickQuality(options) {
  return new Promise(resolve => {
    const overlay = document.getElementById("quality-overlay");
    const list = document.getElementById("quality-options");
    const cancelBtn = document.getElementById("quality-cancel-btn");

    list.innerHTML = "";
    for (const opt of options) {
      const btn = document.createElement("button");
      btn.className = "secondary";
      btn.style.textAlign = "left";
      btn.textContent = opt.label;
      btn.addEventListener("click", () => {
        cleanup();
        resolve(opt.variant_key);
      });
      list.appendChild(btn);
    }
    overlay.style.display = "flex";

    const cleanup = () => {
      overlay.style.display = "none";
      cancelBtn.removeEventListener("click", onCancel);
    };
    const onCancel = () => {
      cleanup();
      resolve(null);
    };
    cancelBtn.addEventListener("click", onCancel);
  });
}

function formatBytesPerSec(bytesPerSec) {
  const units = ["B/s", "KB/s", "MB/s", "GB/s"];
  let v = bytesPerSec, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return `${v.toFixed(v >= 10 || i === 0 ? 0 : 1)} ${units[i]}`;
}

function formatBytes(bytes) {
  const units = ["B", "KB", "MB", "GB"];
  let v = bytes, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return `${v.toFixed(v >= 10 || i === 0 ? 0 : 1)} ${units[i]}`;
}

function progressBar(pct, label) {
  return `<div class="meter"><div class="track"><div class="fill" style="width:${pct}%"></div></div><div class="mlabel">${label ?? pct + "%"}</div></div>`;
}

function formatProgress(e) {
  if (e.status === "Finished") {
    return `<div class="meter"><div class="track"><div class="fill done" style="width:100%"></div></div><div class="mlabel">100%</div></div>`;
  }
  if (!e.progress) {
    return e.status === "Converting"
      ? `<div class="meter"><div class="track conv"></div><div class="mlabel" style="color:var(--violet)">${t("remux")}</div></div>`
      : "";
  }
  const p = e.progress;
  // HLS/DASH: honest percentage from the known segment count.
  if (p.total_units > 0) {
    const pct = Math.min(100, Math.round((p.done_units / p.total_units) * 100));
    return progressBar(pct, `${pct}%<span class="seg"> (${p.done_units}/${p.total_units})</span>`);
  }
  // HTTP with a known Content-Length.
  if (p.total_bytes) {
    const pct = Math.min(100, Math.round((p.downloaded_bytes / p.total_bytes) * 100));
    return progressBar(pct);
  }
  // HTTP, unknown size: show bytes transferred, no bar.
  return `<div class="mlabel">${formatBytes(p.downloaded_bytes)}</div>`;
}

// Split a URL so the origin (scheme + host) always stays fully visible; the
// middle path collapses first, the trailing segment (filename) second. The
// query string is dropped here — the full URL is in the tooltip / on copy.
function splitUrl(u) {
  try {
    const url = new URL(u);
    const path = url.pathname || "/";
    const slash = path.lastIndexOf("/");
    return { origin: url.origin, mid: path.slice(0, slash + 1), tail: path.slice(slash + 1) };
  } catch {
    const base = (u.split("?")[0]) || u;
    const slash = base.lastIndexOf("/");
    if (slash === -1) return { origin: "", mid: "", tail: base };
    return { origin: "", mid: base.slice(0, slash + 1), tail: base.slice(slash + 1) };
  }
}

function formatSpeed(e) {
  if (e.status !== "Downloading" || !e.progress || !e.progress.speed_bps) return "";
  return formatBytesPerSec(e.progress.speed_bps);
}

const KIND_LABELS = { Http: "HTTP", Hls: "HLS", Dash: "DASH" };
function kindLabel(kind) {
  return KIND_LABELS[kind] ?? kind;
}

const STATUS_LABELS = { Downloading: "Running" };
function statusLabel(status) {
  return t("status_" + (STATUS_LABELS[status] ?? status));
}

// UI font key -> CSS family; null = use the stylesheet default. Applies to the
// whole UI (both --sans and --mono).
const FONTS = {
  system: null,
  georgia: 'Georgia, "Times New Roman", serif',
  "ibm-plex-mono": '"IBM Plex Mono", ui-monospace, Consolas, monospace',
  excalifont: '"Excalifont", "Comic Sans MS", cursive',
  "cascadia-mono": '"Cascadia Mono", ui-monospace, Consolas, monospace',
};
function applyFont(key) {
  const fam = FONTS[key];
  const s = document.documentElement.style;
  if (fam) { s.setProperty("--sans", fam); s.setProperty("--mono", fam); }
  else { s.removeProperty("--sans"); s.removeProperty("--mono"); }
}

// Row actions are icon buttons (locale-proof); the localized word is the
// tooltip. Feather-style 24px stroke icons.
const ICONS = {
  pause:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="5" x2="8" y2="19"/><line x1="16" y1="5" x2="16" y2="19"/></svg>',
  play:   '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  retry:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>',
  file:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>',
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  trash:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/><path d="M9 7V4h6v3"/></svg>',
};

// The leading slot in the Actions column: one contextual icon (or an empty
// spacer for Queued) so the trio stays aligned across every row.
function primaryActionBtn(e) {
  const b = (cls, key, svg) => `<button class="small secondary icon-act act-primary ${cls}" data-id="${e.id}" title="${t(key)}" aria-label="${t(key)}">${svg}</button>`;
  switch (e.status) {
    case "Downloading": return b("pause-btn", "act_pause", ICONS.pause);
    case "Paused":      return b("resume-btn", "act_resume", ICONS.play);
    case "Failed":
    case "Cancelled":
    case "Converting":  return b("retry-btn", "act_retry", ICONS.retry);
    case "Finished":    return b("open-file-btn", "act_open", ICONS.file);
    default:            return `<span class="icon-act act-primary"></span>`;
  }
}

function updateBulkButtons() {
  const n = selected.size;
  document.getElementById("remove-selected-btn").disabled = n === 0;
  document.getElementById("retry-selected-btn").disabled = n === 0;
}

function updateReadout(entries) {
  const running = entries.filter(e => e.status === "Downloading").length;
  const queued = entries.filter(e => e.status === "Queued").length;
  const totalBps = entries.reduce((s, e) =>
    s + (e.status === "Downloading" && e.progress && e.progress.speed_bps ? e.progress.speed_bps : 0), 0);
  document.getElementById("stat-running").textContent = running;
  document.getElementById("stat-queued").textContent = queued;
  document.getElementById("stat-speed").textContent = totalBps > 0 ? formatBytesPerSec(totalBps) : "—";
}

let firstLoadOk = false;

async function refresh() {
  let entries;
  try {
    entries = await invoke("list_downloads");
  } catch (e) {
    // On cold start the webview can call this before the Tauri side has
    // finished `app.manage(AppState)`, so the command errors. Swallow it —
    // the fast startup poll retries until it lands.
    console.warn("list_downloads not ready yet", e);
    return;
  }
  firstLoadOk = true;
  const liveIds = new Set(entries.map(e => e.id));
  for (const id of [...selected]) {
    if (!liveIds.has(id)) selected.delete(id);
  }

  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  for (const e of entries) {
    const tr = document.createElement("tr");
    tr.className = "data-row";
    const isOpen = detailsOpen.has(e.id);
    tr.innerHTML = `
      <td class="toggle-col"><button class="details-toggle-btn" data-id="${e.id}" title="${t("details")}">${isOpen ? "▾" : "▸"}</button></td>
      <td class="checkbox-col"><input type="checkbox" class="row-chk" data-id="${e.id}" ${selected.has(e.id) ? "checked" : ""} /></td>
      <td class="id id-col">${e.id.slice(0, 8)}</td>
      <td class="kind-col">${kindLabel(e.kind)}</td>
      <td class="status-${e.status} status-col">${statusLabel(e.status)}</td>
      <td class="progress-col">${formatProgress(e)}</td>
      <td class="speed-text speed-col">${formatSpeed(e)}</td>
      <td class="url-col copy-url" data-id="${e.id}" data-field="url" title="${e.url}&#10;${t("dbl_copy")}">${(() => { const s = splitUrl(e.url); return `<span class="url"><span class="u-origin">${s.origin}</span><span class="u-mid">${s.mid}</span><span class="u-tail">${s.tail}</span></span>`; })()}</td>
      <td class="error error-col copy-url" data-id="${e.id}" data-field="error" title="${(e.error ?? "").replace(/"/g, "&quot;")}${e.error ? "\n" + t("dbl_copy") : ""}">${e.error ?? ""}</td>
      <td class="actions-col"><div class="actions">
        ${primaryActionBtn(e)}
        <button class="small secondary icon-act open-folder-btn" data-id="${e.id}" title="${t("open_folder")}" aria-label="${t("open_folder")}">${ICONS.folder}</button>
        <button class="small danger icon-act remove-btn" data-id="${e.id}" title="${t("remove")}" aria-label="${t("remove")}">${ICONS.trash}</button>
      </div></td>
    `;
    rows.appendChild(tr);

    const detailsTr = document.createElement("tr");
    detailsTr.className = "details-row";
    detailsTr.dataset.id = e.id;
    detailsTr.style.display = isOpen ? "table-row" : "none";
    let site = "";
    try { site = new URL(e.url).host; } catch { site = t("val_unknown"); }
    const headerNames = Object.keys(e.headers ?? {});
    detailsTr.innerHTML = `
      <td colspan="10" class="details-cell">
        <div class="detgrid">
          <div></div>
          <dl class="df">
            <dt>${t("d_site")}</dt><dd>${site}</dd>
            <dt>${t("d_full_link")}</dt><dd class="selectable">${e.url}</dd>
            <dt>${t("d_saving_to")}</dt><dd class="selectable">${e.dest}</dd>
            <dt>${t("d_headers")}</dt><dd>${headerNames.length ? headerNames.join(", ") : t("val_none")}</dd>
            <dt>${t("d_cookie")}</dt><dd>${e.cookie ? t("val_yes") : t("val_no")}</dd>
            <dt>${t("d_added")}</dt><dd>${new Date(e.created_at * 1000).toLocaleString(window.I18N.lang)}</dd>
          </dl>
          <div class="det-preview">
            <div class="det-thumb" data-id="${e.id}" data-dest="${(e.dest ?? "").replace(/"/g, "&quot;")}"><span class="glyph">${previewGlyph(e.dest)}</span></div>
            <div class="det-cap"></div>
          </div>
        </div>
      </td>
    `;
    rows.appendChild(detailsTr);
    if (isOpen) loadDetailPreview(detailsTr);

    tr.addEventListener("click", (ev) => {
      if (ev.target.closest("button, input, a")) return;
      if (window.getSelection && String(window.getSelection())) return;
      const chk = tr.querySelector(".row-chk");
      chk.checked = !chk.checked;
      chk.dispatchEvent(new Event("change"));
    });
  }

  rows.querySelectorAll(".row-chk").forEach(chk => {
    chk.addEventListener("change", () => {
      if (chk.checked) selected.add(chk.dataset.id); else selected.delete(chk.dataset.id);
      document.getElementById("select-all-chk").checked = selected.size > 0 && selected.size === entries.length;
      updateBulkButtons();
    });
  });
  rows.querySelectorAll(".details-toggle-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.id;
      const detailsTr = rows.querySelector(`.details-row[data-id="${id}"]`);
      if (!detailsTr) return;
      const nowOpen = detailsTr.style.display === "none";
      detailsTr.style.display = nowOpen ? "table-row" : "none";
      btn.textContent = nowOpen ? "▾" : "▸";
      if (nowOpen) { detailsOpen.add(id); loadDetailPreview(detailsTr); } else { detailsOpen.delete(id); }
    });
  });
  rows.querySelectorAll(".retry-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      await invoke("retry_entry", { id: btn.dataset.id });
      await refresh();
    });
  });
  rows.querySelectorAll(".resume-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      await invoke("retry_entry", { id: btn.dataset.id });
      await refresh();
    });
  });
  rows.querySelectorAll(".pause-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      await invoke("pause_entry", { id: btn.dataset.id });
      await refresh();
    });
  });
  rows.querySelectorAll(".open-file-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const entry = entries.find(x => x.id === btn.dataset.id);
      if (entry) await invoke("open_file", { path: entry.dest });
    });
  });
  rows.querySelectorAll(".open-folder-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const entry = entries.find(x => x.id === btn.dataset.id);
      if (!entry) return;
      await invoke("open_containing_folder", { path: entry.dest });
    });
  });
  rows.querySelectorAll(".remove-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const { confirmed, deleteFiles } = await confirmAction(t("confirm_remove_one"));
      if (!confirmed) return;
      await invoke("remove_entry", { id: btn.dataset.id, deleteFiles });
      await refresh();
    });
  });
  rows.querySelectorAll(".copy-url").forEach(cell => {
    cell.addEventListener("dblclick", async () => {
      const entry = entries.find(x => x.id === cell.dataset.id);
      if (!entry) return;
      const value = cell.dataset.field === "error" ? entry.error : entry.url;
      if (!value) return;
      try {
        await navigator.clipboard.writeText(value);
        const original = cell.innerHTML;
        cell.textContent = t("copied");
        setTimeout(() => { cell.innerHTML = original; }, 700);
      } catch (err) {
        console.error("clipboard write failed", err);
      }
    });
  });

  document.getElementById("select-all-chk").checked = entries.length > 0 && selected.size === entries.length;
  updateBulkButtons();
  updateReadout(entries);
  lastEntries = entries;
}

// The master toggle keeps its own state; toggling a single row doesn't move it.
let lastEntries = [];
let masterOpen = false;
document.getElementById("expand-all-btn").addEventListener("click", async () => {
  masterOpen = !masterOpen;
  document.getElementById("expand-all-btn").textContent = masterOpen ? "▾" : "▸";
  detailsOpen.clear();
  if (masterOpen) lastEntries.forEach(e => detailsOpen.add(e.id));
  await refresh();
});

document.getElementById("select-all-chk").addEventListener("change", async (ev) => {
  const rows = document.querySelectorAll(".row-chk");
  if (ev.target.checked) {
    rows.forEach(chk => { chk.checked = true; selected.add(chk.dataset.id); });
  } else {
    rows.forEach(chk => { chk.checked = false; });
    selected.clear();
  }
  updateBulkButtons();
});

document.getElementById("remove-selected-btn").addEventListener("click", async () => {
  const { confirmed, deleteFiles } = await confirmAction(t("confirm_remove_n", { n: selected.size }));
  if (!confirmed) return;
  for (const id of [...selected]) {
    await invoke("remove_entry", { id, deleteFiles });
  }
  selected.clear();
  await refresh();
});

document.getElementById("retry-selected-btn").addEventListener("click", async () => {
  for (const id of [...selected]) {
    await invoke("retry_entry", { id });
  }
  await refresh();
});

  const ui = document.getElementById("url");
  const uw = ui.closest(".clr-wrap");
  const syncClr = () => uw.classList.toggle("has-text", ui.value.length > 0);
  ui.addEventListener("input", syncClr);

document.getElementById("add-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const url = document.getElementById("url").value.trim();
  const filename = document.getElementById("filename").value.trim() || null;
  if (!url) return;

  let quality = null;
  const submitBtn = ev.target.querySelector("button[type=submit]");
  submitBtn.disabled = true;
  try {
    const variants = await invoke("probe_qualities", { url });
    if (variants.length > 0) {
      quality = await pickQuality(variants);
      if (quality === null && variants.length > 0) {
        return;
      }
    }
  } finally {
    submitBtn.disabled = false;
  }

  await invoke("add_download", { url, filename, quality });
  const urlIn = document.getElementById("url");
  urlIn.value = "";
  urlIn.closest(".clr-wrap")?.classList.remove("has-text");
  document.getElementById("filename").value = "";
  await refresh();
});

document.getElementById("run-btn").addEventListener("click", async () => {
  await invoke("run_queue");
  await refresh();
});

document.getElementById("detected-btn").addEventListener("click", () => invoke("detection_window_show"));

document.getElementById("clear-btn").addEventListener("click", async () => {
  const { confirmed, deleteFiles } = await confirmAction(t("confirm_clear"));
  if (!confirmed) return;
  await invoke("clear_finished", { deleteFiles });
  await refresh();
});

const settingsOverlay = document.getElementById("settings-overlay");
const fontPreview = document.getElementById("font-preview");
const ddLang = document.getElementById("dd-language");
const ddFont = document.getElementById("dd-font");

function previewFont(key) {
  const fam = FONTS[key];
  fontPreview.style.fontFamily = fam || "var(--sans)";
}

// minimal themed dropdown: data-value on the .dd, click a <li> to set it.
function initDropdown(dd, onChange) {
  const btn = dd.querySelector(".dd-btn");
  const cur = dd.querySelector(".dd-cur");
  const items = [...dd.querySelectorAll(".dd-list li")];
  dd._sync = () => {
    const v = dd.dataset.value;
    items.forEach(li => {
      const on = li.dataset.value === v;
      li.setAttribute("aria-selected", on ? "true" : "false");
      if (on) { cur.textContent = li.textContent; cur.className = "dd-cur " + (li.className || "").trim(); }
    });
  };
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    document.querySelectorAll(".dd.open").forEach(o => { if (o !== dd) o.classList.remove("open"); });
    dd.classList.toggle("open");
  });
  items.forEach(li => li.addEventListener("click", () => {
    dd.dataset.value = li.dataset.value;
    dd.classList.remove("open");
    dd._sync();
    if (onChange) onChange(li.dataset.value);
  }));
  dd._sync();
}
initDropdown(ddLang);
initDropdown(ddFont, previewFont);
document.addEventListener("click", () => document.querySelectorAll(".dd.open").forEach(o => o.classList.remove("open")));

function openSettings(settings) {
  document.getElementById("download-dir").value = settings.download_dir;
  document.getElementById("max-concurrent").value = settings.max_concurrent_downloads;
  document.getElementById("per-download-concurrency").value = settings.per_download_concurrency;
  ddLang.dataset.value = settings.language || "en"; ddLang._sync();
  ddFont.dataset.value = settings.font || "system"; ddFont._sync();
  previewFont(settings.font || "system");
  settingsOverlay.style.display = "flex";
}
function closeSettings() {
  settingsOverlay.style.display = "none";
  document.querySelectorAll(".dd.open").forEach(o => o.classList.remove("open"));
}

document.getElementById("settings-btn").addEventListener("click", async () => {
  openSettings(await invoke("get_settings"));
});
document.getElementById("settings-close-btn").addEventListener("click", closeSettings);
document.getElementById("settings-cancel-btn").addEventListener("click", closeSettings);
settingsOverlay.addEventListener("click", (ev) => { if (ev.target === settingsOverlay) closeSettings(); });

document.getElementById("browse-btn").addEventListener("click", async () => {
  const picked = await invoke("pick_folder");
  if (picked) {
    document.getElementById("download-dir").value = picked;
  }
});

document.getElementById("save-settings-btn").addEventListener("click", async () => {
  const font = ddFont.dataset.value;
  const language = ddLang.dataset.value;
  const settings = {
    download_dir: document.getElementById("download-dir").value.trim(),
    max_concurrent_downloads: parseInt(document.getElementById("max-concurrent").value, 10) || 2,
    per_download_concurrency: parseInt(document.getElementById("per-download-concurrency").value, 10) || 8,
    font,
    language,
  };
  await invoke("set_settings", { settings });
  applyFont(font);
  window.I18N.applyLang(language);
  try { await window.__TAURI__.event.emit("settings-changed"); } catch (e) {}
  await refresh();
  closeSettings();
});

(async () => {
  try {
    const s = await invoke("get_settings");
    applyFont(s.font || "system");
    window.I18N.applyLang(s.language || "en");
  } catch (e) {
    window.I18N.applyLang("en");
  }
})().catch(e => console.error("settings load failed", e));

// Poll fast until the first successful load (cold start races the Tauri
// backend), then settle to a calm 2s cadence.
(function pollLoop() {
  refresh().finally(() => setTimeout(pollLoop, firstLoadOk ? 2000 : 200));
})();
</script>
