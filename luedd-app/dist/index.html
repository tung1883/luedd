<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Lüdd</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #1e1e1e; color: #ddd; }
  h1 { font-size: 18px; margin: 0 0 12px; display: flex; align-items: center; justify-content: space-between; }
  h1 button { font-size: 12px; padding: 4px 10px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  input[type=text], input:not([type]) { flex: 1; min-width: 200px; padding: 6px 8px; background: #2a2a2a; border: 1px solid #444; color: #eee; border-radius: 4px; }
  input[type=number] { width: 70px; padding: 6px 8px; background: #2a2a2a; border: 1px solid #444; color: #eee; border-radius: 4px; }
  button { padding: 6px 12px; background: #3a6; border: none; color: white; border-radius: 4px; cursor: pointer; font-size: 13px; }
  button.secondary { background: #555; }
  button.danger { background: #a33; }
  button.small { padding: 3px 8px; font-size: 12px; }
  button:disabled { opacity: 0.4; cursor: default; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #333; vertical-align: middle; overflow: hidden; }
  th.checkbox-col, td.checkbox-col { width: 24px; padding-right: 0; }
  th.toggle-col, td.toggle-col { width: 18px; padding-right: 0; padding-left: 8px; }
  th.id-col, td.id-col { width: 70px; white-space: nowrap; }
  th.kind-col, td.kind-col { width: 55px; white-space: nowrap; }
  th.status-col, td.status-col { width: 90px; white-space: nowrap; }
  th.progress-col, td.progress-col { width: 120px; white-space: nowrap; }
  th.speed-col, td.speed-col { width: 70px; white-space: nowrap; }
  th.url-col, td.url-col { width: 260px; }
  th.error-col, td.error-col { width: 160px; }
  th.actions-col, td.actions-col { width: 230px; }
  .details-toggle-btn { background: none; border: none; color: #999; cursor: pointer; font-size: 12px; padding: 0; width: 16px; }
  .status-Queued { color: #ccc; }
  .status-Downloading { color: #4af; }
  .status-Converting { color: #a78bfa; }
  .status-Finished { color: #6d6; }
  .status-Failed { color: #e66; }
  .status-Cancelled { color: #999; }
  .status-Paused { color: #fb5; }
  .speed-text { font-size: 11px; color: #7ac; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
  .id { font-family: monospace; font-size: 11px; color: #888; }
  .url { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .error { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #e88; cursor: pointer; }
  .actions { display: flex; gap: 4px; }
  .progress-wrap { width: 90px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
  .progress-bar { height: 100%; background: #4af; }
  .progress-text { font-size: 11px; color: #999; }
  .panel { background: #262626; border: 1px solid #3a3a3a; border-radius: 6px; padding: 12px; margin-bottom: 16px; display: none; }
  .panel.open { display: block; }
  .panel label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; margin-top: 8px; }
  .panel-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
  .dir-row { display: flex; gap: 6px; }
  label.checkbox { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #ccc; margin: 0; }
  .details-cell { background: #232323; font-size: 12px; color: #bbb; padding: 8px 10px; }
  .details-cell div { padding: 2px 0; }
  .details-cell .selectable { word-break: break-all; user-select: text; color: #ddd; }
</style>
</head>
<body>
  <h1>Lüdd <button id="settings-btn" class="secondary">Settings</button></h1>

  <div id="settings-panel" class="panel">
    <div class="panel-row">
      <div style="flex: 2; min-width: 260px;">
        <label for="download-dir">Output folder</label>
        <div class="dir-row">
          <input id="download-dir" type="text" />
          <button id="browse-btn" type="button" class="secondary">Browse&hellip;</button>
        </div>
      </div>
      <div>
        <label for="max-concurrent">Max concurrent downloads</label>
        <input id="max-concurrent" type="number" min="1" max="16" />
      </div>
      <div>
        <label for="per-download-concurrency">Connections per download</label>
        <input id="per-download-concurrency" type="number" min="1" max="32" />
      </div>
      <button id="save-settings-btn">Save</button>
    </div>
  </div>

  <form id="add-form">
    <input id="url" placeholder="https://example.com/video.m3u8" required />
    <input id="filename" placeholder="output filename (optional)" style="flex: 0 0 220px" />
    <button type="submit">Add</button>
  </form>
  <div class="toolbar">
    <button id="run-btn">Run queue</button>
    <button id="refresh-btn" class="secondary">Refresh</button>
    <span style="flex: 1"></span>
    <button id="remove-selected-btn" class="danger" disabled>Remove selected</button>
    <button id="retry-selected-btn" class="secondary" disabled>Retry selected</button>
    <button id="clear-btn" class="danger">Clear finished</button>
  </div>

  <div id="confirm-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); align-items: center; justify-content: center; z-index: 1000;">
    <div style="background: #262626; border: 1px solid #3a3a3a; border-radius: 8px; padding: 20px; min-width: 320px; max-width: 420px;">
      <div id="confirm-message" style="margin-bottom: 14px; font-size: 14px; color: #ddd;"></div>
      <label class="checkbox" style="margin-bottom: 18px;"><input type="checkbox" id="confirm-delete-files-chk" /> Also delete downloaded files</label>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button id="confirm-cancel-btn" class="secondary">Cancel</button>
        <button id="confirm-ok-btn" class="danger">Confirm</button>
      </div>
    </div>
  </div>

  <div id="quality-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); align-items: center; justify-content: center; z-index: 1000;">
    <div style="background: #262626; border: 1px solid #3a3a3a; border-radius: 8px; padding: 20px; min-width: 280px; max-width: 380px;">
      <div style="margin-bottom: 12px; font-size: 14px; color: #ddd;">Choose a quality</div>
      <div id="quality-options" style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; max-height: 300px; overflow-y: auto;"></div>
      <div style="display: flex; justify-content: flex-end;">
        <button id="quality-cancel-btn" class="secondary">Cancel</button>
      </div>
    </div>
  </div>

  <div id="image-preview-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; z-index: 1000; cursor: zoom-out;">
    <img id="image-preview-img" style="max-width: 90vw; max-height: 90vh; border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,0.5);" />
  </div>

  <table>
    <thead><tr>
      <th class="toggle-col"></th>
      <th class="checkbox-col"><input type="checkbox" id="select-all-chk" /></th>
      <th class="id-col">ID</th><th class="kind-col">Kind</th><th class="status-col">Status</th><th class="progress-col">Progress</th><th class="speed-col">Speed</th><th class="url-col">URL</th><th class="error-col">Error</th><th class="actions-col">Actions</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>

<script>
const { invoke } = window.__TAURI__.core;
const selected = new Set();
const detailsOpen = new Set();

const IMAGE_EXTENSIONS = new Set(["jpg", "jpeg", "png", "gif", "webp", "bmp", "svg"]);

function isImageFile(path) {
  const ext = (path.split(".").pop() || "").toLowerCase();
  return IMAGE_EXTENSIONS.has(ext);
}

function showImagePreview(dataUrl) {
  const overlay = document.getElementById("image-preview-overlay");
  document.getElementById("image-preview-img").src = dataUrl;
  overlay.style.display = "flex";
}

document.getElementById("image-preview-overlay").addEventListener("click", () => {
  document.getElementById("image-preview-overlay").style.display = "none";
  document.getElementById("image-preview-img").src = "";
});

function confirmAction(message) {
  return new Promise(resolve => {
    const overlay = document.getElementById("confirm-overlay");
    const okBtn = document.getElementById("confirm-ok-btn");
    const cancelBtn = document.getElementById("confirm-cancel-btn");
    const deleteChk = document.getElementById("confirm-delete-files-chk");

    document.getElementById("confirm-message").textContent = message;
    deleteChk.checked = false;
    overlay.style.display = "flex";

    const cleanup = () => {
      overlay.style.display = "none";
      okBtn.removeEventListener("click", onOk);
      cancelBtn.removeEventListener("click", onCancel);
    };
    const onOk = () => {
      const deleteFiles = deleteChk.checked;
      cleanup();
      resolve({ confirmed: true, deleteFiles });
    };
    const onCancel = () => {
      cleanup();
      resolve({ confirmed: false, deleteFiles: false });
    };
    okBtn.addEventListener("click", onOk);
    cancelBtn.addEventListener("click", onCancel);
  });
}

function pickQuality(options) {
  return new Promise(resolve => {
    const overlay = document.getElementById("quality-overlay");
    const list = document.getElementById("quality-options");
    const cancelBtn = document.getElementById("quality-cancel-btn");

    list.innerHTML = "";
    for (const opt of options) {
      const btn = document.createElement("button");
      btn.className = "secondary";
      btn.style.textAlign = "left";
      btn.textContent = opt.label;
      btn.addEventListener("click", () => {
        cleanup();
        resolve(opt.variant_key);
      });
      list.appendChild(btn);
    }
    overlay.style.display = "flex";

    const cleanup = () => {
      overlay.style.display = "none";
      cancelBtn.removeEventListener("click", onCancel);
    };
    const onCancel = () => {
      cleanup();
      resolve(null);
    };
    cancelBtn.addEventListener("click", onCancel);
  });
}

function formatBytesPerSec(bytesPerSec) {
  const units = ["B/s", "KB/s", "MB/s", "GB/s"];
  let v = bytesPerSec, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return `${v.toFixed(v >= 10 || i === 0 ? 0 : 1)} ${units[i]}`;
}

function formatBytes(bytes) {
  const units = ["B", "KB", "MB", "GB"];
  let v = bytes, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return `${v.toFixed(v >= 10 || i === 0 ? 0 : 1)} ${units[i]}`;
}

function progressBar(pct, label) {
  return `<div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div><div class="progress-text">${label ?? pct + "%"}</div>`;
}

function formatProgress(e) {
  if (e.status === "Finished") {
    return progressBar(100, "100%");
  }
  if (!e.progress) {
    return e.status === "Converting" ? `<div class="progress-text">Converting…</div>` : "";
  }
  const p = e.progress;
  // HLS/DASH: honest percentage from the known segment count.
  if (p.total_units > 0) {
    const pct = Math.min(100, Math.round((p.done_units / p.total_units) * 100));
    return progressBar(pct, `${pct}% (${p.done_units}/${p.total_units})`);
  }
  // HTTP with a known Content-Length.
  if (p.total_bytes) {
    const pct = Math.min(100, Math.round((p.downloaded_bytes / p.total_bytes) * 100));
    return progressBar(pct);
  }
  // HTTP, unknown size: show bytes transferred, no bar.
  return formatBytes(p.downloaded_bytes);
}

function formatSpeed(e) {
  if (e.status !== "Downloading" || !e.progress || !e.progress.speed_bps) return "";
  return formatBytesPerSec(e.progress.speed_bps);
}

const KIND_LABELS = { Http: "HTTP", Hls: "HLS", Dash: "DASH" };
function kindLabel(kind) {
  return KIND_LABELS[kind] ?? kind;
}

const STATUS_LABELS = { Downloading: "Running" };
function statusLabel(status) {
  return STATUS_LABELS[status] ?? status;
}

function updateBulkButtons() {
  const n = selected.size;
  document.getElementById("remove-selected-btn").disabled = n === 0;
  document.getElementById("retry-selected-btn").disabled = n === 0;
}

async function refresh() {
  const entries = await invoke("list_downloads");
  const liveIds = new Set(entries.map(e => e.id));
  for (const id of [...selected]) {
    if (!liveIds.has(id)) selected.delete(id);
  }

  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  for (const e of entries) {
    const tr = document.createElement("tr");
    const canRetry = e.status === "Failed" || e.status === "Cancelled";
    const isOpen = detailsOpen.has(e.id);
    tr.innerHTML = `
      <td class="toggle-col"><button class="details-toggle-btn" data-id="${e.id}" title="Details">${isOpen ? "▾" : "▸"}</button></td>
      <td class="checkbox-col"><input type="checkbox" class="row-chk" data-id="${e.id}" ${selected.has(e.id) ? "checked" : ""} /></td>
      <td class="id id-col">${e.id.slice(0, 8)}</td>
      <td class="kind-col">${kindLabel(e.kind)}</td>
      <td class="status-${e.status} status-col">${statusLabel(e.status)}</td>
      <td class="progress-col">${formatProgress(e)}</td>
      <td class="speed-text speed-col">${formatSpeed(e)}</td>
      <td class="url url-col copy-url" data-id="${e.id}" data-field="url" title="${e.url}&#10;(double-click to copy)">${e.url}</td>
      <td class="error error-col copy-url" data-id="${e.id}" data-field="error" title="${(e.error ?? "").replace(/"/g, "&quot;")}${e.error ? "\n(double-click to copy)" : ""}">${e.error ?? ""}</td>
      <td class="actions actions-col">
        ${e.status === "Finished" || (e.status === "Downloading" && e.kind === "Http") ? `<button class="small secondary preview-btn" data-id="${e.id}">Preview</button>` : ""}
        <button class="small secondary open-folder-btn" data-id="${e.id}">Open folder</button>
        ${e.status === "Downloading" ? `<button class="small secondary pause-btn" data-id="${e.id}">Pause</button>` : ""}
        ${e.status === "Paused" ? `<button class="small secondary resume-btn" data-id="${e.id}">Resume</button>` : ""}
        ${canRetry ? `<button class="small secondary retry-btn" data-id="${e.id}">Retry</button>` : ""}
        <button class="small danger remove-btn" data-id="${e.id}">Remove</button>
      </td>
    `;
    rows.appendChild(tr);

    const detailsTr = document.createElement("tr");
    detailsTr.className = "details-row";
    detailsTr.dataset.id = e.id;
    detailsTr.style.display = isOpen ? "table-row" : "none";
    let site = "";
    try { site = new URL(e.url).host; } catch { site = "(unknown)"; }
    const headerNames = Object.keys(e.headers ?? {});
    detailsTr.innerHTML = `
      <td></td><td></td>
      <td colspan="8" class="details-cell">
        <div><strong>Site:</strong> ${site}</div>
        <div><strong>Full link:</strong> <span class="selectable">${e.url}</span></div>
        <div><strong>Saving to:</strong> <span class="selectable">${e.dest}</span></div>
        <div><strong>Headers captured:</strong> ${headerNames.length ? headerNames.join(", ") : "none"}</div>
        <div><strong>Cookie captured:</strong> ${e.cookie ? "yes" : "no"}</div>
        <div><strong>Added:</strong> ${new Date(e.created_at * 1000).toLocaleString()}</div>
      </td>
    `;
    rows.appendChild(detailsTr);
  }

  rows.querySelectorAll(".row-chk").forEach(chk => {
    chk.addEventListener("change", () => {
      if (chk.checked) selected.add(chk.dataset.id); else selected.delete(chk.dataset.id);
      document.getElementById("select-all-chk").checked = selected.size > 0 && selected.size === entries.length;
      updateBulkButtons();
    });
  });
  rows.querySelectorAll(".details-toggle-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.id;
      const detailsTr = rows.querySelector(`.details-row[data-id="${id}"]`);
      if (!detailsTr) return;
      const nowOpen = detailsTr.style.display === "none";
      detailsTr.style.display = nowOpen ? "table-row" : "none";
      btn.textContent = nowOpen ? "▾" : "▸";
      if (nowOpen) detailsOpen.add(id); else detailsOpen.delete(id);
    });
  });
  rows.querySelectorAll(".retry-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      await invoke("retry_entry", { id: btn.dataset.id });
      await refresh();
    });
  });
  rows.querySelectorAll(".resume-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      await invoke("retry_entry", { id: btn.dataset.id });
      await refresh();
    });
  });
  rows.querySelectorAll(".pause-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      await invoke("pause_entry", { id: btn.dataset.id });
      await refresh();
    });
  });
  rows.querySelectorAll(".preview-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const entry = entries.find(x => x.id === btn.dataset.id);
      if (!entry) return;
      if (isImageFile(entry.dest)) {
        try {
          const dataUrl = await invoke("read_image_data_url", { path: entry.dest });
          showImagePreview(dataUrl);
          return;
        } catch (err) {
          console.error("image preview failed, falling back to external viewer", err);
        }
      }
      await invoke("open_file", { path: entry.dest });
    });
  });
  rows.querySelectorAll(".open-folder-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const entry = entries.find(x => x.id === btn.dataset.id);
      if (!entry) return;
      await invoke("open_containing_folder", { path: entry.dest });
    });
  });
  rows.querySelectorAll(".remove-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const { confirmed, deleteFiles } = await confirmAction("Remove this download from the list?");
      if (!confirmed) return;
      await invoke("remove_entry", { id: btn.dataset.id, deleteFiles });
      await refresh();
    });
  });
  rows.querySelectorAll(".copy-url").forEach(cell => {
    cell.addEventListener("dblclick", async () => {
      const entry = entries.find(x => x.id === cell.dataset.id);
      if (!entry) return;
      const value = cell.dataset.field === "error" ? entry.error : entry.url;
      if (!value) return;
      try {
        await navigator.clipboard.writeText(value);
        const original = cell.textContent;
        cell.textContent = "Copied!";
        setTimeout(() => { cell.textContent = original; }, 700);
      } catch (err) {
        console.error("clipboard write failed", err);
      }
    });
  });

  document.getElementById("select-all-chk").checked = entries.length > 0 && selected.size === entries.length;
  updateBulkButtons();
}

document.getElementById("select-all-chk").addEventListener("change", async (ev) => {
  const rows = document.querySelectorAll(".row-chk");
  if (ev.target.checked) {
    rows.forEach(chk => { chk.checked = true; selected.add(chk.dataset.id); });
  } else {
    rows.forEach(chk => { chk.checked = false; });
    selected.clear();
  }
  updateBulkButtons();
});

document.getElementById("remove-selected-btn").addEventListener("click", async () => {
  const { confirmed, deleteFiles } = await confirmAction(`Remove ${selected.size} selected download(s) from the list?`);
  if (!confirmed) return;
  for (const id of [...selected]) {
    await invoke("remove_entry", { id, deleteFiles });
  }
  selected.clear();
  await refresh();
});

document.getElementById("retry-selected-btn").addEventListener("click", async () => {
  for (const id of [...selected]) {
    await invoke("retry_entry", { id });
  }
  await refresh();
});

document.getElementById("add-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const url = document.getElementById("url").value.trim();
  const filename = document.getElementById("filename").value.trim() || null;
  if (!url) return;

  let quality = null;
  const submitBtn = ev.target.querySelector("button[type=submit]");
  submitBtn.disabled = true;
  try {
    const variants = await invoke("probe_qualities", { url });
    if (variants.length > 0) {
      quality = await pickQuality(variants);
      if (quality === null && variants.length > 0) {
        return;
      }
    }
  } finally {
    submitBtn.disabled = false;
  }

  await invoke("add_download", { url, filename, quality });
  document.getElementById("url").value = "";
  document.getElementById("filename").value = "";
  await refresh();
});

document.getElementById("run-btn").addEventListener("click", async () => {
  await invoke("run_queue");
  await refresh();
});

document.getElementById("refresh-btn").addEventListener("click", refresh);

document.getElementById("clear-btn").addEventListener("click", async () => {
  const { confirmed, deleteFiles } = await confirmAction("Clear all finished/failed/cancelled downloads from the list?");
  if (!confirmed) return;
  await invoke("clear_finished", { deleteFiles });
  await refresh();
});

document.getElementById("settings-btn").addEventListener("click", async () => {
  const panel = document.getElementById("settings-panel");
  if (!panel.classList.contains("open")) {
    const settings = await invoke("get_settings");
    document.getElementById("download-dir").value = settings.download_dir;
    document.getElementById("max-concurrent").value = settings.max_concurrent_downloads;
    document.getElementById("per-download-concurrency").value = settings.per_download_concurrency;
  }
  panel.classList.toggle("open");
});

document.getElementById("browse-btn").addEventListener("click", async () => {
  const picked = await invoke("pick_folder");
  if (picked) {
    document.getElementById("download-dir").value = picked;
  }
});

document.getElementById("save-settings-btn").addEventListener("click", async () => {
  const settings = {
    download_dir: document.getElementById("download-dir").value.trim(),
    max_concurrent_downloads: parseInt(document.getElementById("max-concurrent").value, 10) || 2,
    per_download_concurrency: parseInt(document.getElementById("per-download-concurrency").value, 10) || 8,
  };
  await invoke("set_settings", { settings });
  document.getElementById("settings-panel").classList.remove("open");
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
