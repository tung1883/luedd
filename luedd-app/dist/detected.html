<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Detected downloads</title>
<style>
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/ibm-plex-mono.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/ibm-plex-mono-600.woff2") format("woff2"); font-weight: 600 900; font-display: swap; }
  @font-face { font-family: "Cascadia Mono"; src: url("fonts/cascadia-mono.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Cascadia Mono"; src: url("fonts/cascadia-mono-700.woff2") format("woff2"); font-weight: 600 900; font-display: swap; }
  @font-face { font-family: "Excalifont"; src: url("fonts/excalifont.woff2") format("woff2"); font-weight: 400 900; font-display: swap; }
  :root {
    --bg: #16171A; --surface: #1E2024; --surface-2: #26282E; --line: #34373E;
    --text: #E7E8EA; --dim: #9A9DA5; --accent: #4FA3D8; --disc: #7FC0E6;
    --bad: #F26A63;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  * { scrollbar-color: var(--line) transparent; scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #474a52; }
  ::-webkit-scrollbar-corner { background: transparent; }
  body { font-family: var(--sans); margin: 0; padding: 0; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh; font-size: 13px; }
  a { color: var(--disc); }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 13px;
    background: linear-gradient(180deg, #212227, var(--surface));
    border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 rgba(255,255,255,.04); }
  header img { width: 18px; height: 18px; border-radius: 4px; }
  header h1 { font-size: 12px; margin: 0; flex: 1; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; }
  button { padding: 6px 12px; background: var(--accent); border: 1px solid transparent; color: var(--bg);
    border-radius: 6px; cursor: pointer; font-size: 12px; font-family: var(--sans); font-weight: 600; }
  button.secondary { background: transparent; border-color: var(--line); color: var(--dim); font-weight: 500; }
  button.secondary:hover { color: var(--text); border-color: var(--dim); }
  button.danger { background: transparent; border-color: rgba(242,106,99,.4); color: var(--bad); font-weight: 500; }
  button.danger:hover { background: var(--bad); color: var(--bg); }
  button.small { padding: 3px 8px; font-size: 11px; border-radius: 5px; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  header button { padding: 4px 9px; font-size: 11px; }
  .search-row { padding: 9px 13px; border-bottom: 1px solid var(--line); }
  .clr-wrap { position: relative; display: block; }
  .clr-x { position: absolute; right: 30px; top: 50%; transform: translateY(-50%); background: none; border: 0;
    color: var(--dim); font-size: 16px; line-height: 1; cursor: pointer; padding: 2px 5px; display: none; }
  .clr-x:hover { color: var(--text); }
  .clr-wrap.has-text .clr-x { display: block; }
  .clr-wrap.srch input { padding-right: 52px; }
  .funnel { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); background: none; border: 0;
    color: var(--dim); cursor: pointer; padding: 4px 5px; border-radius: 4px; line-height: 0; }
  .funnel svg { width: 15px; height: 15px; display: block; }
  .funnel:hover { color: var(--text); background: var(--surface-2); }
  .funnel.on { color: var(--accent); }
  .funnel .fdot { position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); display: none; }
  .funnel.active .fdot { display: block; }
  .filter-drawer { display: none; margin-top: 8px; }
  .filter-drawer.open { display: block; }
  .fd-row { display: flex; gap: 8px; align-items: end; }
  .fd-fld { flex: 1 1 0; min-width: 0; display: block; }
  .fd-lbl { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: 4px; }
  .fd-fld input[type=text] { padding: 7px 9px; }
  /* custom dropdown (matches settings dropdown in main window) */
  .dd { position: relative; }
  .dd-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px; color: var(--text);
    font-family: var(--sans); font-size: 12px; font-weight: 400; padding: 7px 9px; cursor: pointer; }
  .dd-btn:hover { border-color: var(--dim); }
  .dd.open .dd-btn { border-color: transparent; outline: 2px solid var(--accent); outline-offset: 1px; }
  .dd-btn svg { color: var(--dim); flex-shrink: 0; transition: transform .12s; }
  .dd.open .dd-btn svg { transform: rotate(180deg); }
  .dd-list { position: absolute; left: 0; right: 0; top: calc(100% + 5px); z-index: 20; margin: 0; padding: 4px;
    list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 14px 36px rgba(0,0,0,.5); display: none; max-height: 240px; overflow-y: auto; }
  .dd.open .dd-list { display: block; }
  .dd-list li { padding: 7px 9px; border-radius: 5px; font-size: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dd-list li:hover { background: var(--surface-2); }
  .dd-list li[aria-selected="true"] { color: var(--accent); }
  .dd-list li[aria-selected="true"]::after { content: "\2713"; font-size: 11px; }
  .filter-status { display: flex; align-items: center; gap: 6px; margin-top: 7px; font-size: 11px; color: var(--dim); }
  .fs-reset { background: none; border: 0; color: var(--disc); cursor: pointer; margin-left: auto; font-size: 11px; padding: 0; }
  .fs-reset:hover { text-decoration: underline; }
  input[type=text] { width: 100%; padding: 6px 9px; background: var(--surface); border: 1px solid var(--line);
    color: var(--text); border-radius: 6px; font-size: 12px; font-family: var(--sans); }
  input[type=text]::placeholder { color: var(--dim); }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  #list { flex: 1; overflow-y: auto; }
  .empty { padding: 24px; color: var(--dim); font-size: 13px; text-align: center; }
  .row { display: grid; grid-template-columns: 14px 74px minmax(0,1fr) auto; gap: 10px;
    padding: 9px 12px 9px 10px; border-bottom: 1px solid var(--line); border-left: 2px solid transparent;
    align-items: center; }
  .row:hover { background: var(--surface); border-left-color: var(--accent);
    box-shadow: inset 3px 0 8px -4px rgba(79,163,216,.5); }
  .toggle-btn { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 11px; padding: 0; align-self: center; }
  .toggle-btn:hover { color: var(--text); }
  .row-preview { width: 74px; height: 44px; border-radius: 4px; border: 1px solid var(--line); overflow: hidden;
    background: linear-gradient(135deg, #242730, #2b2f38); display: flex; align-items: center; justify-content: center; }
  .thumb { width: 74px; height: 44px; object-fit: cover; display: block; cursor: pointer; }
  .thumb-pdf { width: 74px; height: 44px; cursor: default; }
  .row-body { min-width: 0; }
  .title-btn { background: none; border: none; color: var(--text); cursor: pointer; text-align: left; font-size: 13px;
    padding: 0; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title-btn:hover { color: var(--disc); }
  .info-text { display: block; font-family: var(--mono); font-size: 11px; color: var(--dim); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-actions { display: flex; gap: 6px; align-self: center; }
  .add-btn { background: var(--accent); border: 1px solid var(--accent); color: var(--bg); font-weight: 600;
    border-radius: 5px; font-size: 11px; padding: 4px 11px; cursor: pointer; font-family: var(--sans); white-space: nowrap; }
  .add-btn:hover { filter: brightness(1.08); }
  .details-panel { display: none; grid-column: 2 / -1; margin-top: 8px; padding-top: 8px;
    border-top: 1px dashed var(--line); font-size: 12px; color: var(--dim); min-width: 0; }
  .details-panel.open { display: block; }
  .copyable-line { font-family: var(--mono); font-size: 11px; display: flex; overflow: hidden; cursor: pointer; margin-bottom: 4px; max-width: 100%; }
  .cl-label { flex: 0 0 auto; margin-right: 4px; }
  .cl-origin { flex: 0 0 auto; white-space: nowrap; }
  .cl-mid { flex: 0 200 auto; min-width: 1.6ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cl-tail { flex: 0 1 auto; min-width: 3ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .quality-box { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
  .quality-box button { background: none; border: none; color: var(--disc); cursor: pointer; text-align: left; font-size: 12px; font-weight: 400; padding: 1px 0; }
  footer { padding: 9px 13px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .mon-toggle { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); cursor: pointer; user-select: none; }
  .mon-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  .mon-track { width: 30px; height: 17px; border-radius: 9px; background: var(--line); position: relative; flex-shrink: 0; transition: background .12s; }
  .mon-track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--dim); transition: left .12s, background .12s; }
  .mon-toggle input:checked + .mon-track { background: var(--accent); }
  .mon-toggle input:checked + .mon-track::after { left: 15px; background: var(--bg); }
  .mon-toggle input:checked ~ span:last-child { color: var(--text); }
  .mon-toggle input:focus-visible + .mon-track { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <header>
    <img src="icon.png" alt="" />
    <h1><span data-i18n="detected">Detected</span> <span id="count" style="color: var(--dim); font-weight: 400;"></span></h1>
    <button id="pin-btn" class="secondary" data-i18n="unpin" data-i18n-title="pin_title" title="Toggle always-on-top">Unpin</button>
    <button id="hide-btn" class="secondary" data-i18n="hide" data-i18n-title="hide_title" title="Hide this window">Hide</button>
  </header>
  <div class="search-row">
    <span class="clr-wrap srch">
      <input id="search-input" type="text" data-i18n-placeholder="filter_ph" placeholder="Filter by name or site&hellip;" />
      <button type="button" class="clr-x" id="search-clear" data-i18n-title="clear_field" title="Clear" aria-label="Clear">&times;</button>
      <button type="button" class="funnel" id="filter-toggle" data-i18n-title="more_filters" title="Filters" aria-label="Filters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path></svg>
        <span class="fdot"></span>
      </button>
    </span>
    <div class="filter-drawer" id="filter-drawer">
      <div class="fd-row">
        <div class="fd-fld"><span class="fd-lbl" data-i18n="f_type">Type</span>
          <div class="dd" id="filter-type" data-value="all">
            <button type="button" class="dd-btn"><span class="dd-cur" data-i18n="f_all">All types</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
            <ul class="dd-list">
              <li data-value="all" data-i18n="f_all">All types</li>
              <li data-value="video" data-i18n="f_video">Video</li>
              <li data-value="image" data-i18n="f_image">Image</li>
              <li data-value="audio" data-i18n="f_audio">Audio</li>
              <li data-value="hls">HLS</li>
              <li data-value="dash">DASH</li>
              <li data-value="doc" data-i18n="f_doc">Document</li>
            </ul>
          </div>
        </div>
        <label class="fd-fld"><span class="fd-lbl" data-i18n="f_hide">Hide</span>
          <input id="filter-hide" type="text" data-i18n-placeholder="f_hide_ph" placeholder="e.g. ytimg, .vtt" />
        </label>
      </div>
    </div>
    <div class="filter-status" id="filter-status" style="display:none">
      <span id="filter-count"></span>
      <button type="button" class="fs-reset" id="filter-reset" data-i18n="f_reset">Reset filters</button>
    </div>
  </div>
  <div id="list"></div>
  <div id="image-preview-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; z-index: 1000; cursor: pointer; overflow: auto;">
    <img id="image-preview-img" style="max-width: 90vw; max-height: 90vh; border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); transition: transform .08s;" />
  </div>
  <footer>
    <label class="mon-toggle" title="Stop / resume browser monitoring" data-i18n-title="monitoring_title">
      <input type="checkbox" id="mon-chk" checked />
      <span class="mon-track"></span>
      <span data-i18n="monitoring">Monitoring</span>
    </label>
    <span style="flex: 1"></span>
    <button id="clear-btn" class="danger" data-i18n="clear_items">Clear items</button>
  </footer>

<script src="i18n.js"></script>
<script>
  const L = (k, v) => window.I18N.t(k, v);
  const FONTS = {
    system: null,
    georgia: 'Georgia, "Times New Roman", serif',
    "ibm-plex-mono": '"IBM Plex Mono", ui-monospace, Consolas, monospace',
    excalifont: '"Excalifont", "Comic Sans MS", cursive',
    "cascadia-mono": '"Cascadia Mono", ui-monospace, Consolas, monospace',
  };
  function applyFont(key) {
    const fam = FONTS[key];
    const s = document.documentElement.style;
    if (fam) { s.setProperty("--sans", fam); s.setProperty("--mono", fam); }
    else { s.removeProperty("--sans"); s.removeProperty("--mono"); }
  }

  window.addEventListener("error", e => {
    let bar = document.getElementById("js-error-bar");
    if (!bar) {
      bar = document.createElement("div");
      bar.id = "js-error-bar";
      bar.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#a33;color:#fff;font:11px/1.4 monospace;padding:6px 10px;white-space:pre-wrap;";
      document.body.appendChild(bar);
    }
    bar.textContent = "JS error: " + (e.message || e.error) + " @ " + (e.filename || "") + ":" + (e.lineno || "");
  });

  const APP_BASE_URL = "http://127.0.0.1:8597";
  let allItems = [];
  let pinned = true;

  const IMAGE_EXTENSIONS = new Set(["jpg", "jpeg", "png", "gif", "webp", "bmp", "svg"]);

  function isImageUrl(url) {
    try {
      const path = new URL(url).pathname;
      const ext = (path.split(".").pop() || "").toLowerCase();
      return IMAGE_EXTENSIONS.has(ext);
    } catch {
      return false;
    }
  }

  const previewImg = document.getElementById("image-preview-img");
  let pvScale = 1, pvPanX = 0, pvPanY = 0, pvDrag = false, pvStartX = 0, pvStartY = 0;

  function pvApply() {
    previewImg.style.transform = `translate(${pvPanX}px, ${pvPanY}px) scale(${pvScale})`;
    previewImg.style.cursor = pvScale > 1 ? (pvDrag ? "grabbing" : "grab") : "pointer";
  }

  function pvReset() { pvScale = 1; pvPanX = 0; pvPanY = 0; pvDrag = false; }

  function closeImagePreview() {
    document.getElementById("image-preview-overlay").style.display = "none";
    previewImg.src = "";
    pvReset();
    pvApply();
  }

  document.getElementById("image-preview-overlay").addEventListener("click", ev => {
    if (ev.target.id === "image-preview-img") return;
    closeImagePreview();
  });

  document.getElementById("image-preview-overlay").addEventListener("wheel", ev => {
    ev.preventDefault();
    const next = pvScale * (ev.deltaY < 0 ? 1.15 : 1 / 1.15);
    pvScale = Math.min(6, Math.max(1, next));
    if (pvScale === 1) { pvPanX = 0; pvPanY = 0; }
    previewImg.style.transition = "transform .08s";
    pvApply();
  }, { passive: false });

  previewImg.addEventListener("dblclick", ev => {
    ev.stopPropagation();
    if (pvScale > 1) { pvReset(); } else { pvScale = 2; pvPanX = 0; pvPanY = 0; }
    previewImg.style.transition = "transform .12s";
    pvApply();
  });

  previewImg.addEventListener("mousedown", ev => {
    if (pvScale <= 1) return;
    ev.preventDefault();
    pvDrag = true;
    pvStartX = ev.clientX - pvPanX;
    pvStartY = ev.clientY - pvPanY;
    previewImg.style.transition = "none";
    pvApply();
  });
  window.addEventListener("mousemove", ev => {
    if (!pvDrag) return;
    pvPanX = ev.clientX - pvStartX;
    pvPanY = ev.clientY - pvStartY;
    pvApply();
  });
  window.addEventListener("mouseup", () => {
    if (!pvDrag) return;
    pvDrag = false;
    previewImg.style.transition = "transform .08s";
    pvApply();
  });

  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape" && document.getElementById("image-preview-overlay").style.display === "flex") closeImagePreview();
  });

  async function post(path, body) {
    try {
      const res = await fetch(APP_BASE_URL + path, {
        method: "POST",
        body: JSON.stringify(body || {}),
      });
      return await res.json();
    } catch {
      return null;
    }
  }

  let fetchInFlight = false;
  let refetchQueued = false;
  // Signature of the last list actually rendered (just the ordered ids -
  // items are immutable once created server-side, so an id list fully
  // captures "did anything add/remove"). Most polls fetch an unchanged list;
  // rebuilding a couple hundred DOM rows every 2s for no reason is wasted
  // work and would blow away in-progress interactions (typed search text
  // aside - that's untouched either way since it lives outside #list) for no
  // benefit, so a no-op fetch skips the render entirely instead of just
  // re-doing it faster.
  let lastRenderedSignature = null;

  // A burst of detections (e.g. a page with hundreds of segment/byte-range
  // requests) fires one "refresh" event per item - without this guard, each
  // triggers its own independent, unsequenced fetch, and since network
  // responses can resolve out of order, whichever one happens to finish
  // *last* wins, even if it was one of the earliest ones issued (captured
  // when the server had barely any items yet). Coalescing overlapping calls
  // into "run once more after the current one finishes" guarantees the fetch
  // that actually renders was always issued after every event seen so far.
  async function fetchAndRender() {
    if (fetchInFlight) {
      refetchQueued = true;
      return;
    }
    fetchInFlight = true;
    do {
      refetchQueued = false;
      try {
        const res = await fetch(APP_BASE_URL + "/sync");
        const json = await res.json();
        const monChk = document.getElementById("mon-chk");
        if (json && !monChk.matches(":hover") && !monChk.matches(":active")) monChk.checked = json.enabled !== false;
        const fetched = json.videoList || [];
        const signature = fetched.map(i => i.id).join(",");
        if (signature === lastRenderedSignature) {
          continue; // nothing actually changed - skip the render entirely
        }
        lastRenderedSignature = signature;
        allItems = fetched;
      } catch {
        allItems = [];
        lastRenderedSignature = null;
      }
      document.getElementById("count").innerText = allItems.length > 0 ? `(${allItems.length})` : "";
      applyFilter(document.getElementById("search-input").value);
    } while (refetchQueued);
    fetchInFlight = false;
  }

  // Infer a coarse media kind from the item's URL extension + isImage flag.
  function itemKind(item) {
    if (item.isImage) return "image";
    const src = (item.url || item.info || item.text || "").toLowerCase().split("?")[0];
    const ext = src.slice(src.lastIndexOf(".") + 1);
    if (/m3u8/.test(src)) return "hls";
    if (/mpd$/.test(src)) return "dash";
    if (["jpg","jpeg","png","gif","webp","bmp","svg","avif","ico"].includes(ext)) return "image";
    if (["mp4","mkv","webm","mov","m4v","avi","ts","m2ts","flv","mpg","mpeg"].includes(ext)) return "video";
    if (["mp3","m4a","aac","ogg","opus","flac","wav","weba"].includes(ext)) return "audio";
    if (["pdf","zip","rar","7z","doc","docx","xls","xlsx","ppt","pptx","txt","csv","epub"].includes(ext)) return "doc";
    return "other";
  }

  function filterActive() {
    const type = document.getElementById("filter-type").dataset.value;
    const hide = document.getElementById("filter-hide").value.trim();
    return type !== "all" || hide.length > 0;
  }

  function applyFilter(query) {
    const terms = (query || "").trim().toLowerCase().split(/\s+/).filter(t => t);
    const type = document.getElementById("filter-type").dataset.value;
    const hideTerms = document.getElementById("filter-hide").value.trim().toLowerCase().split(/[\s,]+/).filter(t => t);

    const items = allItems.filter(item => {
      const haystack = [item.text, item.info, item.url, item.pageUrl].filter(Boolean).join("\n").toLowerCase();
      if (!terms.every(term => haystack.includes(term))) return false;
      if (hideTerms.some(term => haystack.includes(term))) return false;
      if (type !== "all") {
        const k = itemKind(item);
        if (type === "video") { if (k !== "video" && k !== "hls" && k !== "dash") return false; }
        else if (k !== type) return false;
      }
      return true;
    });

    // funnel indicator + status line
    const active = filterActive();
    const funnel = document.getElementById("filter-toggle");
    funnel.classList.toggle("active", active);
    const hidden = allItems.length - items.length;
    const status = document.getElementById("filter-status");
    if (active && hidden > 0) {
      status.style.display = "flex";
      document.getElementById("filter-count").textContent = L("f_shown", { shown: items.length, hidden });
    } else {
      status.style.display = "none";
    }
    renderList(items);
  }

  function reapplyFilter() {
    applyFilter(document.getElementById("search-input").value);
  }

  // Split a URL so the origin (scheme + host) always stays fully visible; the
  // middle path collapses first, the trailing segment (filename) second. The
  // query string is dropped here — the full URL is in the tooltip / on copy.
  function splitUrl(u) {
    try {
      const url = new URL(u);
      const path = url.pathname || "/";
      const slash = path.lastIndexOf("/");
      return { origin: url.origin, mid: path.slice(0, slash + 1), tail: path.slice(slash + 1) };
    } catch {
      const base = (u.split("?")[0]) || u;
      const slash = base.lastIndexOf("/");
      if (slash === -1) return { origin: "", mid: "", tail: base };
      return { origin: "", mid: base.slice(0, slash + 1), tail: base.slice(slash + 1) };
    }
  }

  function makeCopyableLine(label, value) {
    const line = document.createElement("div");
    line.className = "copyable-line";
    const s = splitUrl(value);
    const lab = document.createElement("span"); lab.className = "cl-label"; lab.textContent = label;
    const origin = document.createElement("span"); origin.className = "cl-origin"; origin.textContent = s.origin;
    const mid = document.createElement("span"); mid.className = "cl-mid"; mid.textContent = s.mid;
    const tail = document.createElement("span"); tail.className = "cl-tail"; tail.textContent = s.tail;
    line.append(lab, origin, mid, tail);
    line.title = value + "\n" + L("dbl_copy");
    line.addEventListener("dblclick", async e => {
      e.stopPropagation();
      try {
        await navigator.clipboard.writeText(value);
        const original = line.innerHTML;
        line.textContent = L("copied");
        setTimeout(() => { line.innerHTML = original; }, 700);
      } catch (err) {
        console.error("clipboard write failed", err);
      }
    });
    return line;
  }

  // `renderList` rebuilds every row from scratch on every poll/refresh (every
  // 2s at minimum, see the `setInterval` below) - without tracking which
  // rows are expanded, that rebuild would collapse a details panel the user
  // just opened right back up before they could read it.
  const expandedIds = new Set();

  // id -> { url, kind } | null, so a re-render never re-fetches a thumbnail.
  const previewCache = new Map();

  function showImageOverlay(src) {
    pvReset();
    previewImg.src = src;
    pvApply();
    document.getElementById("image-preview-overlay").style.display = "flex";
  }

  // Only fetch a preview once its row is (near) visible - a page can detect
  // hundreds of media requests and each preview is an HTTP fetch or an ffmpeg
  // frame-grab on the backend.
  const previewObserver = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (e.isIntersecting) {
        previewObserver.unobserve(e.target);
        if (e.target._loadPreview) e.target._loadPreview();
      }
    }
  }, { root: document.getElementById("list"), rootMargin: "150px" });

  async function loadPreview(item, col) {
    if (col.dataset.loaded) return;
    col.dataset.loaded = "1";

    let data = previewCache.get(item.id);
    if (data === undefined) {
      const res = await post("/preview", { vid: item.id });
      data = (res && res.previewDataUrl) ? { url: res.previewDataUrl, kind: res.previewKind || "image" } : null;
      previewCache.set(item.id, data);
    }
    if (!data) return; // no preview available - column stays empty

    let el;
    if (data.kind === "pdf") {
      el = document.createElement("embed");
      el.type = "application/pdf";
      el.src = data.url;
      el.className = "thumb thumb-pdf";
    } else {
      el = document.createElement("img");
      el.className = "thumb";
      el.alt = "";
      el.src = data.url;
      el.addEventListener("click", ev => { ev.stopPropagation(); showImageOverlay(data.url); });
    }
    col.appendChild(el);
  }

  async function probeQualityFor(item, qualityBox) {
    const res = await post("/probe-quality", { vid: item.id });
    const variants = (res && res.qualityVariants) || [];
    qualityBox.innerHTML = "";
    if (variants.length === 0) return;
    const label = document.createElement("div");
    label.innerText = L("choose_quality_c");
    label.style.marginBottom = "2px";
    qualityBox.appendChild(label);
    variants.forEach(variant => {
      const qBtn = document.createElement("button");
      qBtn.innerText = variant.label;
      qBtn.addEventListener("click", async ev => {
        ev.stopPropagation();
        const original = qBtn.innerText;
        const r = await post("/vid", { vid: item.id, quality: variant.variant_key });
        qBtn.innerText = r && r.vidQueued === true ? L("added_to_luedd")
          : r && r.vidQueued === false ? L("link_expired")
          : L("cant_reach");
        setTimeout(() => { qBtn.innerText = original; }, 1500);
      });
      qualityBox.appendChild(qBtn);
    });
  }

  // Persistent id -> row element map, so an unchanged item's row is never
  // torn down and rebuilt - only genuinely new items get a fresh row, and
  // only genuinely gone ones get removed. `appendChild` on a node already in
  // the DOM just repositions it (cheap, no recreation), which is how
  // existing rows get kept in the right order without rebuilding them.
  const rowElements = new Map();
  let emptyEl = null;

  function renderList(items) {
    const list = document.getElementById("list");

    if (items.length === 0) {
      rowElements.forEach(el => el.remove());
      rowElements.clear();
      if (!emptyEl) {
        emptyEl = document.createElement("div");
        emptyEl.className = "empty";
        list.appendChild(emptyEl);
      }
      emptyEl.innerText = allItems.length === 0 ? L("nothing_detected") : L("no_matches");
      return;
    }

    if (emptyEl) {
      emptyEl.remove();
      emptyEl = null;
    }

    const newIds = new Set(items.map(item => item.id));
    for (const [id, el] of rowElements) {
      if (!newIds.has(id)) {
        el.remove();
        rowElements.delete(id);
      }
    }

    items.forEach(item => {
      const existing = rowElements.get(item.id);
      if (existing) {
        list.appendChild(existing); // already correct content - just keep order in sync
        return;
      }
      const row = buildRow(item);
      rowElements.set(item.id, row);
      list.appendChild(row);
    });
  }

  function hostOf(u) { try { return new URL(u).host; } catch { return ""; } }

  // The backend's `text` is sometimes the page URL and `info` the real name.
  // Prefer a human title; put host/kind/size in the secondary line.
  function rowTitleMeta(item) {
    const txt = (item.text || "").trim();
    const looksUrl = /^https?:\/\//i.test(txt);
    if (looksUrl && item.info) return { title: item.info, meta: hostOf(item.pageUrl || item.url) || txt };
    return {
      title: txt || item.info || "—",
      meta: (item.info && item.info !== txt) ? item.info : (hostOf(item.pageUrl || item.url) || ""),
    };
  }

  async function queueItem(item, btn) {
    const original = btn.innerText;
    const res = await post("/vid", { vid: item.id });
    btn.innerText = res && res.vidQueued === true ? L("added_to_luedd")
      : res && res.vidQueued === false ? L("link_expired")
      : L("cant_reach");
    setTimeout(() => { btn.innerText = original; }, 1500);
  }

  function buildRow(item) {
    const row = document.createElement("div");
    row.className = "row";

    const toggle = document.createElement("button");
    toggle.className = "toggle-btn";
    toggle.innerText = "▸";
    toggle.title = L("details");

    const previewCol = document.createElement("div");
    previewCol.className = "row-preview";
    previewCol._loadPreview = () => loadPreview(item, previewCol);
    previewObserver.observe(previewCol);

    const { title, meta } = rowTitleMeta(item);
    const titleBtn = document.createElement("button");
    titleBtn.className = "title-btn";
    titleBtn.innerText = title;
    titleBtn.title = title;

    const infoText = document.createElement("div");
    infoText.className = "info-text";
    infoText.innerText = meta;

    const body = document.createElement("div");
    body.className = "row-body";
    body.appendChild(titleBtn);
    body.appendChild(infoText);

    const actions = document.createElement("div");
    actions.className = "row-actions";
    const addBtn = document.createElement("button");
    addBtn.className = "add-btn";
    addBtn.innerText = L("add");
    actions.appendChild(addBtn);

    const detailsPanel = document.createElement("div");
    detailsPanel.className = "details-panel";
    detailsPanel.appendChild(makeCopyableLine(L("site_c"), item.pageUrl || L("val_unknown")));
    detailsPanel.appendChild(makeCopyableLine(L("link_c"), item.url));

    const qualityBox = document.createElement("div");
    qualityBox.className = "quality-box";
    detailsPanel.appendChild(qualityBox);
    let qualityProbed = false;

    if (expandedIds.has(item.id)) {
      detailsPanel.classList.add("open");
      toggle.innerText = "▾";
      qualityProbed = true;
      probeQualityFor(item, qualityBox);
    }

    row.append(toggle, previewCol, body, actions, detailsPanel);

    titleBtn.addEventListener("click", () => queueItem(item, titleBtn));
    addBtn.addEventListener("click", () => queueItem(item, addBtn));

    toggle.addEventListener("click", async e => {
      e.stopPropagation();
      const nowOpen = !detailsPanel.classList.contains("open");
      detailsPanel.classList.toggle("open", nowOpen);
      toggle.innerText = nowOpen ? "▾" : "▸";
      if (nowOpen) {
        expandedIds.add(item.id);
      } else {
        expandedIds.delete(item.id);
      }
      if (nowOpen && !qualityProbed) {
        qualityProbed = true;
        await probeQualityFor(item, qualityBox);
      }
    });

    return row;
  }

  {
    const si = document.getElementById("search-input");
    const sw = si.closest(".clr-wrap");
    const syncClr = () => sw.classList.toggle("has-text", si.value.length > 0);
    si.addEventListener("input", e => { syncClr(); applyFilter(e.target.value); });
    document.getElementById("search-clear").addEventListener("click", () => {
      si.value = "";
      si.dispatchEvent(new Event("input"));
      si.focus();
    });
  }

  // minimal themed dropdown: data-value on the .dd, click a <li> to set it.
  function initDropdown(dd, onChange) {
    const btn = dd.querySelector(".dd-btn");
    const cur = dd.querySelector(".dd-cur");
    const items = [...dd.querySelectorAll(".dd-list li")];
    dd._sync = () => {
      const v = dd.dataset.value;
      items.forEach(li => {
        const on = li.dataset.value === v;
        li.setAttribute("aria-selected", on ? "true" : "false");
        if (on) cur.textContent = li.textContent;
      });
    };
    btn.addEventListener("click", e => {
      e.stopPropagation();
      document.querySelectorAll(".dd.open").forEach(o => { if (o !== dd) o.classList.remove("open"); });
      dd.classList.toggle("open");
    });
    items.forEach(li => li.addEventListener("click", () => {
      dd.dataset.value = li.dataset.value;
      dd.classList.remove("open");
      dd._sync();
      if (onChange) onChange(li.dataset.value);
    }));
    dd._sync();
  }
  document.addEventListener("click", () => document.querySelectorAll(".dd.open").forEach(o => o.classList.remove("open")));

  const filterTypeDD = document.getElementById("filter-type");
  initDropdown(filterTypeDD, reapplyFilter);

  {
    const drawer = document.getElementById("filter-drawer");
    const toggle = document.getElementById("filter-toggle");
    toggle.addEventListener("click", () => {
      const open = drawer.classList.toggle("open");
      toggle.classList.toggle("on", open);
    });
    document.getElementById("filter-hide").addEventListener("input", reapplyFilter);
    document.getElementById("filter-reset").addEventListener("click", () => {
      filterTypeDD.dataset.value = "all";
      filterTypeDD._sync();
      document.getElementById("filter-hide").value = "";
      reapplyFilter();
    });
  }

  document.getElementById("clear-btn").addEventListener("click", async () => {
    await post("/clear", {});
    await fetchAndRender();
  });

  document.getElementById("mon-chk").addEventListener("change", async e => {
    await post("/monitoring", { enabled: e.target.checked });
  });

  document.getElementById("pin-btn").addEventListener("click", async () => {
    pinned = !pinned;
    document.getElementById("pin-btn").innerText = pinned ? L("unpin") : L("pin");
    await window.__TAURI__.core.invoke("detection_window_set_pinned", { pinned });
  });

  document.getElementById("hide-btn").addEventListener("click", async () => {
    await window.__TAURI__.core.invoke("detection_window_hide");
  });

  window.__TAURI__.event.listen("detection-updated", fetchAndRender);

  // The event above is a best-effort nudge, not the source of correctness -
  // during a burst (many detections in quick succession, e.g. a page with
  // hundreds of media requests), several "detection-updated" events fire
  // before this page has even finished loading and calling `listen()`.
  // Tauri doesn't queue events for a listener that wasn't registered yet, so
  // those are just gone - no amount of debouncing on this end can recover
  // an event that was never received. A plain, dumb, reliable poll is what
  // actually guarantees this list is never stuck stale for more than a
  // couple seconds, independent of whether any given event made it through.
  setInterval(fetchAndRender, 2000);

  (async () => {
    try {
      const s = await window.__TAURI__.core.invoke("get_settings");
      applyFont(s.font || "system");
      window.I18N.applyLang(s.language || "en");
    } catch (e) {
      window.I18N.applyLang("en");
    }
    filterTypeDD._sync();
    fetchAndRender();
  })();

  // pick up language/font the moment the user saves them in the main window
  window.__TAURI__.event.listen("settings-changed", async () => {
    try {
      const s = await window.__TAURI__.core.invoke("get_settings");
      applyFont(s.font || "system");
      window.I18N.applyLang(s.language || "en");
      filterTypeDD._sync();
    } catch (e) {}
  });
</script>
</body>
</html>
