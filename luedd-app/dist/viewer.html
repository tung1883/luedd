<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Instagram</title>
<style>
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/ibm-plex-mono.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Cascadia Mono"; src: url("fonts/cascadia-mono.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Excalifont"; src: url("fonts/excalifont.woff2") format("woff2"); font-weight: 400 900; font-display: swap; }
  :root {
    --bg: #16171A; --surface: #1E2024; --surface-2: #26282E; --line: #34373E;
    --text: #E7E8EA; --dim: #9A9DA5; --accent: #4FA3D8; --disc: #7FC0E6; --good: #4FD08A; --bad: #F26A63; --warn: #F0A24A;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  * { scrollbar-color: var(--line) transparent; scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  body { font-family: var(--sans); margin: 0; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh; font-size: 13px; }

  header { display: flex; align-items: center; gap: 10px; padding: 11px 16px;
    background: linear-gradient(180deg, #212227, var(--surface)); border-bottom: 1px solid var(--line); }
  header .htitle { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
  .search-wrap { position: relative; flex: 1; min-width: 0; max-width: 340px; margin-left: auto; }
  .hsearch { width: 100%; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 6px; color: var(--text); font: inherit; font-size: 12px; padding: 6px 26px 6px 10px; }
  .hsearch:focus { outline: none; border-color: var(--accent); }
  .hsearch::-webkit-search-cancel-button { -webkit-appearance: none; }
  .search-clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); z-index: 5;
    width: 18px; height: 18px; padding: 0; display: flex; align-items: center; justify-content: center;
    background: transparent; border: 0; color: var(--dim); cursor: pointer; }
  .search-clear:hover { color: var(--text); }
  .search-clear[hidden] { display: none; }
  .search-clear svg { width: 12px; height: 12px; }

  .search-dd { position: absolute; top: 100%; left: 0; right: 0; margin-top: 6px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 24px -8px rgba(0,0,0,.5); z-index: 30; overflow: hidden; }
  .search-dd[hidden] { display: none; }
  .search-dd .grp-label { font: 700 9.5px/1 var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--dim); padding: 9px 11px 5px; }
  .search-dd .row { display: flex; align-items: center; gap: 9px; padding: 7px 11px; cursor: pointer; }
  .search-dd .row:hover { background: var(--surface-2); }
  .search-dd .av { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 10px; font-weight: 700; overflow: hidden; }
  .search-dd .av img { width: 100%; height: 100%; object-fit: cover; }
  .search-dd .nm { font-weight: 600; font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .search-dd .nm .sub { color: var(--dim); font-size: 10.5px; font-weight: 500; }
  button { padding: 6px 12px; background: var(--accent); border: 1px solid transparent; color: var(--bg);
    border-radius: 6px; cursor: pointer; font-size: 12px; font-family: var(--sans); font-weight: 600; }
  button.ghost { background: transparent; border-color: var(--line); color: var(--dim); font-weight: 500; }
  button.ghost:hover { color: var(--text); border-color: var(--dim); }
  button:disabled { opacity: .5; cursor: default; }
  .iconbtn { padding: 0; width: 28px; height: 26px; display: flex; align-items: center; justify-content: center; }
  .iconbtn svg { width: 15px; height: 15px; }

  #scroll { flex: 1; overflow-y: auto; }
  .empty { padding: 40px 24px; color: var(--dim); font-size: 13px; text-align: center; line-height: 1.6; }
  .note { color: var(--warn); }

  .acct-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 16px; }
  .acard { border: 1px solid var(--line); border-radius: 10px; padding: 14px 12px; text-align: center; cursor: pointer; background: var(--surface); }
  .acard:hover { border-color: var(--dim); }
  .acard .av { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 8px; background: var(--surface-2);
    overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 22px; font-weight: 700; }
  .acard .av img { width: 100%; height: 100%; object-fit: cover; }
  .acard .nm { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acard .sub { color: var(--dim); font-size: 11px; margin-top: 3px; }
  .resolving { padding: 10px 16px; font-size: 11px; color: var(--dim); }

  .phead { display: flex; gap: 18px; padding: 20px 18px 12px; align-items: flex-start; }
  .phead .pav { width: 90px; height: 90px; border-radius: 50%; flex-shrink: 0; background: var(--surface-2);
    overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 30px; font-weight: 700; }
  .phead .pav img { width: 100%; height: 100%; object-fit: cover; }
  .phead .pav.clickable { cursor: zoom-in; }
  .phead .pav.clickable:hover { box-shadow: 0 0 0 2px var(--accent); }
  .phead .pmeta { flex: 1; min-width: 0; }
  .phead .prow1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .phead .puser { font-size: 17px; font-weight: 700; }
  .phead .pverif { color: var(--accent); }
  .phead .pbadge { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
  .phead .pname { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .phead .pbio { font-size: 12px; margin-top: 6px; white-space: pre-wrap; }
  .phead .plink { font-size: 12px; margin-top: 4px; }
  .phead .pstats { display: flex; gap: 16px; margin-top: 10px; font-size: 12px; color: var(--dim); }
  .phead .pstats b { color: var(--text); }
  .phead .pdl { margin-top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .dlbtn { display: inline-flex; align-items: center; gap: 7px; position: relative; overflow: hidden;
    background: var(--accent); color: var(--bg); border: 0; border-radius: 7px; cursor: pointer;
    font: 600 12.5px/1 inherit; padding: 9px 15px; font-variant-numeric: tabular-nums; }
  .dlbtn svg { width: 13px; height: 13px; flex-shrink: 0; position: relative; }
  .dlbtn.ghost2 { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
  .dlbtn.st-run { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); min-width: 132px; }
  .dlbtn.st-done { background: transparent; color: var(--dim); border: 1px solid var(--line); font-weight: 500; }
  .dlbtn .fill { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(79,208,138,.18); }
  .pdl .dldone { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--good); font-weight: 600; margin-left: auto; }
  .pdl .dldone svg { width: 13px; height: 13px; }

  .pfilt { display: inline-flex; gap: 5px; margin-left: auto; }
  .pfilt[hidden] { display: none; }
  .pfc { font: 500 10px/1 var(--sans); text-transform: none; letter-spacing: 0; padding: 4px 9px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--dim); cursor: pointer; }
  .pfc:hover { color: var(--text); }
  .pfc.on { border-color: var(--accent); color: var(--text); background: rgba(79,163,216,.12); }
  .pfc.sel-t.on { border-color: var(--good); background: rgba(79,208,138,.14); }

  /* multi-select */
  .selbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 4px;
    padding: 8px 18px; border-bottom: 1px solid var(--line); background: var(--surface-2);
    font-size: 11px; color: var(--dim); position: sticky; top: 0; z-index: 15; }
  .selbar[hidden] { display: none; }
  .selbar.shadow { box-shadow: 0 6px 14px -8px rgba(0,0,0,.55); }
  .selbar b { color: var(--text); font-variant-numeric: tabular-nums; }
  .selbar .sp { flex: 1; }
  .selbar button { font: 600 10.5px/1 inherit; padding: 6px 10px; border-radius: 5px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); cursor: pointer; }
  .selbar button.pri { background: var(--accent); color: var(--bg); border: 0; }
  .selbar button:disabled { opacity: .45; cursor: default; }
  .grid.selmode { user-select: none; -webkit-user-select: none; }
  .grid.selmode .cell { cursor: pointer; }
  .grid.selmode img { -webkit-user-drag: none; }
  .grid.selmode .cell .grab { display: none !important; }
  .grid.selmode .cell.sel { outline: 2px solid var(--good); outline-offset: -2px; }
  .grid.selmode .cell.sel::before { content: "✓"; position: absolute; z-index: 4; right: 3px; top: 3px;
    width: 15px; height: 15px; border-radius: 50%; background: var(--good); color: #06301c;
    font-size: 10px; font-weight: 900; display: grid; place-items: center; }
  .grid.selmode .cell.cur { box-shadow: inset 0 0 0 2px var(--accent); }
  .marquee { position: absolute; z-index: 20; border: 1px solid var(--accent);
    background: rgba(79,163,216,.14); pointer-events: none; }

  .cell .grab { position: absolute; right: 4px; bottom: 4px; z-index: 3; width: 18px; height: 18px; padding: 0;
    border-radius: 5px; border: 0; background: rgba(0,0,0,.6); color: #fff; display: none;
    place-items: center; cursor: pointer; }
  .cell .grab svg { width: 11px; height: 11px; display: block; }
  .cell:hover .grab { display: grid; }
  .cell[hidden] { display: none; }

  .cell .cst { position: absolute; left: 4px; top: 4px; width: 15px; height: 15px; border-radius: 50%;
    display: grid; place-items: center; box-shadow: 0 0 0 2px rgba(0,0,0,.3); z-index: 2; }
  .cell .cst svg { width: 9px; height: 9px; }
  .cst.done { background: var(--good); color: #06301c; }
  .cst.failed { background: var(--bad); color: #3a0f0d; cursor: pointer; }
  .cst.partial { background: var(--warn); color: #3a2504; cursor: pointer; }
  .cst.ring { background: conic-gradient(var(--warn) var(--p,40%), rgba(255,255,255,.16) 0); }
  .cst.ring::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--surface-2); }
  .cell.qd::after { content: ""; position: absolute; inset: 0; z-index: 1;
    background: repeating-linear-gradient(-45deg, transparent 0 6px, rgba(255,255,255,.035) 6px 12px); }
  .btn2.ok { background: transparent; border: 1px solid #2f6f4f; color: var(--good); cursor: default; }

  .sec { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); padding: 12px 18px 5px;
    display: flex; align-items: center; gap: 10px; }
  .sec .sdl { color: var(--disc); font-size: 11px; text-transform: none; letter-spacing: 0; cursor: pointer; }
  .sec .sdl:hover { text-decoration: underline; }
  .sec-block[hidden] { display: none; }

  .rings { display: flex; gap: 12px; padding: 4px 18px 10px; flex-wrap: wrap; }
  .ring { width: 62px; text-align: center; cursor: pointer; }
  .ring .rd { width: 62px; height: 62px; border-radius: 50%; background: var(--surface-2); box-sizing: border-box;
    border: 2px solid var(--accent); overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--dim); }
  .ring.seen .rd { border-color: var(--line); }
  .ring .rd img { width: 100%; height: 100%; object-fit: cover; }
  .ring .rl { font-size: 9px; color: var(--dim); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; padding: 3px 18px 14px; position: relative; }
  .cell { position: relative; aspect-ratio: 1; background: var(--surface-2); border-radius: 3px; overflow: hidden; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: var(--dim);
    /* let the engine skip layout+paint for off-screen tiles */
    content-visibility: auto; contain-intrinsic-size: 90px 90px; }
  .cell img { width: 100%; height: 100%; object-fit: cover; }
  .cell.ph { aspect-ratio: auto; height: 0; padding-bottom: 100%; }
  .morewrap { display: flex; justify-content: center; padding: 8px 18px 18px; }
  #posts-more { padding: 8px 18px; }
  #posts-more[hidden] { display: none; }
  .cell .badge { position: absolute; right: 5px; top: 5px; color: #fff; filter: drop-shadow(0 1px 3px rgba(0,0,0,.8)); display: flex; }
  .cell .badge svg { width: 15px; height: 15px; }
  #sentinel { height: 1px; }

  /* shimmer skeleton */
  @keyframes sk-sh { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  .sk { display: block; background: linear-gradient(90deg, rgba(255,255,255,.04) 25%, rgba(255,255,255,.11) 37%, rgba(255,255,255,.04) 63%);
    background-size: 200% 100%; animation: sk-sh 1.3s ease-in-out infinite; border-radius: 4px; }

  /* full-window media overlay */
  #ov { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(8,8,10,.58); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); flex-direction: column; }
  #ov.open { display: flex; }
  .ovbar { display: flex; align-items: center; padding: 12px 16px; color: #d4d4d4; font-size: 12px; }
  .ovbar .ct { flex: 1; }
  #ov.loading .ovbar .ct::after { content: ""; display: inline-block; width: 11px; height: 11px; margin-left: 8px;
    vertical-align: -1px; border: 2px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%;
    animation: ovspin .7s linear infinite; }
  @keyframes ovspin { to { transform: rotate(360deg); } }
  .ovbar .tools { display: flex; gap: 4px; }
  .ovbar .tb { width: 38px; height: 34px; border-radius: 9px; background: rgba(255,255,255,.06); border: 0; color: #d8d8d8;
    display: flex; align-items: center; justify-content: center; }
  .ovbar .tb:hover { background: rgba(255,255,255,.18); color: #fff; }
  .ovbar .tb svg { width: 19px; height: 19px; }
  .ovbar .tb.dl { color: var(--accent); }
  /* caption bar under the toolbar (never over the media) */
  .ovcap { min-height: 30px; padding: 4px 18px 8px; font-size: 12px; color: #d8d8d8; line-height: 1.4; display: flex; align-items: flex-start; gap: 8px; }
  .ovcap .ct2 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; flex: 1; white-space: pre-wrap; }
  .ovcap.exp .ct2 { -webkit-line-clamp: unset; max-height: 30vh; overflow: auto; }
  .ovcap .more { color: var(--disc); cursor: pointer; font-size: 11px; flex-shrink: 0; }
  .ovcap .more[hidden] { display: none; }
  .ovcap .sk { width: 40%; height: 12px; margin-top: 3px; }
  .ovstage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; padding: 4px 54px 0; overflow: hidden; touch-action: none; }
  .ovpicwrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .ovpicwrap > img, .ovpicwrap > video { max-width: 100%; max-height: 100%; border-radius: 2px; object-fit: contain;
    transform-origin: center; }
  .ovpicwrap.zoomed > img { cursor: grab; will-change: transform; }
  .ovpicwrap.dragging > img { cursor: grabbing; }
  .ovpicwrap .sk { position: absolute; width: min(78%, 460px); aspect-ratio: 4 / 5; max-height: 88%; border-radius: 4px; }
  /* story / highlight frames are always vertical 9:16 */
  .ovpicwrap .sk.v916 { width: auto; height: 88%; aspect-ratio: 9 / 16; }
  .ovchev { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%;
    background: rgba(0,0,0,.4); color: #eaeaea; border: 0; display: flex; align-items: center; justify-content: center; }
  .ovchev:hover { background: rgba(0,0,0,.65); color: #fff; }
  .ovchev.l { left: 12px; } .ovchev.r { right: 12px; }
  .ovchev svg { width: 20px; height: 20px; }
  .ovchev[disabled] { opacity: .25; pointer-events: none; }
  .ovpill { position: absolute; right: 60px; bottom: 14px; display: flex; gap: 8px; }
  .btn2 { font-size: 11px; padding: 7px 13px; border-radius: 999px; background: var(--accent); color: #000; font-weight: 600;
    border: 0; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  .btn2.g { background: rgba(18,18,20,.9); border: 1px solid #4a4a4a; color: #e6e6e6; font-weight: 500; }
  .ovgrid-btn { position: absolute; right: 14px; bottom: 62px; width: 32px; height: 30px; border-radius: 8px; border: 0;
    background: rgba(255,255,255,.12); color: #ddd; display: flex; align-items: center; justify-content: center; }
  .ovgrid-btn svg { width: 15px; height: 15px; }

  .ovstripwrap { padding: 8px 0 16px; display: flex; justify-content: center; background: linear-gradient(transparent, rgba(0,0,0,.35)); }
  .ovstrip { display: flex; gap: 6px; padding: 8px 14px; overflow-x: auto; align-items: center; justify-content: safe center;
    max-width: 92%; border-radius: 14px; background: rgba(24,25,28,.62); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.07); box-shadow: 0 8px 28px rgba(0,0,0,.5);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 30px, #000 calc(100% - 30px), transparent);
    scrollbar-width: none; scroll-behavior: smooth; }
  .ovstrip::-webkit-scrollbar { display: none; }
  .ovstrip .s { width: 46px; height: 46px; border-radius: 9px; background: #2f3136; flex-shrink: 0; position: relative;
    overflow: hidden; opacity: .4; transform: scale(.86); transition: opacity .18s ease, transform .18s ease, box-shadow .18s ease; cursor: pointer; }
  .ovstrip .s img { width: 100%; height: 100%; object-fit: cover; }
  .ovstrip .s:hover { opacity: .8; transform: scale(.94); }
  .ovstrip .s.on { opacity: 1; transform: scale(1.12); box-shadow: 0 0 0 2px var(--accent), 0 6px 16px rgba(79,163,216,.35); }
  .ovstrip .s .v { position: absolute; right: 3px; bottom: 3px; width: 14px; height: 14px; border-radius: 5px;
    background: rgba(0,0,0,.6); color: #fff; display: flex; align-items: center; justify-content: center; }
  .ovstrip .s .v svg { width: 9px; height: 9px; }
  /* all-frames grid mode */
  #ov.allmode .ovstripwrap { display: none; }
  #ov.allmode .ovstage { display: none; }
  #ov.allmode .ovpill, #ov.allmode .ovgrid-btn, #ov.allmode .ovchev { display: none; }
  .ovallgrid { display: none; flex: 1; overflow-y: auto; padding: 10px; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 4px; }
  #ov.allmode .ovallgrid { display: grid; }
  .ovallgrid .g { aspect-ratio: 1; background: #2a2c30; border-radius: 4px; overflow: hidden; position: relative; cursor: pointer; }
  .ovallgrid .g img { width: 100%; height: 100%; object-fit: cover; }
  .ovallgrid .g.on { outline: 2px solid var(--accent); outline-offset: -2px; }

  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 16px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 300; }
  #toast.show { opacity: 1; }
  #js-error-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; background: #a33; color: #fff; font: 11px/1.4 monospace; padding: 6px 10px; white-space: pre-wrap; }
</style>
</head>
<body>
  <header>
    <button id="back-btn" class="ghost iconbtn" style="display:none" title="Back" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="htitle" id="head-title" data-i18n="viewer_title">Instagram</span>
    <div class="search-wrap" id="search-wrap">
      <input id="search" type="search" class="hsearch" data-i18n-placeholder="viewer_search" placeholder="Search accounts" autocomplete="off" />
      <button type="button" id="search-clear" class="search-clear" title="Clear" aria-label="Clear" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="search-dd" class="search-dd" hidden></div>
    </div>
    <button id="refresh-btn" class="ghost iconbtn" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <div id="scroll">
    <div id="accounts"></div>
    <div id="profile" style="display:none"></div>
  </div>

  <div id="ov">
    <div class="ovbar">
      <span class="ct" id="ov-ct">1 / 1</span>
      <span class="tools">
        <button class="tb" id="ov-copy" title="Copy media URL"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
        <button class="tb" id="ov-zo" title="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-4.3-4.3"/></svg></button>
        <button class="tb" id="ov-zi" title="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M21 21l-4.3-4.3"/></svg></button>
        <button class="tb" id="ov-slide" title="Slideshow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4V8z" fill="currentColor"/></svg></button>
        <button class="tb" id="ov-fs" title="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
        <button class="tb dl" id="ov-dl" title="Download this frame"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button>
        <button class="tb" id="ov-close" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </span>
    </div>
    <div class="ovcap" id="ov-cap"><div class="ct2" id="ov-cap-txt"></div><span class="more" id="ov-cap-more" hidden></span></div>
    <div class="ovstage">
      <button class="ovchev l" id="ov-prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="ovpicwrap" id="ov-pic"></div>
      <button class="ovchev r" id="ov-next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      <div class="ovpill" id="ov-pill"></div>
      <button class="ovgrid-btn" id="ov-gridbtn" title="All frames"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
    </div>
    <div class="ovallgrid" id="ov-allgrid"></div>
    <div class="ovstripwrap"><div class="ovstrip" id="ov-strip"></div></div>
  </div>

  <div id="toast"></div>

<script src="i18n.js"></script>
<script>
  window.addEventListener("error", e => {
    let bar = document.getElementById("js-error-bar");
    if (!bar) { bar = document.createElement("div"); bar.id = "js-error-bar"; document.body.appendChild(bar); }
    bar.textContent = "JS error: " + (e.message || e.error) + " @ " + (e.filename || "") + ":" + (e.lineno || "");
  });

  const APP = "http://127.0.0.1:8597";
  const L = (k, v) => window.I18N.t(k, v);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // route IG-CDN images through the server (webview gets 403 without a Referer)
  const img = u => (!u ? "" : /cdninstagram\.com|fbcdn\.net/.test(u) ? `${APP}/ig/img?u=${encodeURIComponent(u)}` : u);
  // Instagram's own glyphs
  const IC_CAROUSEL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5h8.5A3.5 3.5 0 0 1 20 7v8.5"/><rect x="3.5" y="8" width="12.5" height="12.5" rx="3"/></svg>`;
  const IC_REEL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="M3 8h18M8.5 3l3 5M15 3l3 5"/><path d="M10.5 10.8v4.4l4-2.2z" fill="currentColor" stroke="none"/></svg>`;

  async function get(p) { try { return await (await fetch(APP + p)).json(); } catch { return null; } }
  async function post(p, b) { try { return await (await fetch(APP + p, { method: "POST", body: JSON.stringify(b) })).json(); } catch { return null; } }

  const FONTS = { system: null, georgia: 'Georgia, serif', "ibm-plex-mono": '"IBM Plex Mono", monospace',
    excalifont: '"Excalifont", cursive', "cascadia-mono": '"Cascadia Mono", monospace' };
  function applyFont(k) { const f = FONTS[k], s = document.documentElement.style; if (f) { s.setProperty("--sans", f); s.setProperty("--mono", f); } else { s.removeProperty("--sans"); s.removeProperty("--mono"); } }

  let toastTimer = null;
  function toast(m) { const el = document.getElementById("toast"); el.textContent = m; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2200); }
  async function queue(url) { const r = await post("/ig/queue", { url }); toast(r && r.queued ? L("viewer_queued") : L("cant_reach")); }
  function fmtNum(n) { n = Number(n) || 0; if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M"; if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K"; return String(n); }

  const accountsEl = document.getElementById("accounts");
  const profileEl = document.getElementById("profile");
  const backBtn = document.getElementById("back-btn");
  const headTitle = document.getElementById("head-title");
  let currentUser = null;
  const avatarCache = new Map();

  // ---- accounts home ----
  let acctQuery = "";
  let lastAcctData = null;

  async function renderAccounts() {
    lastAcctData = await get("/ig/profiles");
    paintAccounts();
  }

  function paintAccounts() {
    const data = lastAcctData;
    accountsEl.innerHTML = "";
    if (!data) { accountsEl.innerHTML = `<div class="empty">${esc(L("cant_reach"))}</div>`; return; }
    const all = data.accounts || [];
    if (data.unresolved) {
      const r = document.createElement("div"); r.className = "resolving";
      r.textContent = L("viewer_resolving", { n: data.unresolved }); accountsEl.appendChild(r);
    }
    if (igIncomplete) accountsEl.insertAdjacentHTML("beforeend", `<div class="empty note" style="padding:10px 16px;text-align:left">${esc(L("viewer_need_login"))}</div>`);
    if (!all.length) { accountsEl.insertAdjacentHTML("beforeend", `<div class="empty">${esc(L("viewer_empty"))}</div>`); return; }
    const q = acctQuery;
    const accts = q ? all.filter(a => (a.username || "").toLowerCase().includes(q)) : all;
    if (!accts.length) { accountsEl.insertAdjacentHTML("beforeend", `<div class="empty">${esc(L("viewer_no_match"))}</div>`); return; }
    const grid = document.createElement("div"); grid.className = "acct-grid";
    const avSlots = new Map();
    for (const a of accts) {
      const card = document.createElement("div"); card.className = "acard";
      // avatar comes from the library (served by /ig/profiles) - no per-card IG hit
      const url = avatarCache.get(a.username) || a.avatar || null;
      if (a.avatar) avatarCache.set(a.username, a.avatar);
      const avInner = url ? `<img src="${esc(img(url))}" alt="" onerror="this.remove()">`
        : `<span>${esc((a.username[0] || "?").toUpperCase())}</span>`;
      card.innerHTML = `<div class="av">${avInner}</div>`
        + `<div class="nm">@${esc(a.username)}</div>`
        + `<div class="sub">${esc(a.caught_count)} ${esc(L("viewer_caught"))} · ${esc((a.kinds || []).join(" · "))}</div>`;
      card.addEventListener("click", () => openProfile(a.username));
      grid.appendChild(card);
      if (!url) avSlots.set(a.username, card.querySelector(".av"));
    }
    accountsEl.appendChild(grid);
    warmAvatars(avSlots);
  }

  // scroll shadow for the sticky selection bar
  document.getElementById("scroll").addEventListener("scroll", e => {
    const bar = document.getElementById("selbar");
    if (bar) bar.classList.toggle("shadow", e.target.scrollTop > 2);
  });

  // ---- header search: local filter + remote username lookup ----
  const searchDd = document.getElementById("search-dd");
  let lookupTimer = null, lookupAbort = null;

  function hideSearchDd() { searchDd.hidden = true; searchDd.innerHTML = ""; }

  function scheduleLookup(raw) {
    clearTimeout(lookupTimer);
    const q = raw.trim().replace(/^@/, "");
    if (!q || currentUser) { hideSearchDd(); return; }
    lookupTimer = setTimeout(() => runLookup(q), 400);
  }

  async function runLookup(q) {
    if (lookupAbort) lookupAbort.abort();
    const ctl = new AbortController(); lookupAbort = ctl;
    let p = null;
    try {
      p = await (await fetch(APP + "/ig/profile", {
        method: "POST", body: JSON.stringify({ username: q }), signal: ctl.signal,
      })).json();
    } catch (_) { return; }
    const still = document.getElementById("search").value.trim().replace(/^@/, "");
    if (still !== q) return; // input changed while we were waiting
    const h = p && p.header;
    if (!h || !h.username || p.cookie === false) { hideSearchDd(); return; }
    paintSearchDd(h);
  }

  function paintSearchDd(h) {
    const avInner = h.profile_pic_url ? `<img src="${esc(img(h.profile_pic_url))}" alt="">` : esc((h.username[0] || "?").toUpperCase());
    searchDd.innerHTML = `<div class="grp-label">${esc(L("viewer_found_ig"))}</div>`
      + `<div class="row" id="dd-remote" data-username="${esc(h.username)}">`
      +   `<div class="av">${avInner}</div>`
      +   `<div class="nm">@${esc(h.username)}<div class="sub">${esc(fmtNum(h.follower_count || 0))} ${esc(L("viewer_followers"))}</div></div>`
      + `</div>`;
    searchDd.hidden = false;
    searchDd.querySelector("#dd-remote").addEventListener("click", () => openFromSearchDd(h.username));
  }

  // opening a profile found this way calls POST /ig/profile in openProfile's
  // enrich step, which is enough for the backend to add the account to the
  // library - no separate "add" step needed here.
  function openFromSearchDd(username) {
    hideSearchDd();
    const se = document.getElementById("search");
    se.value = ""; acctQuery = "";
    document.getElementById("search-clear").hidden = true;
    openProfile(username);
  }

  {
    const se = document.getElementById("search");
    const clearBtn = document.getElementById("search-clear");
    const syncClearBtn = () => { clearBtn.hidden = !se.value; };
    se.addEventListener("input", () => {
      acctQuery = se.value.trim().toLowerCase(); paintAccounts();
      scheduleLookup(se.value);
      syncClearBtn();
    });
    clearBtn.addEventListener("click", () => {
      se.value = ""; acctQuery = ""; paintAccounts();
      clearTimeout(lookupTimer); hideSearchDd(); syncClearBtn();
      se.focus();
    });
    se.addEventListener("blur", () => setTimeout(hideSearchDd, 150));
    se.addEventListener("keydown", async e => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      const already = document.getElementById("dd-remote");
      if (already) { openFromSearchDd(already.dataset.username || se.value.trim().replace(/^@/, "")); return; }
      const q = se.value.trim().replace(/^@/, "");
      if (!q) return;
      clearTimeout(lookupTimer);
      await runLookup(q);
      document.getElementById("dd-remote")?.click();
    });
  }
  // Fetch missing avatars ONE AT A TIME with a gap - IG's web_profile_info is
  // heavily throttled, a burst of parallel calls trips a 10-min 429 backoff.
  let warming = false;
  async function warmAvatars(slots) {
    if (warming || !slots.size) return;
    warming = true;
    try {
      for (const [username, into] of slots) {
        if (currentUser) break;                         // left the accounts screen
        if (avatarCache.get(username)) { paintAvatar(into, username, avatarCache.get(username)); continue; }
        const p = await post("/ig/profile", { username });
        const u = (p && p.header && p.header.profile_pic_url) || null;
        if (u) avatarCache.set(username, u);
        paintAvatar(into, username, u);
        if (p && p.cookie === false && !igIncomplete) { igIncomplete = true; renderAccounts(); }
        await new Promise(r => setTimeout(r, 900));
      }
    } finally { warming = false; }
  }
  function paintAvatar(into, username, url) {
    if (!into) return;
    into.innerHTML = url
      ? `<img src="${esc(img(url))}" alt="" loading="lazy" onerror="this.remove()">`
      : `<span>${esc((username[0] || "?").toUpperCase())}</span>`;
  }
  let igIncomplete = false;

  // ---- profile detail ----
  let postsCursor = null, postsLoading = false, postsDone = false, postsErr = false, postsObserver = null;

  async function openProfile(username) {
    currentUser = username;
    accountsEl.style.display = "none"; profileEl.style.display = "block";
    backBtn.style.display = "flex"; headTitle.textContent = "@" + username;
    document.getElementById("search-wrap").style.display = "none";
    document.getElementById("scroll").scrollTop = 0;
    postsCursor = null; postsLoading = false; postsDone = false; postsErr = false;
    archState = null; clearTimeout(archTimer);
    localShown = new Set();
    tileMarks = {}; lastDoneKey = "";
    if (postsObserver) { postsObserver.disconnect(); postsObserver = null; }

    // fixed section order via placeholders + first-load skeletons
    profileEl.innerHTML = `<div id="p-head" class="phead">`
      +   `<div class="pav"><span class="sk" style="width:100%;height:100%;border-radius:50%"></span></div>`
      +   `<div class="pmeta">`
      +     `<span class="sk" style="width:140px;height:16px"></span>`
      +     `<span class="sk" style="width:90px;height:11px;margin-top:8px"></span>`
      +     `<span class="sk" style="width:220px;height:11px;margin-top:8px"></span>`
      +     `<span class="sk" style="width:180px;height:11px;margin-top:12px"></span>`
      +   `</div></div>`
      + `<div id="p-story" class="sec-block" hidden></div>`
      + `<div id="p-hl" class="sec-block" hidden></div>`
      + `<div id="p-posts"><div class="sec"><span>${esc(L("viewer_posts"))}</span>`
      +   `<span class="pfilt" id="pfilt" hidden>`
      +     `<button class="pfc on" data-f="all">${esc(L("archv_f_all"))}</button>`
      +     `<button class="pfc" data-f="disk">${esc(L("archv_f_disk"))}</button>`
      +     `<button class="pfc" data-f="missing">${esc(L("archv_f_missing"))}</button>`
      +     `<button class="pfc sel-t" id="seltoggle">${esc(L("archv_select"))}</button>`
      +   `</span></div>`
      +   `<div id="selbar" class="selbar" hidden></div>`
      +   `<div id="posts-grid" class="grid" style="padding:3px 18px 14px">`
      +   Array.from({ length: 9 }, () => `<div class="cell ph sk"></div>`).join("")
      +   `</div><div class="morewrap"><button id="posts-more" class="ghost" hidden></button></div></div>`;

    const stat = (n, lbl) => `<span><b>${fmtNum(n)}</b> ${esc(lbl)}</span>`;
    const hd = document.getElementById("p-head");

    // Paint what we can with ZERO network first: a bare header + the on-disk
    // grid. The live /ig/profile call only enriches this; it never blocks or
    // replaces it (IG rate-limits web_profile_info hard).
    function paintHeader(h, opts) {
      opts = opts || {};
      hd.className = "phead";
      hd.innerHTML = `<div class="pav"><span>${esc((username[0] || "?").toUpperCase())}</span></div>`
        + `<div class="pmeta"><div class="prow1"><span class="puser">@${esc(h.username || username)}</span>`
        +   (h.is_verified ? `<span class="pverif" title="verified">✔</span>` : "")
        +   (h.is_private ? `<span class="pbadge">${esc(L("viewer_private"))}</span>` : "") + `</div>`
        +   (h.full_name ? `<div class="pname">${esc(h.full_name)}</div>` : "")
        +   (h.biography ? `<div class="pbio">${esc(h.biography)}</div>` : "")
        +   (h.external_url ? `<div class="plink"><a href="#" id="p-ext">${esc(h.external_url)}</a></div>` : "")
        +   (h.complete ? `<div class="pstats">${stat(h.post_count, L("viewer_posts_n"))}${stat(h.follower_count, L("viewer_followers"))}${stat(h.following_count, L("viewer_following"))}</div>` : "")
        +   `<div class="pdl" id="pdl"></div></div>`;
      if (h.profile_pic_url) {
        avatarCache.set(username, h.profile_pic_url);
        const pav = hd.querySelector(".pav");
        pav.innerHTML = `<img src="${esc(img(h.profile_pic_url))}" alt="">`;
        pav.classList.add("clickable");
        pav.addEventListener("click", () => {
          openOverlay([{ media_url: h.profile_pic_url, thumb_url: h.profile_pic_url, is_video: false }],
            `https://www.instagram.com/${username}/`, h.full_name || "@" + username, "@" + username);
        });
      } else if (avatarCache.get(username)) {
        const pav = hd.querySelector(".pav");
        pav.innerHTML = `<img src="${esc(img(avatarCache.get(username)))}" alt="">`;
      }
      const ext = hd.querySelector("#p-ext");
      if (ext) ext.addEventListener("click", e => { e.preventDefault(); try { window.__TAURI__.core.invoke("open_external_url", { url: h.external_url }); } catch (_) {} });
      document.getElementById("p-note")?.remove();
      const note = opts.offline ? L("viewer_offline_disk_only")
        : opts.needLogin ? L("viewer_need_login")
        : opts.rateLimited ? L("viewer_rate_limited") : null;
      if (note) hd.insertAdjacentHTML("afterend", `<div class="empty note" id="p-note" style="padding:8px 18px">${esc(note)}</div>`);
      paintArch(username);
    }

    paintHeader({ username });
    refreshArch(username);

    // posts UI + on-disk grid — no /ig/profile dependency
    document.getElementById("posts-more").addEventListener("click", () => loadMorePosts(username));
    document.getElementById("pfilt").addEventListener("click", e => {
      const b = e.target.closest(".pfc"); if (!b) return;
      if (b.id === "seltoggle") { toggleSelMode(username); return; }
      pfilt = b.dataset.f;
      document.querySelectorAll("#pfilt .pfc[data-f]").forEach(x => x.classList.toggle("on", x === b));
      applyPfilt();
    });
    initSelDrag(username);
    loadDownloadedPosts(username).finally(() => loadMorePosts(username));

    // enrich with the live profile in the background
    post("/ig/profile", { username }).then(p => {
      if (username !== currentUser) return;
      if (!p) { paintHeader({ username }, { offline: true }); return; }
      const h = p.header || { username };
      paintHeader(h, { needLogin: p.cookie === false, rateLimited: p.cookie !== false && !h.complete });
    });

    // story - stays hidden until /ig/story confirms an active story
    {
      const box = document.getElementById("p-story");
      box.hidden = true;
      box.innerHTML = `<div class="sec"><span>${esc(L("viewer_story"))}</span><span class="sdl" id="dl-story">${esc(L("viewer_dl_story"))}</span></div><div class="rings" id="story-rings"></div>`;
      box.querySelector("#dl-story").addEventListener("click", () => queue(`https://www.instagram.com/stories/${username}/`));
      post("/ig/story", { username }).then(r => {
        if (username !== currentUser) return;
        const items = (r && r.items) || [];
        if (!items.length) return;
        box.hidden = false;
        fillRings(box.querySelector("#story-rings"), items, () =>
          openOverlay(items, `https://www.instagram.com/stories/${username}/`, "", L("viewer_story"), true));
      });
    }

    // highlights
    post("/ig/highlights", { username }).then(r => {
      const hls = (r && r.highlights) || [];
      if (!hls.length || username !== currentUser) return;
      const box = document.getElementById("p-hl");
      box.hidden = false;
      box.innerHTML = `<div class="sec"><span>${esc(L("viewer_highlights"))}</span></div><div class="rings" id="hl-rings"></div>`;
      const wrap = box.querySelector("#hl-rings");
      for (const hl of hls) {
        const ring = document.createElement("div"); ring.className = "ring seen";
        ring.innerHTML = `<div class="rd">${hl.cover_url ? `<img src="${esc(img(hl.cover_url))}" alt="">` : ""}</div><div class="rl">${esc(hl.title || "•")}</div>`;
        ring.addEventListener("click", async () => {
          const hr = await post("/ig/highlight", { id: hl.id });
          const items = (hr && hr.items) || [];
          if (!items.length) { toast(L("cant_reach")); return; }
          openOverlay(items, `https://www.instagram.com/stories/highlights/${hl.id}/`, hl.title || "", L("viewer_highlights"), true);
        });
        wrap.appendChild(ring);
      }
    });

  }

  let localShown = new Set();
  let dlMap = {};            // shortcode -> { files:[...], is_video }
  let pfilt = "all";

  const IC_GRAB = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>';

  // one grid cell, with a hover "grab this post" button
  function mkCell(username, sc, thumbHtml, badgeHtml, onOpen) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.dataset.sc = sc;
    cell.innerHTML = thumbHtml + badgeHtml
      + `<button class="grab" title="${esc(L("archv_grab"))}">${IC_GRAB}</button>`;
    cell.querySelector(".grab").addEventListener("click", e => { e.stopPropagation(); grabPost(username, sc); });
    cell.addEventListener("click", e => {
      if (selMode) { e.preventDefault(); e.stopPropagation(); toggleSel(cell, e.shiftKey); return; }
      onOpen(e);
    });
    return cell;
  }

  async function loadDownloadedPosts(username) {
    const d = await get("/ig/downloaded?username=" + encodeURIComponent(username));
    if (username !== currentUser || !d || !(d.posts || []).length) return;
    const grid = document.getElementById("posts-grid");
    if (!grid) return;
    if (!grid.dataset.filled) { grid.innerHTML = ""; grid.dataset.filled = "1"; }
    for (const pm of d.posts) {
      localShown.add(pm.shortcode);
      dlMap[pm.shortcode] = { files: pm.files || [], is_video: pm.is_video };
      const src = pm.thumb ? `${APP}/ig/file?path=${encodeURIComponent(pm.thumb)}` : null;
      const thumb = src ? `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">` : `<span>${IC_REEL}</span>`;
      const badge = pm.is_video ? `<span class="badge">${IC_REEL}</span>`
        : (pm.files || []).length > 1 ? `<span class="badge">${IC_CAROUSEL}</span>` : "";
      grid.appendChild(mkCell(username, pm.shortcode, thumb, badge, () => openLocalPost(username, pm)));
    }
    document.getElementById("pfilt").hidden = false;
    paintArch(username);
    applyPfilt();
  }

  function openLocalPost(username, pm) {
    const frames = (pm.files || []).map(f => {
      const u = `${APP}/ig/file?path=${encodeURIComponent(f)}`;
      return { media_url: u, thumb_url: u, is_video: /\.(mp4|m4v|webm|mov|mkv)$/i.test(f) };
    });
    if (frames.length) openOverlay(frames, pm.url || "", "", L("viewer_posts"), false,
      { shortcode: pm.shortcode, downloaded: true, files: pm.files || [] });
  }

  function applyPfilt() {
    const s = archState || {};
    const done = new Set(s.done || []);
    document.querySelectorAll("#posts-grid .cell[data-sc]").forEach(c => {
      const on = pfilt === "all"
        || (pfilt === "disk" && done.has(c.dataset.sc))
        || (pfilt === "missing" && !done.has(c.dataset.sc));
      c.hidden = !on;
    });
  }

  function updateMoreBtn() {
    const b = document.getElementById("posts-more");
    if (!b) return;
    b.disabled = postsLoading;
    b.textContent = postsLoading ? "…" : postsErr ? L("viewer_retry") : L("viewer_load_more");
    b.hidden = postsLoading ? false : (postsDone && !postsErr);
  }

  function fillRings(wrap, items, onClick) {
    wrap.innerHTML = "";
    items.forEach((it, i) => {
      const ring = document.createElement("div"); ring.className = "ring";
      ring.innerHTML = `<div class="rd">${it.thumb_url ? `<img src="${esc(img(it.thumb_url))}" alt="">` : ""}</div><div class="rl">${it.is_video ? "▶" : ""} ${i + 1}</div>`;
      ring.addEventListener("click", () => onClick(i));
      wrap.appendChild(ring);
    });
  }

  async function loadMorePosts(username) {
    if (postsLoading || postsDone || username !== currentUser) return;
    postsLoading = true; postsErr = false; updateMoreBtn();
    const grid = document.getElementById("posts-grid");
    if (!grid) { postsLoading = false; return; }
    if (!grid.dataset.filled) { grid.innerHTML = ""; grid.dataset.filled = "1"; }

    // One click should yield visible posts even when a whole page is already
    // on disk (dedup-skipped) — keep pulling pages until something new lands
    // or we run out. Capped so a click never walks the whole profile.
    let addedNew = 0;
    for (let hop = 0; hop < 2 && !postsDone; hop++) {
      let r = null;
      try {
        const ctl = new AbortController();
        const to = setTimeout(() => ctl.abort(), 45000);
        r = await (await fetch(APP + "/ig/posts", {
          method: "POST", body: JSON.stringify({ username, after: postsCursor || undefined }), signal: ctl.signal,
        })).json();
        clearTimeout(to);
      } catch (_) { r = { error: L("viewer_rate_limited") }; }
      if (username !== currentUser) { postsLoading = false; return; }
      if (!r || r.error) { postsErr = true; break; }

      for (const pm of (r.posts || [])) {
        if (localShown.has(pm.shortcode)) continue;
        localShown.add(pm.shortcode);
        addedNew++;
        const thumb = pm.thumb_url ? `<img src="${esc(img(pm.thumb_url))}" alt="" loading="lazy">` : "";
        const badge = pm.is_video ? `<span class="badge">${IC_REEL}</span>`
          : pm.is_carousel ? `<span class="badge">${IC_CAROUSEL}</span>` : "";
        grid.appendChild(mkCell(username, pm.shortcode, thumb, badge, () => openPost(pm)));
      }
      postsCursor = r.next || null;
      if (!postsCursor) postsDone = true;
      if (addedNew > 0) break;
    }

    postsLoading = false;
    document.getElementById("pfilt").hidden = !grid.querySelector(".cell[data-sc]");
    if (postsDone && !postsErr && !grid.querySelector(".cell[data-sc]") && !grid.dataset.noposts) {
      grid.dataset.noposts = "1";
      grid.insertAdjacentHTML("afterend", `<div class="empty note" style="padding:10px 18px">${esc(L("viewer_no_posts"))}</div>`);
    }
    if (postsErr && !grid.dataset.errnote) {
      grid.dataset.errnote = "1";
      grid.insertAdjacentHTML("afterend", `<div class="empty note" id="posts-errnote" style="padding:10px 18px">${esc(L("viewer_rate_limited"))}</div>`);
    } else if (!postsErr) {
      document.getElementById("posts-errnote")?.remove();
      delete grid.dataset.errnote;
    }
    paintArch(username);
    applyPfilt();
    updateMoreBtn();
  }

  // ---- profile archive ----
  let archState = null, archTimer = null;

  async function archiveAction(username, action) {
    // optimistic: flip the button now, and clear the stale entry lists that
    // paintArch used to (mis)read, so the change shows before the POST returns.
    archState = archState || {};
    if (action === "all" || action === "recent" || action === "resume") {
      archState.job = { state: "running", total: (archState.job && archState.job.total) || 0 };
      archState.paused = [];
    } else if (action === "stop") {
      if (archState.job) archState.job.state = "paused";
      archState.active = [];
    } else if (action === "discard") {
      archState.job = null;
      archState.active = []; archState.paused = []; archState.failed = []; archState.partial = [];
    }
    paintButton(username);
    await post("/ig/archive", { username, action });
    for (let i = 0; i < 4; i++) {
      await new Promise(r => setTimeout(r, 700));
      if (username !== currentUser) return;
      await refreshArch(username);
    }
  }
  async function grabPost(username, sc) {
    await post("/ig/archive", { username, action: "post", shortcode: sc });
    setTimeout(() => refreshArch(username), 500);
  }
  async function refreshArch(username) {
    if (username !== currentUser) return;
    clearTimeout(archTimer);
    const s = await get("/ig/archive-state?username=" + encodeURIComponent(username));
    if (!s || username !== currentUser) return;
    archState = s;
    paintArch(username);
    const busy = (s.job && s.job.state === "running")
      || (s.active || []).length > 0 || (s.partial || []).length > 0;
    if (busy) archTimer = setTimeout(() => refreshArch(username), 4000);
  }

  const IC_CHK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
  const IC_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  const IC_DL2 = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>';
  const IC_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
  const IC_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';

  // sc -> currently-rendered mark ("done"|"failed"|"ring"|"partial"|"") so a
  // poll only touches the handful of tiles whose state actually changed.
  let tileMarks = {};
  let lastDoneKey = "";

  function markOf(s, sc) {
    if ((s.done || []).includes(sc)) return "done";
    if ((s.partial || []).includes(sc)) return "partial";
    if ((s.failed || []).includes(sc)) return "failed";
    if ((s.active || []).includes(sc)) return "ring";
    return "";
  }

  function paintTile(cell, username, mark) {
    const sc = cell.dataset.sc;
    cell.querySelector(".cst")?.remove();
    cell.classList.toggle("qd", mark === "ring");
    if (!mark) { tileMarks[sc] = ""; return; }
    const ic = mark === "done" ? IC_CHK : mark === "failed" ? IC_X : mark === "partial" ? IC_X : "";
    cell.insertAdjacentHTML("beforeend",
      `<span class="cst ${mark}"${mark === "ring" ? ' style="--p:40%"' : ""}>${ic}</span>`);
    if (mark === "failed" || mark === "partial") {
      cell.querySelector(".cst").addEventListener("click", e => { e.stopPropagation(); grabPost(username, sc); });
    }
    tileMarks[sc] = mark;
  }

  function paintTiles(username) {
    if (username !== currentUser) return;
    const s = archState || {};
    document.querySelectorAll("#posts-grid .cell[data-sc]").forEach(cell => {
      const sc = cell.dataset.sc;
      const want = markOf(s, sc);
      if (tileMarks[sc] !== want) paintTile(cell, username, want);
    });
    // re-apply the filter only when the on-disk set actually shifted
    const dk = (s.done || []).join(",");
    if (dk !== lastDoneKey) { lastDoneKey = dk; applyPfilt(); }
  }

  function paintButton(username) {
    if (username !== currentUser) return;
    const s = archState || {};
    const pdl = document.getElementById("pdl");
    if (pdl && !selMode) {
      const j = s.job;
      const dn = (s.done || []).length;
      // Button state follows the JOB only — never the stray entry lists — so a
      // pause flips it instantly and a discard clears it cleanly.
      const st = j ? j.state : null;
      const total = (j && j.total) || null;
      const fill = total ? Math.min(100, Math.round(100 * dn / total)) : 0;
      pdl.className = "pdl";
      const frac = dn + " / " + (total || "…");
      if (st === "running") {
        pdl.innerHTML = `<button class="dlbtn st-run" id="dl-pause"><span class="fill" style="width:${fill}%"></span>${IC_PAUSE}${esc(L("archv_pause"))} ${frac}</button>`;
        pdl.querySelector("#dl-pause").onclick = () => archiveAction(username, "stop");
      } else if (st === "paused") {
        pdl.innerHTML = `<button class="dlbtn st-run" id="dl-resume"><span class="fill" style="width:${fill}%"></span>${IC_PLAY}${esc(L("archv_resume"))} ${frac}</button>`
          + `<button class="dlbtn ghost2" id="dl-cancel">${esc(L("archv_discard"))}</button>`;
        pdl.querySelector("#dl-resume").onclick = () => archiveAction(username, "resume");
        pdl.querySelector("#dl-cancel").onclick = () => archiveAction(username, "discard");
      } else {
        // Idle / done. "Newest 24" only queues posts not already on disk, so it
        // doubles as "check for new". No auto "download all".
        pdl.innerHTML = `<button class="dlbtn" id="dl-recent">${IC_DL2}${esc(L("archv_recent"))}</button>`
          + `<button class="dlbtn ghost2" id="dl-all">${IC_DL2}${esc(L("archv_everything"))}</button>`
          + (dn ? `<span class="dldone">${IC_CHK}${dn} ${esc(L("archv_on_disk"))}</span>` : "");
        pdl.querySelector("#dl-recent").onclick = () => archiveAction(username, "recent");
        pdl.querySelector("#dl-all").onclick = () => archiveAction(username, "all");
      }
    }
    if (selMode) updateSelBar();
  }

  function paintArch(username) {
    paintButton(username);
    paintTiles(username);
  }

  // ---- multi-select ----
  let selMode = false, selSet = new Set(), selCur = null, selUser = null;

  function visCells() {
    return [...document.querySelectorAll("#posts-grid .cell[data-sc]")].filter(c => !c.hidden);
  }
  function toggleSelMode(username) {
    selMode = !selMode;
    selUser = username;
    const grid = document.getElementById("posts-grid");
    grid.classList.toggle("selmode", selMode);
    document.getElementById("seltoggle").classList.toggle("on", selMode);
    document.getElementById("selbar").hidden = !selMode;
    if (!selMode) {
      selSet.clear(); selCur = null;
      grid.querySelectorAll(".cell.sel,.cell.cur").forEach(c => c.classList.remove("sel", "cur"));
      document.removeEventListener("keydown", selKeydown);
      paintArch(username);
    } else {
      document.addEventListener("keydown", selKeydown);
      updateSelBar();
    }
  }
  function toggleSel(cell, range) {
    const cells = visCells();
    if (range && selCur) {
      const a = cells.indexOf(selCur), b = cells.indexOf(cell);
      if (a >= 0 && b >= 0) for (let i = Math.min(a, b); i <= Math.max(a, b); i++) {
        cells[i].classList.add("sel"); selSet.add(cells[i].dataset.sc);
      }
    } else {
      const on = cell.classList.toggle("sel");
      if (on) selSet.add(cell.dataset.sc); else selSet.delete(cell.dataset.sc);
    }
    setCur(cell);
    updateSelBar();
  }
  function setCur(cell) {
    document.querySelectorAll("#posts-grid .cell.cur").forEach(c => c.classList.remove("cur"));
    selCur = cell;
    if (cell) cell.classList.add("cur");
  }
  function selKeydown(e) {
    if (!selMode) return;
    if (e.key === "Escape") { toggleSelMode(selUser); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "a") { e.preventDefault(); selectAll(); return; }
    if (e.key === "Enter") { e.preventDefault(); downloadSelected(); return; }
    const cells = visCells();
    if (!cells.length) return;
    const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -12, ArrowDown: 12 }[e.key];
    if (step === undefined) {
      if (e.key === " " && selCur) { e.preventDefault(); toggleSel(selCur, false); }
      return;
    }
    e.preventDefault();
    let i = selCur ? cells.indexOf(selCur) : 0;
    i = Math.max(0, Math.min(cells.length - 1, (i < 0 ? 0 : i) + step));
    const next = cells[i];
    setCur(next);
    next.scrollIntoView({ block: "nearest" });
    if (e.shiftKey) { next.classList.add("sel"); selSet.add(next.dataset.sc); updateSelBar(); }
  }
  function selectAll() {
    visCells().forEach(c => { c.classList.add("sel"); selSet.add(c.dataset.sc); });
    updateSelBar();
  }
  function clearSel() {
    document.querySelectorAll("#posts-grid .cell.sel").forEach(c => c.classList.remove("sel"));
    selSet.clear(); updateSelBar();
  }
  function updateSelBar() {
    const bar = document.getElementById("selbar");
    if (!bar) return;
    const n = selSet.size;
    bar.innerHTML = `<b>${n}</b> ${esc(L("archv_selected"))}<span class="sp"></span>`
      + `<button id="sel-all">${esc(L("archv_select_all"))}</button>`
      + `<button id="sel-clear"${n ? "" : " disabled"}>${esc(L("archv_clear"))}</button>`
      + `<button class="pri" id="sel-dl"${n ? "" : " disabled"}>${esc(L("archv_dl_selected"))}</button>`;
    bar.querySelector("#sel-all").onclick = selectAll;
    bar.querySelector("#sel-clear").onclick = clearSel;
    bar.querySelector("#sel-dl").onclick = downloadSelected;
  }
  async function downloadSelected() {
    if (!selSet.size) return;
    const scs = [...selSet], u = selUser;
    toggleSelMode(u);
    for (const sc of scs) await post("/ig/archive", { username: u, action: "post", shortcode: sc });
    setTimeout(() => refreshArch(u), 400);
  }

  // marquee rubber-band select
  function initSelDrag() {
    const grid = document.getElementById("posts-grid");
    let box = null, start = null, moved = false;
    grid.addEventListener("mousedown", e => {
      if (!selMode || e.button !== 0) return;
      start = { x: e.clientX, y: e.clientY };
      moved = false;
      e.preventDefault();
    });
    window.addEventListener("mousemove", e => {
      if (!start) return;
      if (!moved && Math.abs(e.clientX - start.x) + Math.abs(e.clientY - start.y) < 5) return;
      if (!moved) {
        moved = true;
        box = document.createElement("div");
        box.className = "marquee";
        box._gr = grid.getBoundingClientRect();
        grid.appendChild(box);
      }
      const gr = box._gr;
      const x1 = Math.min(start.x, e.clientX), y1 = Math.min(start.y, e.clientY);
      const x2 = Math.max(start.x, e.clientX), y2 = Math.max(start.y, e.clientY);
      box.style.left = (x1 - gr.left) + "px";
      box.style.top = (y1 - gr.top) + "px";
      box.style.width = (x2 - x1) + "px";
      box.style.height = (y2 - y1) + "px";
      visCells().forEach(c => {
        const r = c.getBoundingClientRect();
        const hit = r.left < x2 && r.right > x1 && r.top < y2 && r.bottom > y1;
        c.classList.toggle("sel", hit || selSet.has(c.dataset.sc));
      });
    });
    window.addEventListener("mouseup", () => {
      if (box) {
        visCells().forEach(c => { if (c.classList.contains("sel")) selSet.add(c.dataset.sc); });
        box.remove(); updateSelBar();
      }
      box = null; start = null;
    });
    // swallow the click that ends a real drag so it doesn't toggle a cell
    grid.addEventListener("click", e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  }


  async function openPost(pm) {
    const src = `https://www.instagram.com/p/${pm.shortcode}/`;
    // open immediately: real grid thumbnail as frame 0 (already cached by the
    // browser) + skeleton placeholders for the rest of a carousel, so the strip
    // shows the true item count right away. Frames upgrade in place - no reload.
    const token = ++ovPending;
    const n = pm.is_carousel ? (pm.carousel_count >= 1 ? pm.carousel_count : 2) : 1;
    const provisional = [{ media_url: pm.thumb_url, thumb_url: pm.thumb_url, is_video: false }];
    for (let i = 1; i < n; i++) provisional.push({ ph: true });
    openOverlay(provisional, src, pm.caption || "", L("viewer_posts"), false, { shortcode: pm.shortcode });
    ov.classList.add("loading");
    const r = await post("/ig/post", { id: pm.shortcode });
    if (token !== ovPending || !ov.classList.contains("open")) return;
    ov.classList.remove("loading");
    if (!r || r.error || !(r.items || []).length) {
      if (pm.is_carousel || pm.is_video) { closeOverlay(); toast((r && r.error) || L("cant_reach")); }
      else { ovFrames = ovFrames.slice(0, 1); buildStrip(); buildAllGrid(); showFrame(0); }
      return;
    }
    upgradeFrames(r.items, r.caption || pm.caption || "");
  }

  // ---- full-window media overlay ----
  const ov = document.getElementById("ov");
  let ovFrames = [], ovIdx = 0, ovSource = "", ovCaption = "", ovZoom = 1, ovSlideTimer = null, ovVertical = false, ovOpts = {};
  let ovPan = { x: 0, y: 0 }, ovDrag = null, ovPending = 0;

  const mapFrame = f => f.ph
    ? { ph: true, media_url: "", thumb_url: "", is_video: false }
    : { media_url: f.media_url || f.thumb_url, thumb_url: f.thumb_url || f.media_url, is_video: !!f.is_video };

  function openOverlay(frames, sourceUrl, caption, title, vertical, opts) {
    ovFrames = (frames || []).filter(f => f && (f.ph || f.media_url || f.thumb_url)).map(mapFrame);
    if (!ovFrames.length) { toast(L("cant_reach")); return; }
    ovVertical = !!vertical;
    ovOpts = opts || {};
    ovSource = sourceUrl; ovCaption = caption || ""; ovIdx = 0; ovZoom = 1;
    ov.classList.remove("allmode");
    ov.classList.add("open");
    renderCaption();
    buildStrip(); buildAllGrid(); showFrame(0);
    warmFrames();
  }
  function warmFrames() {
    if (ovFrames.length > 12) return;
    for (const f of ovFrames) if (!f.ph && !f.is_video && f.media_url) { const p = new Image(); p.src = img(f.media_url); }
  }
  // replace provisional frames with the real ones without reloading what's on screen
  function upgradeFrames(items, caption) {
    const real = (items || []).filter(f => f && (f.media_url || f.thumb_url)).map(mapFrame);
    if (!real.length) return;
    const cur = ovFrames[ovIdx] || {};
    ovFrames = real;
    if (ovIdx >= real.length) ovIdx = real.length - 1;
    if (caption && caption !== ovCaption) { ovCaption = caption; renderCaption(); }
    buildStrip(); buildAllGrid();
    const nf = ovFrames[ovIdx];
    const liveImg = document.querySelector("#ov-pic > img");
    if (liveImg && !nf.ph && !nf.is_video && !cur.ph && !cur.is_video) {
      // seamless: swap the src once the higher-res image is ready
      const pre = new Image();
      pre.onload = () => { if (document.querySelector("#ov-pic > img") === liveImg) liveImg.src = pre.src; };
      pre.src = img(nf.media_url);
    } else {
      showFrame(ovIdx);
    }
    document.getElementById("ov-ct").textContent = `${ovIdx + 1} / ${ovFrames.length}`;
    document.querySelectorAll("#ov-strip .s").forEach((s, k) => s.classList.toggle("on", k === ovIdx));
    centerStrip();
    warmFrames();
  }
  function renderCaption() {
    const bar = document.getElementById("ov-cap"), txt = document.getElementById("ov-cap-txt"), more = document.getElementById("ov-cap-more");
    bar.classList.remove("exp");
    txt.textContent = ovCaption;
    more.hidden = true;
    if (!ovCaption) return;
    requestAnimationFrame(() => { more.hidden = txt.scrollHeight <= txt.clientHeight + 1; });
  }
  function closeOverlay() {
    ov.classList.remove("open", "loading"); ovPending++; stopSlide();
    document.querySelectorAll("video").forEach(v => v.pause());
  }
  function buildStrip() {
    const strip = document.getElementById("ov-strip");
    strip.innerHTML = "";
    ovFrames.forEach((f, i) => {
      const s = document.createElement("div"); s.className = f.ph ? "s ph sk" : "s";
      if (!f.ph) s.innerHTML = `${f.thumb_url ? `<img src="${esc(img(f.thumb_url))}" alt="">` : ""}${f.is_video ? `<span class="v">${IC_REEL}</span>` : ""}`;
      s.addEventListener("click", () => { if (!f.ph) showFrame(i); });
      strip.appendChild(s);
    });
  }
  function buildAllGrid() {
    const g = document.getElementById("ov-allgrid");
    g.innerHTML = "";
    ovFrames.forEach((f, i) => {
      const c = document.createElement("div"); c.className = f.ph ? "g ph sk" : "g";
      if (!f.ph) c.innerHTML = f.thumb_url ? `<img src="${esc(img(f.thumb_url))}" alt="">` : "";
      c.addEventListener("click", () => { if (!f.ph) { ov.classList.remove("allmode"); showFrame(i); } });
      g.appendChild(c);
    });
  }
  function showFrame(i) {
    ovIdx = Math.max(0, Math.min(ovFrames.length - 1, i));
    const f = ovFrames[ovIdx];
    ovZoom = 1; ovPan = { x: 0, y: 0 };
    document.getElementById("ov-ct").textContent = `${ovIdx + 1} / ${ovFrames.length}`;
    const pic = document.getElementById("ov-pic");
    pic.classList.remove("zoomed");
    const skCls = ovVertical ? "sk v916" : "sk";
    if (f.ph) {
      pic.innerHTML = `<span class="${skCls}"></span>`;
    } else if (f.is_video) {
      // story / highlight video is always 9:16 - keep a placeholder box the same
      // shape behind it so the stage doesn't jump while the video loads
      const poster = f.thumb_url ? ` poster="${esc(img(f.thumb_url))}"` : "";
      pic.innerHTML = `<span class="${skCls}"></span><video src="${esc(f.media_url)}"${poster} controls autoplay playsinline style="opacity:0"></video>`;
      const vid = pic.querySelector("video");
      const ready = () => { const s = pic.querySelector(".sk"); if (s) s.remove(); vid.style.opacity = ""; };
      vid.addEventListener("loadeddata", ready);
      vid.addEventListener("error", ready);
    } else {
      pic.innerHTML = `<span class="${skCls}"></span><img src="${esc(img(f.media_url))}" alt="" style="opacity:0">`;
      const im = pic.querySelector("img");
      im.addEventListener("load", () => { const s = pic.querySelector(".sk"); if (s) s.remove(); im.style.opacity = ""; });
      im.addEventListener("error", () => { const s = pic.querySelector(".sk"); if (s) s.remove(); im.style.opacity = ""; });
    }
    // warm the neighbouring frames so stepping is instant
    for (const j of [ovIdx + 1, ovIdx - 1, ovIdx + 2]) {
      const nf = ovFrames[j];
      if (nf && !nf.ph && !nf.is_video && nf.media_url) { const pre = new Image(); pre.src = img(nf.media_url); }
    }
    document.getElementById("ov-prev").disabled = ovIdx === 0;
    document.getElementById("ov-next").disabled = ovIdx === ovFrames.length - 1;
    document.querySelectorAll("#ov-strip .s").forEach((s, k) => s.classList.toggle("on", k === ovIdx));
    document.querySelectorAll("#ov-allgrid .g").forEach((s, k) => s.classList.toggle("on", k === ovIdx));
    centerStrip();
    const pill = document.getElementById("ov-pill");
    const multi = ovFrames.length > 1;
    const sc = ovOpts.shortcode || (ovSource.match(/instagram\.com\/(?:p|reel|reels|tv)\/([^/?#]+)/) || [])[1];
    const isDone = ovOpts.downloaded || (sc && archState && (archState.done || []).includes(sc));
    if (isDone) {
      pill.innerHTML = `<button class="btn2 g" id="ov-open">${esc(L("archv_open_folder"))}</button>`
        + `<span class="btn2 ok">${esc(L("archv_downloaded_1"))}</span>`;
      pill.querySelector("#ov-open").addEventListener("click", () => {
        const p = (ovOpts.files || [])[0];
        try { window.__TAURI__.core.invoke(p ? "open_containing_folder" : "viewer_window_show", p ? { path: p } : {}); } catch (_) {}
      });
    } else {
      const itemLabel = f.is_video ? L("archv_this_video") : L("archv_this_photo");
      pill.innerHTML = `<button class="btn2" id="ov-dlall">${esc(L("archv_dl_post"))}</button>`
        + (multi ? `<button class="btn2 g" id="ov-dlone">${esc(itemLabel)}</button>` : "");
      pill.querySelector("#ov-dlall").addEventListener("click", () => {
        if (sc && currentUser) grabPost(currentUser, sc); else queue(ovSource);
      });
      const one = pill.querySelector("#ov-dlone");
      if (one) { one.disabled = !!f.ph; one.addEventListener("click", () => { if (!f.ph) queue(f.media_url); }); }
    }
  }
  function centerStrip() {
    const strip = document.getElementById("ov-strip");
    const active = strip.children[ovIdx];
    if (!active) return;
    // active thumb centred in the visible width (naturally left-of-centre on even counts)
    const target = active.offsetLeft - strip.clientWidth / 2 + active.offsetWidth / 2;
    strip.scrollTo({ left: Math.max(0, target), behavior: "smooth" });
  }
  function step(d) { const n = ovIdx + d; if (n < 0 || n >= ovFrames.length) return; showFrame(n); }
  function stopSlide() { if (ovSlideTimer) { clearInterval(ovSlideTimer); ovSlideTimer = null; document.getElementById("ov-slide").style.color = ""; } }
  function applyZoom() {
    if (ovZoom <= 1) { ovZoom = 1; ovPan = { x: 0, y: 0 }; }
    const el = document.querySelector("#ov-pic img");
    if (el) el.style.transform = `translate(${ovPan.x}px, ${ovPan.y}px) scale(${ovZoom})`;
    document.getElementById("ov-pic").classList.toggle("zoomed", ovZoom > 1);
  }
  function setZoom(z) { ovZoom = Math.max(1, Math.min(5, z)); applyZoom(); }

  document.getElementById("ov-close").addEventListener("click", closeOverlay);
  document.getElementById("ov-prev").addEventListener("click", () => step(-1));
  document.getElementById("ov-next").addEventListener("click", () => step(1));
  document.getElementById("ov-zi").addEventListener("click", () => setZoom(ovZoom + 0.5));
  document.getElementById("ov-zo").addEventListener("click", () => setZoom(ovZoom - 0.5));
  document.getElementById("ov-cap-more").addEventListener("click", () => document.getElementById("ov-cap").classList.toggle("exp"));
  const ovStage = document.querySelector(".ovstage");
  ovStage.addEventListener("wheel", e => {
    if (!ov.classList.contains("open")) return;
    const t = e.target;
    if (t && t.tagName === "VIDEO") return;
    e.preventDefault();
    setZoom(ovZoom + (e.deltaY < 0 ? 0.25 : -0.25));
  }, { passive: false });
  ovStage.addEventListener("dblclick", e => {
    if (e.target && e.target.tagName === "VIDEO") return;
    setZoom(ovZoom > 1 ? 1 : 2.5);
  });
  ovStage.addEventListener("pointerdown", e => {
    if (ovZoom <= 1 || (e.target && e.target.tagName === "VIDEO")) return;
    ovDrag = { x: e.clientX, y: e.clientY, px: ovPan.x, py: ovPan.y, moved: false };
    document.getElementById("ov-pic").classList.add("dragging");
    ovStage.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  ovStage.addEventListener("pointermove", e => {
    if (!ovDrag) return;
    const im = document.querySelector("#ov-pic img");
    const lim = im ? { x: (im.clientWidth * (ovZoom - 1)) / 2 + 60, y: (im.clientHeight * (ovZoom - 1)) / 2 + 60 } : { x: 600, y: 600 };
    let nx = ovDrag.px + (e.clientX - ovDrag.x), ny = ovDrag.py + (e.clientY - ovDrag.y);
    ovPan = { x: Math.max(-lim.x, Math.min(lim.x, nx)), y: Math.max(-lim.y, Math.min(lim.y, ny)) };
    ovDrag.moved = true;
    applyZoom();
  });
  let suppressClick = false;
  function endDrag(e) {
    if (!ovDrag) return;
    if (ovDrag.moved) { suppressClick = true; setTimeout(() => { suppressClick = false; }, 350); }
    ovDrag = null;
    document.getElementById("ov-pic").classList.remove("dragging");
    try { ovStage.releasePointerCapture(e.pointerId); } catch (_) {}
  }
  ovStage.addEventListener("pointerup", endDrag);
  ovStage.addEventListener("pointercancel", endDrag);
  // click anywhere that isn't the media / a control closes the viewer.
  // capture phase so a pan-release's synthesised click is swallowed before it bubbles.
  ov.addEventListener("click", e => {
    if (suppressClick || (ovDrag && ovDrag.moved)) { suppressClick = false; e.stopPropagation(); return; }
    if (e.target.closest("button, .ovbar, .ovstrip, .ovallgrid, #ov-cap-more")) return;
    if (e.target.closest("#ov-pic img, #ov-pic video")) return;   // on the photo/video itself - never closes
    closeOverlay();                                      // backdrop / margins / caption bar - closes (even when zoomed)
  }, true);
  document.getElementById("ov-copy").addEventListener("click", async () => { try { await navigator.clipboard.writeText(ovFrames[ovIdx].media_url); toast(L("viewer_copied")); } catch (_) {} });
  document.getElementById("ov-dl").addEventListener("click", () => queue(ovFrames[ovIdx].media_url));
  document.getElementById("ov-slide").addEventListener("click", () => {
    if (ovSlideTimer) return stopSlide();
    document.getElementById("ov-slide").style.color = "var(--accent)";
    ovSlideTimer = setInterval(() => { ovIdx + 1 < ovFrames.length ? step(1) : stopSlide(); }, 3000);
  });
  document.getElementById("ov-fs").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {});
  });
  document.getElementById("ov-gridbtn").addEventListener("click", () => ov.classList.toggle("allmode"));
  document.addEventListener("keydown", e => {
    if (!ov.classList.contains("open")) return;
    if (e.key === "Escape") closeOverlay();
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
  });

  // ---- nav ----
  function goBack() {
    currentUser = null;
    if (postsObserver) { postsObserver.disconnect(); postsObserver = null; }
    profileEl.style.display = "none"; accountsEl.style.display = "block";
    backBtn.style.display = "none"; headTitle.textContent = L("viewer_title");
    document.getElementById("search-wrap").style.display = "";
    clearTimeout(archTimer); archState = null;
    renderAccounts();
  }
  backBtn.addEventListener("click", goBack);
  document.getElementById("refresh-btn").addEventListener("click", () => currentUser ? openProfile(currentUser) : renderAccounts());

  (async () => {
    for (let i = 0; i < 100; i++) {
      try { const s = await window.__TAURI__.core.invoke("get_settings"); applyFont(s.font || "system"); window.I18N.applyLang(s.language || "en"); break; }
      catch { if (i === 99) window.I18N.applyLang("en"); await new Promise(r => setTimeout(r, 150)); }
    }
    headTitle.textContent = L("viewer_title");
    renderAccounts();
  })();
  window.__TAURI__.event.listen("settings-changed", async () => {
    try { const s = await window.__TAURI__.core.invoke("get_settings"); applyFont(s.font || "system"); window.I18N.applyLang(s.language || "en"); if (!currentUser) headTitle.textContent = L("viewer_title"); } catch {}
  });
  window.__TAURI__.event.listen("detection-updated", () => { if (!currentUser) renderAccounts(); });
  setInterval(() => { if (!currentUser && document.visibilityState === "visible") renderAccounts(); }, 15000);
</script>
</body>
