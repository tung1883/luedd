<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>yt-dlp</title>
<style>
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/ibm-plex-mono.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Cascadia Mono"; src: url("fonts/cascadia-mono.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Excalifont"; src: url("fonts/excalifont.woff2") format("woff2"); font-weight: 400 900; font-display: swap; }
  :root {
    --bg: #16171A; --surface: #1E2024; --surface-2: #26282E; --line: #34373E;
    --text: #E7E8EA; --dim: #9A9DA5; --accent: #4FA3D8; --disc: #7FC0E6; --good: #4FD08A; --bad: #F26A63; --warn: #F0A24A;
    --yt: #d8483f; --tw: #9146ff; --vm: #38a0dc;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  * { scrollbar-color: var(--line) transparent; scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  body { font-family: var(--sans); margin: 0; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh; font-size: 13px; }

  header { display: flex; align-items: center; gap: 10px; padding: 11px 16px;
    background: linear-gradient(180deg, #212227, var(--surface)); border-bottom: 1px solid var(--line); }
  header .htitle { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
  .hsearch { flex: 1; min-width: 0; max-width: 340px; margin-left: auto; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 6px; color: var(--text); font: inherit; font-size: 12px; padding: 6px 10px; }
  .hsearch:focus { outline: none; border-color: var(--accent); }
  .hsearch::-webkit-search-cancel-button { -webkit-appearance: none; }
  button { padding: 6px 12px; background: var(--accent); border: 1px solid transparent; color: var(--bg);
    border-radius: 6px; cursor: pointer; font-size: 12px; font-family: var(--sans); font-weight: 600; }
  button.ghost { background: transparent; border-color: var(--line); color: var(--dim); font-weight: 500; }
  button.ghost:hover { color: var(--text); border-color: var(--dim); }
  button:disabled { opacity: .5; cursor: default; }
  .iconbtn { padding: 0; width: 28px; height: 26px; display: flex; align-items: center; justify-content: center; }
  .iconbtn svg { width: 15px; height: 15px; }

  #scroll { flex: 1; overflow-y: auto; }
  .empty { padding: 40px 24px; color: var(--dim); font-size: 13px; text-align: center; line-height: 1.6; }
  .resolving { padding: 9px 16px; color: var(--warn); font-size: 12px; }

  .sb { width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0; display: flex; align-items: center;
    justify-content: center; font-size: 11px; font-weight: 800; color: #fff; text-transform: uppercase; }
  .sb.yt, .sb.youtube { background: var(--yt); }
  .sb.tw, .sb.twitch { background: var(--tw); }
  .sb.vm, .sb.vimeo { background: var(--vm); }
  .sb.other { background: var(--surface-2); color: var(--dim); border: 1px solid var(--line); }
  .sb.sm { width: 15px; height: 15px; border-radius: 4px; font-size: 8px; }
  .sb.ico { background: transparent; border: 0; }
  .sb.ico svg { width: 100%; height: 100%; display: block; }

  .filt { display: flex; gap: 6px; padding: 12px 16px 4px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim);
    cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .chip.on { border-color: var(--accent); color: var(--text); background: rgba(79,163,216,.12); }

  .cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; padding: 10px 16px 16px; }
  .ccard { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--surface);
    display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .ccard:hover { border-color: var(--dim); }
  .ccard .av { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); flex-shrink: 0;
    position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-weight: 700; }
  .ccard .av img { width: 100%; height: 100%; object-fit: cover; }
  .ccard .nm { font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ccard .sub { color: var(--dim); font-size: 10px; margin-top: 3px; }

  /* channel page */
  .chead { display: flex; gap: 14px; padding: 16px 16px 12px; align-items: center; }
  .chead .cav { width: 62px; height: 62px; border-radius: 50%; background: var(--surface-2); flex-shrink: 0;
    position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--dim); font-weight: 700; }
  .chead .cav img { width: 100%; height: 100%; object-fit: cover; }
  .chead .cn { font-size: 16px; font-weight: 700; }
  .chead .cmeta { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .chead .cdl { margin-top: 9px; }
  .sec { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); padding: 8px 16px 4px; }

  .vrow { display: flex; gap: 10px; padding: 9px 16px; border-top: 1px solid var(--line); align-items: flex-start; }
  .vthumb { width: 118px; height: 66px; border-radius: 5px; background: var(--surface-2); flex-shrink: 0;
    position: relative; overflow: hidden; cursor: pointer; }
  .vthumb img { width: 100%; height: 100%; object-fit: cover; }
  .vthumb .dur { position: absolute; right: 4px; bottom: 3px; font-size: 9px; background: rgba(0,0,0,.8);
    color: #fff; padding: 1px 4px; border-radius: 3px; }
  .vbody { flex: 1; min-width: 0; }
  .vtitle { font-size: 12px; font-weight: 600; line-height: 1.35; cursor: pointer;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .vmeta { color: var(--dim); font-size: 10.5px; margin-top: 4px; }
  .vact { display: flex; gap: 6px; margin-top: 7px; align-items: center; }
  select.qsel { font-size: 10.5px; padding: 4px 22px 4px 8px; border-radius: 5px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); appearance: none; font-family: var(--sans);
    background-image: linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position: calc(100% - 12px) 55%, calc(100% - 8px) 55%; background-size: 4px 4px,4px 4px; background-repeat: no-repeat; }
  button.mini { font-size: 11px; padding: 5px 10px; }
  .sk { background: linear-gradient(90deg,#26282e,#31343c,#26282e); background-size: 200% 100%; animation: sh 1.3s linear infinite; border-radius: 4px; }
  @keyframes sh { to { background-position: -200% 0; } }

  /* video detail overlay */
  #ov { position: fixed; inset: 0; display: none; background: rgba(8,8,10,.62); backdrop-filter: blur(10px) saturate(.9);
    flex-direction: column; color: #eee; z-index: 20; }
  #ov.open { display: flex; }
  .ovbar { display: flex; align-items: center; gap: 8px; padding: 12px 14px 6px; }
  .ovbar .tb { width: 34px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    color: #dcdcdc; background: rgba(255,255,255,.06); cursor: pointer; }
  .ovbar .tb:hover { background: rgba(255,255,255,.14); color: #fff; }
  .ovbar .tb svg { width: 17px; height: 17px; }
  .ovbar .sp { flex: 1; }
  #ov-scroll { flex: 1; overflow-y: auto; padding-bottom: 12px; }
  .ovhero { margin: 4px 16px 0; height: 210px; border-radius: 8px; background: var(--surface-2); position: relative; overflow: hidden; }
  .ovhero img { width: 100%; height: 100%; object-fit: cover; }
  .ovhero .dur { position: absolute; right: 8px; bottom: 7px; font-size: 10px; background: rgba(0,0,0,.8); color: #fff;
    padding: 2px 6px; border-radius: 4px; }
  .ovm { padding: 12px 16px 4px; }
  .ovm .t { font-size: 14px; font-weight: 700; line-height: 1.3; }
  .ovm .by { color: #cfcfcf; font-size: 12px; margin-top: 4px; display: flex; align-items: center; gap: 7px; }
  .ovm .desc { color: #a9a9a9; font-size: 11.5px; margin-top: 7px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .fmt { margin: 10px 16px 0; border: 1px solid rgba(255,255,255,.09); border-radius: 8px; overflow: hidden; }
  .fmt .fsec { font-size: 9px; text-transform: uppercase; letter-spacing: .07em; color: #9a9a9a; padding: 7px 12px 4px; }
  .frow { display: flex; align-items: center; gap: 9px; padding: 8px 12px; border-top: 1px solid rgba(255,255,255,.06);
    font-size: 11.5px; cursor: pointer; }
  .frow .rb { width: 13px; height: 13px; border-radius: 50%; border: 1px solid #6a6a6a; flex-shrink: 0; }
  .frow.on .rb { border-color: var(--accent); background: radial-gradient(circle at center, var(--accent) 0 3.5px, transparent 4.5px); }
  .frow .fr { flex: 1; }
  .frow .sz { color: #9a9a9a; }
  .toggs { display: flex; gap: 7px; padding: 12px 16px 4px; flex-wrap: wrap; }
  .tg { font-size: 10.5px; padding: 5px 9px; border-radius: 6px; border: 1px solid rgba(255,255,255,.14); color: #c8c8c8; cursor: pointer; }
  .tg.on { border-color: var(--accent); color: #fff; background: rgba(79,163,216,.16); }
  .ovfoot { display: flex; gap: 8px; padding: 12px 16px 16px; }
  .ovfoot .b2 { font-size: 12px; padding: 9px 16px; border-radius: 7px; font-weight: 600; cursor: pointer; }
  .ovfoot .b2.p { background: var(--accent); color: #000; flex: 1; text-align: center; border: 0; }
  .ovfoot .b2.g { background: rgba(20,20,22,.85); border: 1px solid #4a4a4a; color: #e6e6e6; }

  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px);
    background: #26282e; border: 1px solid var(--line); color: var(--text); font-size: 12px; padding: 8px 14px;
    border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 30; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <header>
    <button id="back-btn" class="ghost iconbtn" style="display:none" title="Back" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="htitle" id="head-title" data-i18n="ytv_title">yt-dlp</span>
    <input id="search" type="search" class="hsearch" data-i18n-placeholder="ytv_search" placeholder="Search channels" />
    <button id="refresh-btn" class="ghost iconbtn" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <div id="scroll">
    <div id="channels"></div>
    <div id="channel" style="display:none"></div>
  </div>

  <div id="ov">
    <div class="ovbar">
      <span class="tb" id="ov-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></span>
      <span class="sp"></span>
      <span class="tb" id="ov-open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg></span>
      <span class="tb" id="ov-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
    </div>
    <div id="ov-scroll"></div>
  </div>

  <div id="toast"></div>

<script src="i18n.js"></script>
<script>
  window.addEventListener("error", e => {
    let bar = document.getElementById("js-error-bar");
    if (!bar) { bar = document.createElement("div"); bar.id = "js-error-bar";
      bar.style.cssText = "position:fixed;left:0;right:0;bottom:0;background:#5a1e1e;color:#fff;font:12px monospace;padding:6px 10px;z-index:99";
      document.body.appendChild(bar); }
    bar.textContent = "JS error: " + (e.message || e.error) + " @ " + (e.filename || "") + ":" + (e.lineno || "");
  });

  const APP = "http://127.0.0.1:8597";
  const L = (k, v) => window.I18N.t(k, v);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  async function get(p) { try { return await (await fetch(APP + p)).json(); } catch { return null; } }
  async function post(p, b) { try { return await (await fetch(APP + p, { method: "POST", body: JSON.stringify(b) })).json(); } catch { return null; } }

  const FONTS = { system: null, georgia: 'Georgia, serif', "ibm-plex-mono": '"IBM Plex Mono", monospace',
    excalifont: '"Excalifont", cursive', "cascadia-mono": '"Cascadia Mono", monospace' };
  function applyFont(k) { const f = FONTS[k], s = document.documentElement.style;
    if (f) { s.setProperty("--sans", f); s.setProperty("--mono", f); } else { s.removeProperty("--sans"); s.removeProperty("--mono"); } }

  let toastTimer = null;
  function toast(m) { const el = document.getElementById("toast"); el.textContent = m; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2200); }

  function siteClass(s) { s = (s || "").toLowerCase();
    if (s.includes("youtu")) return "youtube"; if (s.includes("twitch")) return "twitch";
    if (s.includes("vimeo")) return "vimeo"; return "other"; }
  function siteLetter(s) { const c = siteClass(s); return c === "other" ? (s || "?")[0] : c[0]; }
  function siteName(s) { const c = siteClass(s); return c === "youtube" ? "YouTube" : c === "twitch" ? "Twitch" : c === "vimeo" ? "Vimeo" : (s || "other"); }
  const YT_SVG = `<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill="red" d="M14.712 4.633a1.754 1.754 0 00-1.234-1.234C12.382 3.11 8 3.11 8 3.11s-4.382 0-5.478.289c-.6.161-1.072.634-1.234 1.234C1 5.728 1 8 1 8s0 2.283.288 3.367c.162.6.635 1.073 1.234 1.234C3.618 12.89 8 12.89 8 12.89s4.382 0 5.478-.289a1.754 1.754 0 001.234-1.234C15 10.272 15 8 15 8s0-2.272-.288-3.367z"/><path fill="#fff" d="M6.593 10.11l3.644-2.098-3.644-2.11v4.208z"/></svg>`;
  // small site badge: real logo for YouTube, coloured letter tile otherwise
  function sbHtml(site, small) { const c = siteClass(site);
    if (c === "youtube") return `<span class="sb ico${small ? " sm" : ""}">${YT_SVG}</span>`;
    return `<span class="sb ${small ? "sm " : ""}${c}">${esc(siteLetter(site))}</span>`; }
  function fmtNum(n) { n = Number(n) || 0; if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K"; return String(n); }
  function fmtDur(sec) { sec = Number(sec) || 0; if (!sec) return "";
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = Math.floor(sec % 60);
    return h ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}` : `${m}:${String(s).padStart(2,"0")}`; }
  function fmtDate(d) { if (!d || d.length !== 8) return ""; return `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`; }

  const channelsEl = document.getElementById("channels");
  const channelEl = document.getElementById("channel");
  const backBtn = document.getElementById("back-btn");
  const headTitle = document.getElementById("head-title");
  let currentKey = null;
  let siteFilter = "all";
  let chanQuery = "";
  let lastChanData = null;

  // ---- home: caught channels ----
  async function renderChannels() {
    lastChanData = await get("/yt/channels");
    paintChannels();
  }

  function paintChannels() {
    const data = lastChanData;
    channelsEl.innerHTML = "";
    if (!data) { channelsEl.innerHTML = `<div class="empty">${esc(L("cant_reach"))}</div>`; return; }
    const chans = data.channels || [];
    if (data.unresolved) {
      const r = document.createElement("div"); r.className = "resolving";
      r.textContent = L("ytv_resolving", { n: data.unresolved });
      channelsEl.appendChild(r);
    }
    if (!chans.length) { channelsEl.insertAdjacentHTML("beforeend", `<div class="empty">${esc(L("ytv_empty"))}</div>`); return; }

    const q = chanQuery;
    const matchQ = c => !q || (c.name || "").toLowerCase().includes(q) || (c.key || "").toLowerCase().includes(q);

    const sites = [...new Set(chans.map(c => siteClass(c.site)))];
    const filt = document.createElement("div"); filt.className = "filt";
    const mk = (val, label, cls) => {
      const ch = document.createElement("span");
      ch.className = "chip" + (siteFilter === val ? " on" : "");
      ch.innerHTML = (cls ? sbHtml(val, true) : "") + esc(label);
      ch.addEventListener("click", () => { siteFilter = val; paintChannels(); });
      return ch;
    };
    filt.appendChild(mk("all", `${L("ytv_all_sites")} ${chans.filter(matchQ).length}`, null));
    for (const s of sites) {
      filt.appendChild(mk(s, `${siteName(s)} ${chans.filter(c => siteClass(c.site) === s && matchQ(c)).length}`, s));
    }
    channelsEl.appendChild(filt);

    const shown = chans.filter(c => (siteFilter === "all" || siteClass(c.site) === siteFilter) && matchQ(c));
    if (!shown.length) { channelsEl.insertAdjacentHTML("beforeend", `<div class="empty">${esc(L("ytv_no_match"))}</div>`); return; }

    const grid = document.createElement("div"); grid.className = "cgrid";
    for (const c of shown) {
      const card = document.createElement("div"); card.className = "ccard";
      card.innerHTML =
        `<div class="av">${c.avatar ? `<img src="${esc(c.avatar)}">` : esc((c.name || "?")[0])}</div>`
        + `<div style="min-width:0"><div class="nm">${esc(c.name)}</div><div class="sub">${c.caught_count} ${esc(L("viewer_caught"))} · ${esc(siteName(c.site))}</div></div>`;
      card.addEventListener("click", () => openChannel(c.key));
      grid.appendChild(card);
    }
    channelsEl.appendChild(grid);
  }

  {
    const se = document.getElementById("search");
    se.addEventListener("input", () => { chanQuery = se.value.trim().toLowerCase(); paintChannels(); });
  }

  // ---- channel page ----
  async function openChannel(key) {
    currentKey = key;
    channelsEl.style.display = "none";
    channelEl.style.display = "block";
    backBtn.style.display = "flex";
    document.getElementById("search").style.display = "none";
    document.getElementById("scroll").scrollTop = 0;
    channelEl.innerHTML = `<div class="chead"><div class="cav sk"></div><div><div class="cn sk" style="width:160px;height:16px"></div></div></div>`;

    const r = await post("/yt/channel", { key });
    if (key !== currentKey) return;
    if (!r || r.error) { channelEl.innerHTML = `<div class="empty">${esc((r && r.error) || L("cant_reach"))}</div>`; return; }
    const ch = r.channel, vids = r.videos || [];
    headTitle.textContent = ch.name;
    let html =
      `<div class="chead">`
      + `<div class="cav">${ch.avatar ? `<img src="${esc(ch.avatar)}">` : esc((ch.name || "?")[0])}</div>`
      + `<div><div class="cn">${esc(ch.name)}</div>`
      + `<div class="cmeta">${esc(ch.channel_url || siteName(ch.site))}</div>`
      + `<div class="cdl"><button id="dl-all">${esc(L("ytv_dl_all", { n: vids.length }))}</button></div></div></div>`
      + `<div class="sec">${esc(L("ytv_videos"))}</div>`;
    for (const v of vids) html += videoRow(v);
    channelEl.innerHTML = html;

    channelEl.querySelector("#dl-all").addEventListener("click", async () => {
      for (const v of vids) await post("/yt/queue", { url: v.url });
      toast(L("ytv_queued"));
    });
    channelEl.querySelectorAll(".vrow").forEach((row, i) => wireRow(row, vids[i]));
  }

  function videoRow(v) {
    const meta = v.resolved
      ? `${esc(v.uploader || "")}${v.upload_date ? " · " + fmtDate(v.upload_date) : ""}${v.view_count ? " · " + fmtNum(v.view_count) + " views" : ""}`
      : `<span class="sk" style="display:inline-block;width:120px;height:9px"></span>`;
    return `<div class="vrow" data-url="${esc(v.url)}">`
      + `<div class="vthumb">${v.thumbnail ? `<img src="${esc(v.thumbnail)}">` : ""}${v.duration ? `<span class="dur">${esc(fmtDur(v.duration))}</span>` : ""}</div>`
      + `<div class="vbody"><div class="vtitle">${esc(v.title || v.url)}</div>`
      + `<div class="vmeta">${meta}</div>`
      + `<div class="vact"><select class="qsel"><option value="">${esc(L("ytv_dl"))} …</option></select>`
      + `<button class="mini" data-dl>${esc(L("ytv_dl"))}</button></div></div></div>`;
  }

  function wireRow(row, v) {
    const url = v.url;
    const sel = row.querySelector(".qsel");
    const dl = row.querySelector("[data-dl]");
    let loaded = false;
    const loadFormats = async () => {
      if (loaded) return; loaded = true;
      const r = await post("/yt/video", { url });
      const fmts = (r && r.formats) || [];
      for (const f of fmts) { const o = document.createElement("option"); o.value = f.variant_key; o.textContent = f.label; sel.appendChild(o); }
    };
    sel.addEventListener("mousedown", loadFormats, { once: true });
    row.querySelector(".vthumb").addEventListener("click", () => openVideo(url));
    row.querySelector(".vtitle").addEventListener("click", () => openVideo(url));
    dl.addEventListener("click", async () => {
      const r = await post("/yt/queue", { url, quality: sel.value || undefined });
      toast(r && r.queued ? L("ytv_queued") : L("cant_reach"));
    });
  }

  // ---- video detail overlay ----
  const ov = document.getElementById("ov");
  const ovScroll = document.getElementById("ov-scroll");
  let ovState = null;

  async function openVideo(url) {
    ov.classList.add("open");
    ovScroll.innerHTML = `<div class="ovhero sk"></div><div class="ovm"><div class="t sk" style="height:16px;width:80%"></div></div>`;
    const r = await post("/yt/video", { url });
    if (!r || r.error) { ovScroll.innerHTML = `<div class="empty">${esc((r && r.error) || L("cant_reach"))}</div>`; return; }
    ovState = { url, meta: r.meta, quality: null, subs: null, thumbnail: false, chapters: false };
    renderOverlay(r.meta, r.formats || []);
  }

  function renderOverlay(m, formats) {
    const groups = { prog: [], mux: [], audio: [] };
    for (const f of formats) {
      const hasRes = f.resolution && f.resolution[1];
      if (/audio only/i.test(f.label)) groups.audio.push(f);
      else if (f.variant_key.includes("+")) groups.mux.push(f);
      else if (hasRes) groups.prog.push(f);
      else groups.mux.push(f);
    }
    const section = (title, arr) => arr.length
      ? `<div class="fsec">${esc(title)}</div>` + arr.map(f =>
          `<div class="frow" data-vk="${esc(f.variant_key)}"><span class="rb"></span><span class="fr">${esc(f.label)}</span>`
          + `<span class="sz">${f.bandwidth ? "~" + Math.round(f.bandwidth / 8000) + " kB/s" : ""}</span></div>`).join("")
      : "";

    ovScroll.innerHTML =
      `<div class="ovhero">${m.thumbnail ? `<img src="${esc(m.thumbnail)}">` : ""}${m.duration ? `<span class="dur">${esc(fmtDur(m.duration))}</span>` : ""}</div>`
      + `<div class="ovm"><div class="t">${esc(m.title)}</div>`
      + `<div class="by">${sbHtml(m.extractor || m.channel_url || "", true)}`
      + `${esc(m.channel || m.uploader || "")}${m.view_count ? " · " + fmtNum(m.view_count) + " views" : ""}${m.upload_date ? " · " + fmtDate(m.upload_date) : ""}</div>`
      + `${m.description ? `<div class="desc">${esc(m.description)}</div>` : ""}</div>`
      + `<div class="fmt">${section(L("ytv_progressive"), groups.prog)}${section(L("ytv_muxed"), groups.mux)}${section(L("ytv_audio_only"), groups.audio)}</div>`
      + `<div class="toggs">`
      + `<span class="tg" data-tg="subs">${esc(L("ytv_subs"))}: en</span>`
      + `<span class="tg" data-tg="thumbnail">${esc(L("ytv_thumb"))}</span>`
      + `<span class="tg" data-tg="chapters">${esc(L("ytv_chapters"))}</span></div>`
      + `<div class="ovfoot"><span class="b2 p" id="ov-dl">${esc(L("ytv_dl"))}</span>`
      + `<span class="b2 g" id="ov-add">${esc(L("ytv_add_queue"))}</span></div>`;

    ovScroll.querySelectorAll(".frow").forEach(r => r.addEventListener("click", () => {
      ovScroll.querySelectorAll(".frow").forEach(x => x.classList.remove("on"));
      r.classList.add("on"); ovState.quality = r.dataset.vk;
    }));
    ovScroll.querySelectorAll(".tg").forEach(t => t.addEventListener("click", () => {
      t.classList.toggle("on");
      const on = t.classList.contains("on");
      if (t.dataset.tg === "subs") ovState.subs = on ? "en" : null;
      else ovState[t.dataset.tg] = on;
    }));
    const send = async () => {
      const r = await post("/yt/queue", {
        url: ovState.url, quality: ovState.quality || undefined,
        subs: ovState.subs || undefined, thumbnail: ovState.thumbnail, chapters: ovState.chapters,
      });
      toast(r && r.queued ? L("ytv_queued") : L("cant_reach"));
    };
    ovScroll.querySelector("#ov-dl").addEventListener("click", send);
    ovScroll.querySelector("#ov-add").addEventListener("click", send);
  }

  function closeOverlay() { ov.classList.remove("open"); ovState = null; }
  document.getElementById("ov-back").addEventListener("click", closeOverlay);
  document.getElementById("ov-close").addEventListener("click", closeOverlay);
  document.getElementById("ov-open").addEventListener("click", () => {
    if (ovState) window.__TAURI__.core.invoke("open_external_url", { url: ovState.meta.webpage_url || ovState.url });
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && ov.classList.contains("open")) closeOverlay(); });

  // ---- nav ----
  function goBack() {
    currentKey = null;
    channelEl.style.display = "none"; channelsEl.style.display = "block";
    backBtn.style.display = "none"; headTitle.textContent = L("ytv_title");
    document.getElementById("search").style.display = "";
    renderChannels();
  }
  backBtn.addEventListener("click", goBack);
  document.getElementById("refresh-btn").addEventListener("click", () => currentKey ? openChannel(currentKey) : renderChannels());

  (async () => {
    for (let i = 0; i < 100; i++) {
      try { const s = await window.__TAURI__.core.invoke("get_settings"); applyFont(s.font || "system"); window.I18N.applyLang(s.language || "en"); break; }
      catch { if (i === 99) window.I18N.applyLang("en"); await new Promise(r => setTimeout(r, 150)); }
    }
    headTitle.textContent = L("ytv_title");
    renderChannels();
  })();
  window.__TAURI__.event.listen("settings-changed", async () => {
    try { const s = await window.__TAURI__.core.invoke("get_settings"); applyFont(s.font || "system"); window.I18N.applyLang(s.language || "en"); if (!currentKey) headTitle.textContent = L("ytv_title"); } catch {}
  });
  window.__TAURI__.event.listen("yt-library-updated", () => { if (!currentKey) renderChannels(); });
  setInterval(() => { if (document.visibilityState === "visible") { if (currentKey) openChannel(currentKey); else renderChannels(); } }, 15000);
</script>
</body>
</html>
