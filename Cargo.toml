[workspace]
resolver = "2"
members = [
    "crates/luedd-net",
    "crates/luedd-media",
    "crates/luedd-core",
    "crates/luedd-cli",
    "crates/luedd-ipc",
    "luedd-app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate"] }
wreq = { version = "=0.15.3", default-features = false, features = ["gzip", "brotli", "deflate", "stream", "webpki-roots"] }
wreq-util = "=0.1.0"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
bytes = "1"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
tracing = "0.1"
tracing-subscriber = "0.3"
roxmltree = "0.20"
regex = "1"
once_cell = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
