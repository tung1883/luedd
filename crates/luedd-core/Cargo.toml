[package]
name = "luedd-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
futures.workspace = true
chrono.workspace = true
uuid = { version = "1", features = ["v4"] }
url.workspace = true
sha2 = "0.10"
trash = "5"
walkdir = "2"
librqbit = { workspace = true, optional = true }
librqbit-core = { workspace = true, optional = true }
luedd-net = { path = "../luedd-net" }
luedd-media = { path = "../luedd-media" }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[features]
default = ["torrent"]
torrent = ["dep:librqbit", "dep:librqbit-core"]
# only used by examples/bench_download.rs to pick the new code paths
bench_new = []
