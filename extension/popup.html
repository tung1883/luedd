<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <script src="popup.js"></script>
</head>

<body style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background: #16171A; color: #E7E8EA; min-width: 400px; max-width: 400px; overflow-x: hidden;">
  <style>
    :root {
      --bg: #16171A; --surface: #1E2024; --surface-2: #26282E; --line: #34373E;
      --text: #E7E8EA; --dim: #9A9DA5; --accent: #4FA3D8; --disc: #7FC0E6;
      --good: #4FD08A; --bad: #F26A63;
      --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    * { scrollbar-color: var(--line) transparent; scrollbar-width: thin; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background: #474a52; }
    a { color: var(--disc); }
    button { padding: 6px 12px; background: var(--accent); border: 1px solid transparent; color: var(--bg);
      border-radius: 6px; cursor: pointer; font-size: 12px; font-family: var(--sans); font-weight: 600; }
    button.secondary { background: transparent; border-color: var(--line); color: var(--dim); font-weight: 500; }
    button.secondary:hover { color: var(--text); border-color: var(--dim); }
    button.danger { background: transparent; border-color: rgba(242,106,99,.4); color: var(--bad); font-weight: 500; }
    button.danger:hover { background: var(--bad); color: var(--bg); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 7px 9px; background: var(--surface);
      border: 1px solid var(--line); color: var(--text); border-radius: 6px; font-size: 12px; font-family: var(--sans); }
    input[type=text]::placeholder { color: var(--dim); }
    input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; }
    #list { min-height: 200px; max-height: 400px; overflow-y: auto; }
    .empty { padding: 22px; color: var(--dim); font-size: 13px; text-align: center; }
    .row { display: grid; grid-template-columns: 14px 74px minmax(0,1fr) auto; gap: 10px;
      padding: 9px 14px 9px 12px; border-bottom: 1px solid var(--line); border-left: 2px solid transparent;
      align-items: center; }
    .row:hover { background: var(--surface); border-left-color: var(--accent);
      box-shadow: inset 3px 0 8px -4px rgba(79,163,216,.5); }
    .toggle-btn { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 11px; padding: 0; align-self: center; }
    .toggle-btn:hover { color: var(--text); }
    .row-preview { width: 74px; height: 44px; border-radius: 4px; border: 1px solid var(--line); overflow: hidden;
      background: linear-gradient(135deg, #242730, #2b2f38); display: flex; align-items: center; justify-content: center; }
    .thumb { width: 74px; height: 44px; object-fit: cover; display: block; cursor: pointer; }
    .row-body { min-width: 0; }
    .title-btn { background: none; border: none; color: var(--text); cursor: pointer; text-align: left; font-size: 13px;
      padding: 0; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .title-btn:hover { color: var(--disc); }
    .info-text { display: block; font-family: var(--mono); font-size: 11px; color: var(--dim); margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-actions { display: flex; gap: 6px; align-self: center; }
    .add-btn { background: var(--accent); border: 1px solid var(--accent); color: var(--bg); font-weight: 600;
      border-radius: 5px; font-size: 11px; padding: 4px 11px; cursor: pointer; font-family: var(--sans); white-space: nowrap; }
    .add-btn:hover { filter: brightness(1.08); }
    .details-panel { display: none; grid-column: 2 / -1; margin-top: 8px; padding-top: 8px;
      border-top: 1px dashed var(--line); font-size: 12px; color: var(--dim); min-width: 0; }
    .details-panel.open { display: block; }
    .copyable-line { font-family: var(--mono); font-size: 11px; display: flex; overflow: hidden; cursor: pointer; margin-bottom: 4px; max-width: 100%; }
    .cl-label { flex: 0 0 auto; margin-right: 4px; }
    .cl-origin { flex: 0 0 auto; white-space: nowrap; }
    .cl-mid { flex: 0 200 auto; min-width: 1.6ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cl-tail { flex: 0 1 auto; min-width: 3ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .quality-box { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
    .quality-box button { background: none; border: none; color: var(--disc); cursor: pointer; text-align: left; font-size: 12px; font-weight: 400; padding: 1px 0; }
    label.checkbox { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); cursor: pointer; }

    .srch { position: relative; display: block; }
    .srch input { padding-right: 34px; }
    .funnel { position: absolute; right: 4px; top: 4px; background: none; border: 0; color: var(--dim);
      cursor: pointer; padding: 4px 5px; border-radius: 4px; line-height: 0; }
    .funnel svg { width: 15px; height: 15px; display: block; }
    .funnel:hover { color: var(--text); background: var(--surface-2); }
    .funnel.on { color: var(--accent); }
    .funnel .fdot { position: absolute; top: 2px; right: 2px; width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent); display: none; }
    .funnel.active .fdot { display: block; }
    .filter-drawer { display: none; margin-top: 8px; }
    .filter-drawer.open { display: block; }
    .fd-row { display: flex; gap: 8px; align-items: end; }
    .fd-fld { flex: 1 1 0; min-width: 0; display: block; }
    .fd-lbl { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: 4px; }
    .fd-fld input[type=text] { padding: 7px 9px; }
    .dd { position: relative; }
    .dd-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 6px; color: var(--text);
      font-family: var(--sans); font-size: 12px; font-weight: 400; padding: 7px 9px; cursor: pointer; }
    .dd-btn:hover { border-color: var(--dim); }
    .dd.open .dd-btn { border-color: transparent; outline: 2px solid var(--accent); outline-offset: 1px; }
    .dd-btn svg { color: var(--dim); flex-shrink: 0; transition: transform .12s; }
    .dd.open .dd-btn svg { transform: rotate(180deg); }
    .dd-list { position: absolute; left: 0; right: 0; top: calc(100% + 5px); z-index: 20; margin: 0; padding: 4px;
      list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
      box-shadow: 0 14px 36px rgba(0,0,0,.5); display: none; max-height: 240px; overflow-y: auto; }
    .dd.open .dd-list { display: block; }
    .dd-list li { padding: 7px 9px; border-radius: 5px; font-size: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .dd-list li:hover { background: var(--surface-2); }
    .dd-list li[aria-selected="true"] { color: var(--accent); }
    .dd-list li[aria-selected="true"]::after { content: "\2713"; font-size: 11px; }
    .filter-status { display: flex; align-items: center; gap: 6px; margin-top: 7px; font-size: 11px; color: var(--dim); }
    .fs-reset { background: none; border: 0; color: var(--disc); cursor: pointer; margin-left: auto; font-size: 11px; padding: 0; font-family: var(--sans); font-weight: 400; }
    .fs-reset:hover { text-decoration: underline; }
  </style>

  <div style="display: flex; align-items: center; gap: 9px; border-bottom: 1px solid var(--line); padding: 12px 15px; background: linear-gradient(180deg, #212227, var(--surface)); box-shadow: 0 1px 0 rgba(255,255,255,.04);">
    <img src="icon128.png" alt="" style="width: 20px; height: 20px; border-radius: 5px;" />
    <span style="font-size: 15px; font-weight: 700;">L<span style="color: var(--accent);">ü</span>dd</span>
    <button id="refresh" class="secondary" title="Refresh" aria-label="Refresh"
      style="margin-left: auto; padding: 5px 7px; line-height: 0;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>

  <div id="mon-banner" style="display:none; padding: 9px 15px; font-size: 12px; line-height: 1.45;
    background: rgba(240,162,74,.12); border-bottom: 1px solid var(--line); color: #F0A24A;">
    Browser monitoring is off. Turn it back on in Lüdd's detection panel.
  </div>
  <div id="conn-banner" style="display:none; padding: 9px 15px; font-size: 12px; line-height: 1.45;
    background: rgba(242,106,99,.12); border-bottom: 1px solid var(--line); color: #F26A63;">
    Can't reach Lüdd &mdash; start the desktop app. Showing the last known links.
  </div>

  <div id="content">
    <div style="padding: 10px 15px;">
      <span class="srch">
        <input id="search-input" type="text" placeholder="Filter by name or site&hellip;">
        <button type="button" class="funnel" id="filter-toggle" title="Filters" aria-label="Filters">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path></svg>
          <span class="fdot"></span>
        </button>
      </span>
      <div class="filter-drawer" id="filter-drawer">
        <div class="fd-row">
          <div class="fd-fld"><span class="fd-lbl">Type</span>
            <div class="dd" id="filter-type" data-value="all">
              <button type="button" class="dd-btn"><span class="dd-cur">All types</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
              <ul class="dd-list">
                <li data-value="all">All types</li>
                <li data-value="video">Video</li>
                <li data-value="image">Image</li>
                <li data-value="audio">Audio</li>
                <li data-value="hls">HLS</li>
                <li data-value="dash">DASH</li>
                <li data-value="doc">Document</li>
              </ul>
            </div>
          </div>
          <label class="fd-fld"><span class="fd-lbl">Hide</span>
            <input id="filter-hide" type="text" placeholder="e.g. ytimg, .vtt">
          </label>
        </div>
      </div>
      <div class="filter-status" id="filter-status" style="display:none">
        <span id="filter-count"></span>
        <button type="button" class="fs-reset" id="filter-reset">Reset filters</button>
      </div>
    </div>
    <div id="list"></div>
    <div style="padding: 12px 15px; display: flex; gap: 8px;">
      <button id="format" class="secondary" style="flex: 1;">More formats</button>
      <button id="clear" class="danger" style="flex: 1;">Clear items</button>
    </div>
  </div>

  <div style="border-top: 1px solid var(--line); padding: 12px 15px; background: var(--surface);">
    <label class="checkbox">
      <input type="checkbox" id="chk">
      Browser monitoring
    </label>
  </div>
</body>

</html>
